name: Gradle tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install frontend tooling
        run: npm ci

      - name: Rebuild frontend assets
        run: npm run build:frontend && npm run test:3d

      - name: Verify generated frontend assets are committed
        run: git diff --exit-code -- src/main/resources/static/css/app.css src/main/resources/static/css/bundles src/main/resources/static/js/public/logo-experience.bundle.js src/main/resources/static/js/public/logo-experience.bundle.js.LEGAL.txt

      - name: Run tests
        run: ./gradlew test
