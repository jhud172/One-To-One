ui.02953 = Willkommen zurück. Ich bin Charlie, Ihr erstklassiger One To One-Assistent. Ich kann Ihr Training, Ihren Fortschritt, Ihre Planung und Ihre Plattformnavigation in Echtzeit steuern. Wählen Sie Ihren Stil im Pro Chat: Trainer, Freund oder Profi.
# universal-fragments/chat/chat-widget.html:154
ui.02954 = Willkommen zurück. Ich bin Charlie, Ihr One To One-Kundenassistent. Beim Starter-Zugriff stehen Ihnen 15 Eingabeaufforderungen pro Tag zur Verfügung. Ich kann Fragen beantworten, Funktionen erklären und Sie zu Seiten wie Abonnements, Zielen und Kalender führen.
# universal-fragments/chat/chat-widget.html:161
ui.02955 = Willkommenscoach. Ich bin Charlie, Ihr Premium-Trainerassistent. Ich kann Ihnen bei der Verwaltung von Kundenabläufen, der Planung und der Plattformnavigation helfen und gleichzeitig dafür sorgen, dass die Antworten sicher und professionell sind.
# universal-fragments/chat/chat-widget.html:168
ui.02956 = Willkommenscoach. Ich bin Charlie. Beim Starter-Zugriff stehen Ihnen 15 Eingabeaufforderungen pro Tag zur Verfügung. Ich kann bei der Kundenberatung, Seitennavigation und Funktionsanleitungen helfen, aber für erweiterte In-App-Aktionen ist Premium erforderlich.
# universal-fragments/chat/chat-widget.html:175
ui.02957 = Willkommen Fitnessstudio-Administrator. Ich bin Charlie, Ihr erstklassiger Betriebsassistent. Ich kann die Aufsicht des Trainers, die Betriebsplanung und die schnelle Navigation durch Ihren Arbeitsbereich mit sicheren Leitplanken unterstützen.
