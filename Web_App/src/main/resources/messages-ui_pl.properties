ui.01553 = W jaki sposób weryfikowani są trenerzy?
# public-views/public/faq.html:32
ui.01554 = Każdy profil trenera jest ręcznie sprawdzany pod kątem referencji i zgodności, zanim zostanie wymieniony jako zweryfikowany.
# public-views/public/faq.html:36
ui.01555 = Jaka jest różnica między Charliem a prawdziwym trenerem?
# public-views/public/faq.html:40
ui.01556 = Charlie oferuje natychmiastową platformę i wskazówki szkoleniowe. Sprawdzony trener zapewnia indywidualne programowanie, bezpośrednią informację zwrotną i odpowiedzialność ludzką.
# public-views/public/faq.html:44
ui.01557 = Jak działają płatności?
# public-views/public/faq.html:48
ui.01558 = Płatności za platformę i coaching są obsługiwane za pośrednictwem One To One. Opłaty, zwroty kosztów i zmiany subskrypcji są rejestrowane w historii Twojego konta.
# public-views/public/faq.html:52
ui.01559 = Czy mogę zmienić trenera?
# public-views/public/faq.html:56
ui.01560 = Tak. Klient może mieć w danym momencie jednego aktywnego trenera i może zmienić tę relację w trakcie procesu zarządzania coachingiem.
# public-views/public/faq.html:60
ui.01561 = W jaki sposób przetwarzane są moje dane?
# public-views/public/faq.html:64
