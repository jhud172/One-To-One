# universal-fragments/chat/chat-widget.html:147
ui.02953 = Witamy z powrotem. Jestem Charlie, twój asystent premium One To One. Mogę poprowadzić Twój trening, postępy, planowanie i nawigację po platformie w czasie rzeczywistym. Wybierz swój styl w Pro Chat: trener, przyjaciel lub profesjonalista.
# universal-fragments/chat/chat-widget.html:154
ui.02954 = Witamy z powrotem. Jestem Charlie, twój asystent klienta One To One. W ramach dostępu Starter masz 15 monitów dziennie. Mogę odpowiedzieć na pytania, wyjaśnić funkcje i poprowadzić Cię do stron takich jak subskrypcje, cele i kalendarz.
# universal-fragments/chat/chat-widget.html:161
ui.02955 = Witamy trenerze. Jestem Charlie, twój asystent trenera premium. Mogę pomóc Ci zarządzać przepływem pracy, planowaniem i nawigacją po platformie, zapewniając jednocześnie bezpieczeństwo i profesjonalizm odpowiedzi.
# universal-fragments/chat/chat-widget.html:168
ui.02956 = Witamy trenerze. Jestem Charlie. W ramach dostępu Starter masz 15 monitów dziennie. Mogę pomóc w udzielaniu wskazówek klientom, nawigacji po stronach i oprowadzaniu po funkcjach, ale zaawansowane działania w aplikacji wymagają wersji Premium.
# universal-fragments/chat/chat-widget.html:175
ui.02957 = Witamy administratora siłowni. Jestem Charlie, twój asystent operacyjny premium. Mogę wspierać nadzór trenera, planowanie operacyjne i szybką nawigację w miejscu pracy za pomocą bezpiecznych poręczy.
# universal-fragments/chat/chat-widget.html:182
ui.02958 = Witamy administratora siłowni. Jestem Charlie. W ramach dostępu Starter masz 15 monitów dziennie. Mogę kierować funkcjami i szybko kierować Cię na właściwe strony, podczas gdy zaawansowane zautomatyzowane działania pozostają Premium.
# universal-fragments/chat/chat-widget.html:189
ui.02959 = Cześć, jestem Charlie, twój asystent One To One. Mogę pomóc w planowaniu, postępie i nawigacji po platformie.
# universal-fragments/chat/chat-widget.html:195
