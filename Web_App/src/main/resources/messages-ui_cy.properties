# universal-fragments/chat/chat-widget.html:147
ui.02953 = Croeso yn ôl. Fi yw Charlie, eich cynorthwyydd premiwm One To One. Gallaf arwain eich hyfforddiant, cynnydd, cynllunio, a llywio platfform mewn amser real. Dewiswch eich steil yn Pro Chat: hyfforddwr, ffrind neu weithiwr proffesiynol.
# universal-fragments/chat/chat-widget.html:154
ui.02954 = Croeso yn ôl. Fi yw Charlie, eich cynorthwyydd cleient One To One. Mae gennych 15 anogwr y dydd ar fynediad Starter. Gallaf ateb cwestiynau, esbonio nodweddion, a'ch arwain at dudalennau fel tanysgrifiadau, nodau a chalendr.
# universal-fragments/chat/chat-widget.html:161
ui.02955 = Hyfforddwr croeso. Fi yw Charlie, eich cynorthwyydd hyfforddwr premiwm. Gallaf eich helpu i reoli llifoedd gwaith cleientiaid, cynllunio, a llywio platfform wrth gadw ymatebion yn ddiogel ac yn broffesiynol.
# universal-fragments/chat/chat-widget.html:168
ui.02956 = Hyfforddwr croeso. Charlie ydw i. Mae gennych 15 anogwr y dydd ar fynediad Starter. Gallaf helpu gydag arweiniad cleientiaid, llywio tudalennau, a llwybrau nodwedd, ond mae angen Premiwm ar gyfer camau gweithredu uwch yn yr ap.
# universal-fragments/chat/chat-widget.html:175
ui.02957 = Croeso i weinyddwr y gampfa. Charlie ydw i, eich cynorthwyydd gweithrediadau premiwm. Gallaf gefnogi goruchwyliaeth hyfforddwr, cynllunio gweithredol, a llywio cyflym ar draws eich gweithle gyda rheiliau gwarchod.
# universal-fragments/chat/chat-widget.html:182
