<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(#{ui.02224}, null, ~{::content}, null)}">
<div th:fragment="content" class="merch-workspace-v2 merch-orders-v2 mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
    <header class="merch-history-header">
        <div><h1 th:text="#{ui.02199}">Your Orders</h1><p th:text="#{ui.orders.historyHint}"></p></div>
        <nav class="merch-order-nav"><a th:href="@{/merch}" th:text="#{ui.02044}"></a><a th:href="@{/profile}" th:text="#{ui.00571}"></a></nav>
    </header>
    <p th:if="${orderSuccess}" class="merch-feedback" role="status" th:text="${orderSuccess}"></p>
    <p th:if="${orderError}" class="merch-feedback merch-history-error" role="alert" th:text="${orderError}"></p>
    <p th:if="${checkoutError}" class="merch-feedback" role="status" th:text="${checkoutError}"></p>
    <p th:if="${historyFilterInvalid}" class="merch-feedback merch-history-error" role="alert" th:text="#{ui.orders.filtersInvalid}"></p>

    <form th:action="@{/orders#order-results}" method="get" class="merch-history-filters">
        <div><label for="order-search" th:text="#{ui.02201}"></label><input id="order-search" maxlength="120" type="search" name="search" th:value="${search}" th:placeholder="#{ui.02201}"></div>
        <div><label for="order-status" th:text="#{ui.orders.deliveryStatus}"></label><select id="order-status" name="status">
            <option value="" th:selected="${statusFilter == ''}" th:text="#{ui.02202}"></option>
            <option th:each="shipping : ${shippingStatuses}" th:value="${shipping}" th:selected="${statusFilter == shipping.name()}" th:text="${#messages.msg(shippingLabels[shipping.name()])}"></option>
            <option th:if="${unknownShippingStatus}" th:value="${statusFilter}" selected th:text="${statusFilter}"></option>
        </select></div>
        <button type="submit" class="btn btn--primary" th:text="#{ui.00260}"></button>
        <a th:href="@{/orders}" class="btn btn--secondary" th:text="#{ui.00563}"></a>
    </form>
    <p id="order-results" tabindex="-1" class="merch-history-range" th:text="#{ui.library.resultsRange(${firstOrder},${lastOrder},${historyPage.totalElements})}"></p>

    <section th:if="${orders.isEmpty()}" class="merch-history-empty" th:attr="aria-label=#{ui.02199}">
        <h2 th:text="${ownedOrderCount == 0} ? #{ui.00899} : #{ui.02222}"></h2>
        <p th:text="${ownedOrderCount == 0} ? #{ui.orders.emptyHint} : #{ui.02223}"></p>
        <a th:href="@{/merch}" class="btn btn--secondary" th:text="#{ui.02044}"></a>
    </section>

    <section th:if="${!orders.isEmpty()}" class="merch-history-list" th:attr="aria-label=#{ui.02199}">
        <article th:each="order : ${orders}" class="order-card merch-history-card" th:attr="aria-labelledby=${'order-title-' + order.id},data-order-id=${order.id}">
            <header class="merch-history-card-header">
                <div><p th:text="#{ui.00901}"></p><h2 th:id="${'order-title-' + order.id}" th:text="${'#' + order.id}" dir="ltr"></h2><time th:datetime="${order.createdAt}" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy')}"></time></div>
                <dl class="merch-history-status">
                    <div><dt th:text="#{ui.orders.deliveryStatus}"></dt><dd th:text="${order.paymentProvider == 'SIMULATED'} ? #{ui.orders.demoDelivery} : ${#messages.msg(shippingLabels[order.shippingStatus.name()])}"></dd></div>
                    <div><dt th:text="#{ui.02209}"></dt><dd th:text="${#messages.msg(paymentLabels[order.paymentStatus.name()])}"></dd></div>
                </dl>
            </header>
            <p th:if="${order.paymentProvider == 'SIMULATED'}" class="merch-history-demo" th:text="#{ui.02210}"></p>
            <p th:if="${order.paymentStatus.name() == 'PENDING_PAYMENT' and order.paymentProvider != null and order.paymentProvider != 'SIMULATED' and order.paymentReference == null}" class="merch-feedback" th:text="#{ui.merch.uncertainCheckout}"></p>
            <ul class="merch-history-items">
                <li th:each="item : ${order.items}"><div><strong dir="auto" th:text="${#strings.isEmpty(item.productNameSnapshot)} ? #{ui.orders.itemUnavailable} : ${item.productNameSnapshot}"></strong><span th:text="#{ui.02025}"></span><span dir="ltr" th:text="${item.quantity}"></span></div><span dir="ltr" th:text="${'£' + #numbers.formatDecimal(item.lineTotal, 1, 2)}"></span></li>
            </ul>
            <section th:if="${order.paymentProvider != 'SIMULATED' and (!#strings.isEmpty(order.trackingNumber) or order.shippedAt != null or order.deliveredAt != null or order.estimatedDeliveryDate != null)}" class="merch-history-shipping">
                <h3 th:text="#{ui.02211}"></h3><dl>
                    <div th:if="${!#strings.isEmpty(order.trackingNumber)}"><dt th:text="#{ui.02212}"></dt><dd dir="auto" th:text="${order.trackingNumber}"></dd></div>
                    <div th:if="${order.shippedAt != null}"><dt th:text="#{ui.02213}"></dt><dd th:text="${#temporals.format(order.shippedAt, 'dd MMM yyyy')}"></dd></div>
                    <div th:if="${order.estimatedDeliveryDate != null}"><dt th:text="#{ui.02214}"></dt><dd th:text="${#temporals.format(order.estimatedDeliveryDate, 'dd MMM yyyy')}"></dd></div>
                    <div th:if="${order.deliveredAt != null}"><dt th:text="#{ui.02206}"></dt><dd th:text="${#temporals.format(order.deliveredAt, 'dd MMM yyyy')}"></dd></div>
                </dl>
            </section>
            <div class="merch-history-total"><span th:text="#{ui.02216}"></span><strong dir="ltr" th:text="${'£' + #numbers.formatDecimal(order.totalAmount, 1, 2)}"></strong></div>
            <div th:if="${order.paymentStatus.name() == 'PENDING_PAYMENT'}" class="merch-history-actions">
                <a th:if="${order.checkoutKey != null and #lists.size(order.items) == 1 and order.items[0].product != null}" th:href="@{/merch/{id}/buy(id=${order.items[0].product.id},orderId=${order.id})}" class="btn btn--secondary" th:text="#{ui.merch.resumeCheckout}"></a>
                <form method="post" th:action="@{/merch/checkout/cancel}" th:attr="data-confirm=#{ui.merch.cancelConfirm}" class="merch-pending-actions">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="orderId" th:value="${order.id}"><button type="submit" class="btn btn--secondary" th:text="${#messages.msg('ui.00125') + ' · ' + #messages.msg('ui.02039')}"></button>
                </form>
            </div>
        </article>
    </section>
    <nav th:if="${historyPage.totalPages > 1}" class="merch-pagination" th:attr="aria-label=#{ui.orders.historyPages}">
        <p th:text="#{ui.library.pageNumber(${historyPage.number + 1},${historyPage.totalPages})}"></p>
        <a th:if="${historyPage.hasPrevious()}" class="btn btn--secondary" th:href="@{/orders(search=${search},status=${statusFilter},page=${historyPage.number})}" th:text="#{ui.library.previousPage}"></a>
        <a th:if="${historyPage.hasNext()}" class="btn btn--secondary" th:href="@{/orders(search=${search},status=${statusFilter},page=${historyPage.number + 2})}" th:text="#{ui.library.nextPage}"></a>
    </nav>
</div>
</th:block>
