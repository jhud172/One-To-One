<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.01985}, null, ~{::content}, null)}">
<div th:fragment="content" class="client-workspace-v2 personal-records-v2">
    <header class="detail-header"><div class="detail-header-content"><div><h1 class="detail-title" th:text="#{ui.01985}"></h1><p class="detail-subtitle" th:text="#{ui.log.historyHint}"></p></div><div class="connection-actions"><a class="detail-btn-primary" th:href="@{/exercise-log}" th:text="#{ui.01984}"></a><a class="detail-btn-secondary" th:href="@{/exercise-log/export/pdf}" th:text="#{ui.log.exportAll}"></a></div></div></header>
    <form class="detail-section personal-history-filters" method="get" th:action="@{/exercise-log/list}" th:object="${historyFilter}">
        <div th:if="${#fields.hasAnyErrors()}" id="history-errors" class="profile-editor-errors" role="alert"><h2 th:text="#{auth.form.fixErrors}"></h2><p th:text="#{ui.log.dateRangeInvalid}"></p><ul><li th:if="${#fields.hasErrors('from')}"><a href="#from" th:text="#{ui.log.dateFrom}"></a></li><li th:if="${#fields.hasErrors('until')}"><a href="#until" th:text="#{ui.log.dateUntil}"></a></li></ul></div>
        <div class="personal-history-filter-grid">
            <div><label for="logSearch" th:text="#{ui.01988}"></label><input id="logSearch" dir="auto" type="search" name="q" maxlength="120" th:value="${query}"></div>
            <div><label for="from" th:text="#{ui.log.dateFrom}"></label><input type="date" th:field="*{from}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('from')},aria-describedby=${#fields.hasErrors('from') ? 'history-errors' + (historyFromMalformed ? ' history-from-draft' : '') : null}"><p th:if="${historyFromMalformed}" id="history-from-draft" class="personal-history-rejected" dir="ltr" th:text="${draftFrom}"></p></div>
            <div><label for="until" th:text="#{ui.log.dateUntil}"></label><input type="date" th:field="*{until}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('until')},aria-describedby=${#fields.hasErrors('until') ? 'history-errors' + (historyUntilMalformed ? ' history-until-draft' : '') : null}"><p th:if="${historyUntilMalformed}" id="history-until-draft" class="personal-history-rejected" dir="ltr" th:text="${draftUntil}"></p></div>
            <div><label for="logSort" th:text="#{ui.01990}"></label><select id="logSort" name="sort"><option value="newest" th:selected="${sort == 'newest'}" th:text="#{ui.01991}"></option><option value="oldest" th:selected="${sort == 'oldest'}" th:text="#{ui.01992}"></option></select></div>
        </div>
        <div class="connection-actions"><button type="submit" class="detail-btn-primary" th:text="#{ui.00260}"></button><a th:if="${hasLogFilters}" class="detail-btn-secondary" th:href="@{/exercise-log/list(sort=${sort})}" th:text="#{ui.00555}"></a></div>
    </form>
    <p th:unless="${#fields.hasErrors('historyFilter.*')}" class="personal-history-count" role="status" th:text="#{ui.library.resultsRange(${logRangeStart},${logRangeEnd},${logTotal})}"></p>
    <section th:if="${#lists.isEmpty(logs) and !#fields.hasErrors('historyFilter.*')}" class="detail-section"><h2 class="detail-section-title" th:text="${hasLogFilters} ? #{ui.log.historyNoMatch} : #{ui.01993}"></h2><p th:unless="${hasLogFilters}" th:text="#{ui.01994}"></p><a th:if="${hasLogFilters}" class="detail-btn-secondary" th:href="@{/exercise-log/list(sort=${sort})}" th:text="#{ui.00555}"></a></section>
    <div class="library-exercise-grid personal-history-grid">
        <article th:each="log : ${logs}" class="detail-section personal-history-card" th:with="ownedOccurrence=${log.occurrence != null and log.occurrence.user != null and log.occurrence.user.id == logOwnerId},ownedTask=${log.calendarTask != null and log.calendarTask.user != null and log.calendarTask.user.id == logOwnerId}">
            <header><p class="personal-history-origin" th:text="${ownedOccurrence or ownedTask} ? #{ui.log.calendarReflection} : #{ui.log.personalReflection}"></p><h2 class="detail-section-title"><a th:href="@{/exercise-log/view/{id}(id=${log.id})}"><time dir="ltr" th:datetime="${log.date}" th:text="${log.date}"></time></a></h2></header>
            <h3 th:if="${ownedOccurrence}" dir="auto" th:text="${log.occurrence.exercise != null ? log.occurrence.exercise.name : (log.occurrence.customExercise != null and log.occurrence.customExercise.userId == logOwnerId ? log.occurrence.customExercise.name : #messages.msg('ui.log.calendarReflection'))}"></h3>
            <h3 th:if="${ownedTask}" dir="auto" th:text="${log.calendarTask.title}"></h3>
            <dl class="library-exercise-facts"><div><dt th:text="#{ui.01979}"></dt><dd><bdi dir="ltr"><span th:text="${log.moodBefore ?: '—'}"></span><span th:if="${log.moodBefore != null}"> / 4</span></bdi></dd></div><div><dt th:text="#{ui.01980}"></dt><dd><bdi dir="ltr"><span th:text="${log.moodAfter ?: '—'}"></span><span th:if="${log.moodAfter != null}"> / 4</span></bdi></dd></div><div><dt th:text="#{ui.01981}"></dt><dd><bdi dir="ltr"><span th:text="${log.confidence ?: '—'}"></span><span th:if="${log.confidence != null}"> / 4</span></bdi></dd></div><div th:if="${log.durationMinutes != null}"><dt th:text="#{ui.01974}"></dt><dd th:text="${log.durationMinutes}"></dd></div></dl>
            <details class="personal-record-preview"><summary th:text="#{ui.00059}"></summary><p class="plan-coaching-note" dir="auto" th:text="${#strings.isEmpty(log.comments)} ? #{ui.01983} : ${log.comments}"></p></details>
            <div class="connection-actions"><a class="detail-btn-secondary" th:href="@{/exercise-log/view/{id}(id=${log.id})}" th:attr="aria-label=${#messages.msg('ui.01995') + ' · ' + log.date}" th:text="#{ui.01995}"></a><a class="detail-btn-secondary" th:href="@{/exercise-log/edit/{id}(id=${log.id})}" th:attr="aria-label=${#messages.msg('ui.00138') + ' · ' + log.date}" th:text="#{ui.00138}"></a></div>
        </article>
    </div>
    <nav th:if="${logPageCount > 1}" class="connection-actions" th:attr="aria-label=#{ui.00105}"><a th:if="${logPage > 1}" class="detail-btn-secondary" th:aria-label="${#messages.msg('ui.00105') + ' ' + (logPage - 1)}" th:href="@{/exercise-log/list(q=${query},sort=${sort},from=${historyFilter.from},until=${historyFilter.until},page=${logPage - 1})}"><span aria-hidden="true">←</span> <span th:text="${logPage - 1}"></span></a><p aria-current="page"><span th:text="#{ui.00105}"></span> <span th:text="${logPage}"></span> <span th:text="#{ui.00983}"></span> <span th:text="${logPageCount}"></span></p><a th:if="${logPage < logPageCount}" class="detail-btn-secondary" th:href="@{/exercise-log/list(q=${query},sort=${sort},from=${historyFilter.from},until=${historyFilter.until},page=${logPage + 1})}" th:text="#{ui.03032}"></a></nav>
</div></th:block>
