<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.01984}, null, ~{::content}, ~{::pageScripts})}">
<div th:fragment="content" class="client-workspace-v2 personal-records-v2">
    <header class="detail-header"><div class="detail-header-content"><div><h1 class="detail-title" th:text="${editing} ? #{ui.log.editTitle} : #{ui.01984}"></h1><p class="detail-subtitle" th:text="#{ui.01968}"></p></div><a class="detail-btn-secondary" th:href="@{/exercise-log/list}" th:text="#{ui.01969}"></a></div></header>
    <th:block th:replace="~{shared-views/exercise-log/fragments/log-origin :: logOrigin}"></th:block>
    <div class="personal-record-layout">
        <form class="detail-section profile-editor-form" th:action="${formAction}" th:object="${exerciseLog}" method="post" data-exercise-log-form>
            <input type="hidden" th:field="*{occurrenceId}"><input type="hidden" th:field="*{calendarTaskId}"><input th:if="${editing}" type="hidden" th:field="*{expectedRevision}">
            <div th:if="${#fields.hasAnyErrors()}" id="log-errors" class="profile-editor-errors" role="alert"><h2 th:text="#{auth.form.fixErrors}"></h2><p th:text="#{ui.log.invalid}"></p><ul>
                <li th:if="${#fields.hasErrors('date')}"><a href="#date" th:text="#{ui.00660}"></a></li>
                <li th:if="${#fields.hasErrors('moodBefore')}"><a href="#moodBefore1" th:text="#{ui.01971}"></a></li>
                <li th:if="${#fields.hasErrors('moodAfter')}"><a href="#moodAfter1" th:text="#{ui.01972}"></a></li>
                <li th:if="${#fields.hasErrors('confidence')}"><a href="#confidence1" th:text="#{ui.01973}"></a></li>
                <li th:if="${#fields.hasErrors('durationMinutes')}"><a href="#durationMinutes" th:text="#{ui.01974}"></a></li>
                <li th:if="${#fields.hasErrors('comments')}"><a href="#comments" th:text="#{ui.01976}"></a></li>
            </ul></div>
            <section th:if="${logConflict}" class="personal-log-conflict" role="alert" aria-labelledby="log-conflict-title">
                <h2 id="log-conflict-title" class="detail-section-title" th:text="#{ui.log.changed}"></h2><p th:text="#{ui.log.changedHelp}"></p>
                <h3 th:text="#{ui.log.latestSaved}"></h3>
                <dl class="library-exercise-facts"><div><dt th:text="#{ui.00660}"></dt><dd><time dir="ltr" th:text="${latestLog.date}"></time></dd></div><div><dt th:text="#{ui.01974}"></dt><dd th:text="${latestLog.durationMinutes ?: '—'}"></dd></div><div><dt th:text="#{ui.01979}"></dt><dd><bdi dir="ltr"><span th:text="${latestLog.moodBefore ?: '—'}"></span> / 4</bdi></dd></div><div><dt th:text="#{ui.01980}"></dt><dd><bdi dir="ltr"><span th:text="${latestLog.moodAfter ?: '—'}"></span> / 4</bdi></dd></div><div><dt th:text="#{ui.01981}"></dt><dd><bdi dir="ltr"><span th:text="${latestLog.confidence ?: '—'}"></span> / 4</bdi></dd></div></dl>
                <p class="plan-coaching-note" dir="auto" th:text="${#strings.isEmpty(latestLog.comments)} ? #{ui.01983} : ${latestLog.comments}"></p>
            </section>
            <h2 class="detail-section-title" th:text="#{ui.01998}"></h2>
            <label for="date" th:text="#{ui.00660}"></label><input type="date" required th:field="*{date}" th:readonly="${logOriginLinked}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('date')},aria-describedby=${#fields.hasErrors('date') ? 'log-origin-help log-errors' : 'log-origin-help'}">
            <p th:if="${logDateMalformed}" class="personal-history-rejected" dir="ltr" th:text="${logDateDraft}"></p>
            <p id="log-rating-help" th:text="#{ui.log.ratingHint}"></p>
            <fieldset class="personal-log-rating" th:attr="aria-describedby=${#fields.hasErrors('moodBefore') ? 'log-rating-help log-errors' : 'log-rating-help'}"><legend th:text="#{ui.01971}"></legend><div><label th:each="rating : ${#numbers.sequence(1,4)}"><input type="radio" required th:field="*{moodBefore}" th:value="${rating}" th:attr="aria-invalid=${#fields.hasErrors('moodBefore')}"><span th:text="${rating}"></span></label></div></fieldset>
            <fieldset class="personal-log-rating" th:attr="aria-describedby=${#fields.hasErrors('moodAfter') ? 'log-rating-help log-errors' : 'log-rating-help'}"><legend th:text="#{ui.01972}"></legend><div><label th:each="rating : ${#numbers.sequence(1,4)}"><input type="radio" required th:field="*{moodAfter}" th:value="${rating}" th:attr="aria-invalid=${#fields.hasErrors('moodAfter')}"><span th:text="${rating}"></span></label></div></fieldset>
            <fieldset class="personal-log-rating" th:attr="aria-describedby=${#fields.hasErrors('confidence') ? 'log-rating-help log-errors' : 'log-rating-help'}"><legend th:text="#{ui.01973}"></legend><div><label th:each="rating : ${#numbers.sequence(1,4)}"><input type="radio" required th:field="*{confidence}" th:value="${rating}" th:attr="aria-invalid=${#fields.hasErrors('confidence')}"><span th:text="${rating}"></span></label></div></fieldset>
            <label for="durationMinutes" th:text="#{ui.01974}"></label><input type="text" inputmode="numeric" pattern="[0-9]{1,4}" maxlength="4" th:field="*{durationMinutes}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('durationMinutes')},aria-describedby=${#fields.hasErrors('durationMinutes') ? 'log-duration-help log-errors' : 'log-duration-help'}"><p id="log-duration-help" th:text="#{ui.log.durationHint}"></p>
            <label for="comments" th:text="#{ui.01976}"></label><textarea dir="auto" rows="5" maxlength="300" th:field="*{comments}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('comments')},aria-describedby=${#fields.hasErrors('comments') ? 'log-comment-count log-errors' : 'log-comment-count'}"></textarea><p id="log-comment-count"><bdi dir="ltr" data-log-comment-count th:attr="data-count-format=#{ui.log.commentCount}" th:text="#{ui.log.commentCount(${#strings.length(exerciseLog.comments ?: '')})}"></bdi></p>
            <div class="connection-actions"><button type="submit" class="detail-btn-primary" th:text="${logConflict} ? #{ui.log.saveReviewed} : #{ui.00109}"></button><a class="detail-btn-secondary" th:href="@{/exercise-log/list}" th:text="#{ui.00125}"></a></div>
        </form>
        <aside class="detail-section personal-log-preview" data-log-preview th:attr="data-empty-comments=#{ui.01983}">
            <h2 class="detail-section-title" th:text="#{ui.00059}"></h2><p th:text="#{ui.log.draftHelp}"></p>
            <dl class="library-exercise-facts"><div><dt th:text="#{ui.00660}"></dt><dd dir="ltr" data-preview-field="date" th:text="${exerciseLog.date ?: '—'}"></dd></div><div><dt th:text="#{ui.01974}"></dt><dd data-preview-field="durationMinutes" th:text="${exerciseLog.durationMinutes ?: '—'}"></dd></div>
                <div><dt th:text="#{ui.01979}"></dt><dd><bdi dir="ltr"><span data-preview-field="moodBefore" th:text="${exerciseLog.moodBefore ?: '—'}"></span> / 4</bdi></dd></div>
                <div><dt th:text="#{ui.01980}"></dt><dd><bdi dir="ltr"><span data-preview-field="moodAfter" th:text="${exerciseLog.moodAfter ?: '—'}"></span> / 4</bdi></dd></div>
                <div><dt th:text="#{ui.01981}"></dt><dd><bdi dir="ltr"><span data-preview-field="confidence" th:text="${exerciseLog.confidence ?: '—'}"></span> / 4</bdi></dd></div>
            </dl><h3 th:text="#{ui.01976}"></h3><p class="plan-coaching-note" dir="auto" data-preview-field="comments" th:text="${#strings.isEmpty(exerciseLog.comments)} ? #{ui.01983} : ${exerciseLog.comments}"></p>
        </aside>
    </div>
</div><th:block th:fragment="pageScripts"><script th:src="@{/js/health/exerciselogform.js(v=${assetVersion})}" defer></script></th:block></th:block>
