<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(${exercise.name}, null, ~{::content}, null)}">
<div th:fragment="content" class="client-workspace-v2 personal-records-v2 exercise-instruction-v2">
    <header class="detail-header"><div class="detail-header-content"><div><p class="detail-label" th:text="#{ui.01947}"></p><h1 class="detail-title" dir="auto" th:text="${exercise.name}"></h1><p class="detail-subtitle" th:text="#{ui.01965}"></p></div><div class="connection-actions"><a th:if="${instructionReturnUrl != null}" class="detail-btn-primary" th:href="${instructionReturnUrl}" th:text="#{ui.instruction.backSession}"></a><a class="detail-btn-secondary" th:href="@{/calendar}" th:text="#{ui.01297}"></a></div></div></header>
    <section th:if="${instructionReturnUrl != null}" class="detail-section instruction-context" aria-labelledby="instruction-context-title"><h2 id="instruction-context-title" class="detail-section-title" th:text="#{ui.instruction.sessionContext}"></h2><h3 dir="auto" th:text="${instructionSessionName}"></h3><time dir="ltr" th:datetime="${instructionSessionDate}" th:text="${instructionSessionDate}"></time><p th:text="#{ui.instruction.contextHelp}"></p></section>
    <div class="personal-record-layout">
        <section class="detail-section"><h2 class="detail-section-title" th:text="#{ui.01947}"></h2><p th:if="${exercise.description != null and !#strings.isEmpty(#strings.trim(exercise.description))}" class="plan-coaching-note" dir="auto" th:text="${exercise.description}"></p><th:block th:unless="${exercise.description != null and !#strings.isEmpty(#strings.trim(exercise.description))}"><p th:text="#{ui.instruction.missingGuidance}"></p><p class="instruction-help" th:text="#{ui.instruction.missingGuidanceHelp}"></p></th:block></section>
        <aside class="detail-section"><h2 class="detail-section-title" th:text="#{ui.02698}"></h2><dl class="library-exercise-facts"><div><dt th:text="#{ui.00117}"></dt><dd dir="auto" th:text="${#strings.isEmpty(exercise.category) ? '—' : exercise.category}"></dd></div><div><dt th:text="#{ui.00623}"></dt><dd dir="auto" th:text="${#strings.isEmpty(exercise.type) ? '—' : exercise.type}"></dd></div></dl><p class="instruction-help" th:text="#{ui.instruction.recordingHint}"></p></aside>
    </div>
    <section class="detail-section instruction-media"><h2 class="detail-section-title" th:text="#{ui.02699}"></h2><th:block th:if="${safeVideoUrl != null}"><p class="instruction-help" th:text="#{ui.instruction.videoHelp}"></p><a class="detail-btn-secondary" th:href="${safeVideoUrl}" target="_blank" rel="noopener noreferrer" th:text="#{ui.instruction.openVideo}"></a></th:block><th:block th:unless="${safeVideoUrl != null}"><p th:text="#{ui.01966}"></p><p class="instruction-help" th:text="#{ui.01967}"></p></th:block></section>
</div></th:block>
