<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${note != null and note.id != null} ? #{ui.02165} : #{ui.02115}, ~{::styles}, ~{::content}, ~{::pageScripts})}">

<div th:fragment="styles">
</div>

<div th:fragment="content" class="notes-workspace-v2">
    <div class="mx-auto w-full max-w-5xl px-4 sm:px-6 lg:px-8">


        <div class="mt-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-slate-900" th:text="${note != null and note.id != null} ? #{ui.02165} : #{ui.02115}">New Note</h1>
                    <p class="mt-1 text-sm text-slate-600" th:text="#{ui.02130}">Use the toolbar to format your note.</p>
                </div>
                <div class="flex gap-2">
                    <a class="inline-flex items-center justify-center rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10"
                       th:if="${folder != null}" th:href="@{/notes/folders/{id}(id=${folder.id})}" th:text="#{ui.00125}">Cancel</a>
                    <a class="inline-flex items-center justify-center rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900/10"
                       th:if="${folder == null}" th:href="@{/notes}" th:text="#{ui.00125}">Cancel</a>
                </div>
            </div>

            <p th:if="${noteInvalid == true and noteConflict != true}" class="notes-save-error" role="alert" th:text="#{ui.notes.invalid}"></p>
            <section th:if="${noteConflict}" class="notes-save-error" role="alert">
                <p th:text="#{ui.notes.conflict}"></p>
                <h2 th:text="#{ui.notes.savedContent}"></h2>
                <p dir="auto" th:text="${currentNote.title}"></p>
                <article class="notes-rich-content" th:utext="${currentNote.content}"></article>
                <p th:text="#{ui.notes.reviewHint}"></p>
            </section>
            <form th:action="${note != null and note.id != null} ? @{/notes/{id}/edit(id=${note.id})} : @{/notes/folders/{id}/new(id=${folder.id})}"
                  method="post" id="noteForm" th:attr="data-link-prompt=#{ui.02161},data-invalid=#{ui.notes.invalid}" class="mt-6 space-y-6">

            <input type="hidden" name="revision" th:value="${noteRevision != null ? noteRevision : note.revision}">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div>
                    <label class="block text-sm font-medium text-slate-700" for="noteTitle" th:text="#{ui.00583}">Title</label>
                    <input id="noteTitle" type="text" name="title" placeholder="Title" maxlength="120" th:value="${note != null ? note.title : ''}" required
                           class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10" th:placeholder="#{ui.00583}">
                </div>

                <fieldset class="notes-colour-choices"><legend th:text="#{ui.02131}"></legend><label><input type="radio" name="noteColour" value="slate" th:checked="${note == null or note.colour == 'slate'}"><span th:text="#{ui.02132}"></span></label><label><input type="radio" name="noteColour" value="purple" th:checked="${note == null or note.colour == 'purple'}"><span th:text="#{ui.02133}"></span></label><label><input type="radio" name="noteColour" value="cyan" th:checked="${note == null or note.colour == 'cyan'}"><span th:text="#{ui.02134}"></span></label><label><input type="radio" name="noteColour" value="green" th:checked="${note == null or note.colour == 'green'}"><span th:text="#{ui.02135}"></span></label><label><input type="radio" name="noteColour" value="pink" th:checked="${note == null or note.colour == 'pink'}"><span th:text="#{ui.02136}"></span></label><label><input type="radio" name="noteColour" value="orange" th:checked="${note != null and note.colour == 'orange'}"><span th:text="#{ui.notes.orange}"></span></label><label><input type="radio" name="noteColour" value="red" th:checked="${note != null and note.colour == 'red'}"><span th:text="#{ui.notes.red}"></span></label></fieldset>
                <div><label for="noteFolder" th:text="#{ui.01937}"></label><select id="noteFolder" name="folderId" required><option th:each="destination : ${folders}" th:value="${destination.id}" th:selected="${folder.id == destination.id}" th:text="${destination.name}"></option></select></div>
                <div class="rounded-lg border border-slate-200 bg-slate-50 p-2" id="noteFormattingToolbar" hidden role="toolbar" aria-label="Note formatting toolbar" th:attr="aria-label=#{ui.02137}">
                    <div class="flex flex-wrap items-center gap-2">
                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" data-cmd="bold" title="Bold (Ctrl+B)" th:title="#{ui.02138}"><b th:text="#{ui.02139}">B</b></button>
                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" data-cmd="italic" title="Italic (Ctrl+I)" th:title="#{ui.02140}"><i th:text="#{ui.02141}">I</i></button>
                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" data-cmd="underline" title="Underline (Ctrl+U)" th:title="#{ui.02142}"><u th:text="#{ui.02143}">U</u></button>

                        <span class="mx-1 h-5 w-px bg-slate-200"></span>

                        <select class="tool-select rounded-md border border-slate-200 bg-white px-2 py-1.5 text-xs font-semibold text-slate-900 shadow-sm" id="headingSelect" title="Heading style" th:title="#{ui.02144}">
                            <option value="p" th:text="#{ui.02145}">Normal</option>
                            <option value="h1" th:text="#{ui.02146}">Heading 1</option>
                            <option value="h2" th:text="#{ui.02147}">Heading 2</option>
                            <option value="h3" th:text="#{ui.02148}">Heading 3</option>
                            <option value="blockquote" th:text="#{ui.02149}">Quote</option>
                        </select>

                        <select class="tool-select rounded-md border border-slate-200 bg-white px-2 py-1.5 text-xs font-semibold text-slate-900 shadow-sm" id="fontSizeSelect" title="Font size" th:title="#{ui.02150}">
                            <option value="2" th:text="#{ui.02151}">Small</option>
                            <option value="3" selected th:text="#{ui.02145}">Normal</option>
                            <option value="4" th:text="#{ui.02152}">Large</option>
                            <option value="5" th:text="#{ui.02153}">XL</option>
                        </select>

                        <span class="mx-1 h-5 w-px bg-slate-200"></span>

                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" data-cmd="insertUnorderedList" title="Bullets" th:title="#{ui.02154}" th:text="#{ui.02155}">• List</button>
                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" data-cmd="insertOrderedList" title="Numbered" th:title="#{ui.02156}" th:text="#{ui.02157}">1. List</button>

                        <span class="mx-1 h-5 w-px bg-slate-200"></span>

                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" data-align="left" title="Align left" th:title="#{ui.02158}">⟸</button>
                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" data-align="center" title="Align centre" th:title="#{ui.02159}">≡</button>
                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" data-align="right" title="Align right" th:title="#{ui.02160}">⟹</button>

                        <span class="mx-1 h-5 w-px bg-slate-200"></span>

                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" id="linkBtn" title="Insert link" th:title="#{ui.02161}" th:text="#{ui.02162}">🔗 Link</button>
                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" id="highlightBtn" title="Highlight" th:title="#{ui.02163}">🖍</button>
                        <button type="button" class="tool inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm hover:bg-slate-50" id="clearBtn" title="Clear formatting" th:title="#{ui.02164}" th:text="#{ui.00555}">Clear</button>
                    </div>
                </div>

                <div id="editorShell" hidden class="rounded-lg border border-slate-200 bg-white shadow-sm">
                    <div class="editor notes-prewrap min-h-80 p-4 text-sm leading-6 text-slate-800 focus:outline-none"
                         id="editor" role="textbox" aria-multiline="true" th:attr="aria-label=#{ui.02167}" contenteditable="true" spellcheck="true" data-placeholder="Write your note…"
                         th:utext="${note != null ? note.content : ''}"></div>
                </div>

            <input type="hidden" name="content" id="contentHtml" th:value="${note != null ? note.content : ''}">
            <div id="notesNativeContent"><label for="plainContent" th:text="#{ui.02167}"></label><textarea id="plainContent" name="plainContent" rows="12" maxlength="20000" th:text="${notePlainText}"></textarea><p th:text="#{ui.notes.plainHint}"></p></div>

                <div class="flex flex-col-reverse gap-2 sm:flex-row sm:items-center sm:justify-end">
                    <button class="inline-flex items-center justify-center rounded-md bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900/10" type="submit" th:text="#{ui.00109}">Save</button>
                </div>

            </form>
        </div>
    </div>
</div>

<div th:fragment="pageScripts">
    <script th:src="@{/js/notes/note-editor.js(v=${uiCssVersion})}" defer></script>
</div>

</th:block>
