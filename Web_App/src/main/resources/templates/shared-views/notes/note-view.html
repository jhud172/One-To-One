<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(${note != null ? note.title : #messages.msg('ui.02173')}, ~{::styles}, ~{::content}, ~{::pageScripts})}">

<div th:fragment="styles">
</div>

<div th:fragment="content" class="detail-container notes-workspace-v2">


        <div class="mt-6" th:if="${note != null}">
            <p th:if="${noteSaved}" class="notes-save-feedback" role="status" th:text="#{preferences.saved}"></p>
            <!-- Header with key metadata at top -->
            <div class="detail-header">
                <div class="detail-header-content">
                    <div class="detail-header-meta">
                        <a class="detail-label hover:underline" th:if="${note.folder != null}" th:href="@{/notes/folders/{id}(id=${note.folder.id})}" th:text="#{ui.02166}">← Back to folder</a>
                        <h1 class="detail-title" dir="auto" th:text="${note.title}">Title</h1>
                        <time class="detail-subtitle" dir="ltr" th:datetime="${note.updatedAt}" th:text="${#temporals.format(note.updatedAt,'dd MMM yyyy HH:mm')}">Date</time>
                    </div>

                    <!-- Primary actions - sticky on larger screens -->
                    <div class="detail-actions-sticky">
                        <a class="detail-btn-secondary" th:href="@{/notes/{id}/edit(id=${note.id})}" th:text="#{ui.00138}">Edit</a>
                        <form th:action="@{/notes/{id}/delete(id=${note.id})}" method="post"
                              th:attr="data-confirm=#{ui.notes.deleteNote}">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="detail-btn-destructive" type="submit" th:text="#{ui.00139}">Delete</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Structured content sections -->
            <div class="detail-sections">
                <section class="detail-section">
                    <h2 class="detail-section-title" th:text="#{ui.02167}">Content</h2>
                    <div class="detail-section-content">
                        <article dir="auto" class="notes-rich-content text-sm leading-6 text-slate-800 dark:text-slate-300" th:utext="${note.content}"></article>
                    </div>
                </section>

                <section class="detail-section">
                    <div class="detail-info-box">
                        <p class="detail-info-box-title" th:text="#{ui.02168}">Tip</p>
                        <p class="detail-info-box-content" th:text="#{ui.02169}">Use headings, lists, and links for readability.</p>
                    </div>
                </section>
            </div>
        </div>

        <div class="mt-6" th:if="${note == null}">
            <div class="detail-section">
                <div class="detail-empty">
                    <p class="text-sm font-medium text-slate-900 dark:text-slate-100" th:text="#{ui.02170}">Note not found.</p>
                    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300" th:text="#{ui.02171}">It may have been deleted, or you may not have access.</p>
                    <a class="detail-btn-secondary mt-4 inline-flex" href="/notes" th:text="#{ui.02172}">Back to notes</a>
                </div>
            </div>
        </div>


</div>

<div th:fragment="pageScripts">

</div>

</th:block>
