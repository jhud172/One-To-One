<th:block xmlns:th="http://www.thymeleaf.org">
    <section th:fragment="dailyStreakBar" class="calendar-history" data-testid="daily-streak-bar" aria-labelledby="calendar-history-title"
             th:attr="data-summary-copy=#{ui.history.summary},data-tasks-copy=#{ui.history.tasks},data-workouts-copy=#{ui.history.workouts},data-logs-copy=#{ui.history.logs},data-breakdown-copy=#{ui.history.breakdown},data-day-copy=#{ui.history.day},data-status-complete=#{ui.history.complete},data-status-active=#{ui.history.active},data-status-partial=#{ui.history.partial},data-status-unfinished=#{ui.history.unfinished},data-status-planned=#{ui.history.planned},data-status-empty=#{ui.history.empty}">
        <div class="calendar-history__heading">
            <div>
                <h2 id="calendar-history-title" th:text="#{ui.history.title}">Logged completion</h2>
                <p th:text="#{ui.history.help}">Completion includes required logs. Each schedule workout counts once.</p>
            </div>
            <p class="calendar-history__range" th:if="${dailyStreakDays != null and !dailyStreakDays.isEmpty()}"
               th:text="#{ui.history.range(${#temporals.format(dailyStreakDays[0].date, 'd MMM')},${#temporals.format(dailyStreakDays[dailyStreakDays.size() - 1].date, 'd MMM yyyy')})}"></p>
        </div>
        <th:block th:if="${dailyStreakDays != null and !dailyStreakDays.isEmpty()}">
            <nav class="calendar-history__days" th:attr="aria-label=#{ui.history.navigation}">
                <a th:each="day : ${dailyStreakDays}" data-testid="daily-streak-day" class="calendar-history__day"
                   th:href="@{'/calendar/day/' + ${day.date}}"
                   th:attr="data-date=${day.date},data-status=${day.statusKey()},data-date-label=${#temporals.format(day.date, 'EEEE d MMMM yyyy')},data-total-tasks=${day.totalTasks},data-total-workouts=${day.totalWorkouts},data-completed-workouts=${day.completedWorkouts},data-logs-needed=${day.logsNeeded},aria-current=${day.date == date ? 'date' : null},aria-describedby=|daily-streak-tooltip-${day.date}|,aria-label=#{ui.history.day(${#temporals.format(day.date, 'EEEE d MMMM yyyy')},${#messages.msg('ui.history.' + day.statusKey())},${day.completedCount()},${day.totalCount()})}">
                    <time th:datetime="${day.date}" th:text="${#temporals.format(day.date, 'd MMM')}"></time>
                    <span class="calendar-history__signal" aria-hidden="true"></span>
                    <span class="calendar-history__count" aria-hidden="true" th:text="|${day.completedCount()}/${day.totalCount()}|"></span>
                    <span role="tooltip" class="calendar-history__tooltip" th:id="|daily-streak-tooltip-${day.date}|">
                        <strong data-history-status th:text="${#messages.msg('ui.history.' + day.statusKey())}"></strong>
                        <span data-history-summary th:text="#{ui.history.summary(${day.completedCount()},${day.totalCount()},${day.completionPercentage})}"></span>
                        <span data-history-tasks th:text="#{ui.history.tasks(${day.remainingTasks()})}"></span>
                        <span data-history-workouts th:text="#{ui.history.workouts(${day.remainingWorkouts()})}"></span>
                        <span th:text="#{ui.history.logs(${day.logsNeeded})}"></span>
                    </span>
                </a>
            </nav>
            <details class="calendar-history__details">
                <summary th:text="#{ui.history.details}">Completion details</summary>
                <ol class="calendar-history__rows">
                    <li th:each="day : ${dailyStreakDays}" th:attr="data-date=${day.date}">
                        <a th:href="@{'/calendar/day/' + ${day.date}}" th:attr="aria-current=${day.date == date ? 'date' : null}">
                            <time th:datetime="${day.date}" th:text="${#temporals.format(day.date, 'EEE d MMM')}"></time>
                            <span data-history-status th:text="${#messages.msg('ui.history.' + day.statusKey())}"></span>
                            <strong data-history-summary th:text="#{ui.history.summary(${day.completedCount()},${day.totalCount()},${day.completionPercentage})}"></strong>
                        </a>
                        <p data-history-breakdown th:text="#{ui.history.breakdown(${day.remainingTasks()},${day.remainingWorkouts()},${day.logsNeeded})}"></p>
                    </li>
                </ol>
            </details>
        </th:block>
        <p class="calendar-history__unavailable" th:unless="${dailyStreakDays != null and !dailyStreakDays.isEmpty()}" th:text="#{ui.history.unavailable}">Completion history is unavailable.</p>
    </section>
</th:block>
