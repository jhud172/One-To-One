<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.charlie.history}, null, ~{::content}, ~{::scripts})}">
<div th:fragment="content" class="coach-workspace-v2 assistant-history-v2">
<header class="assistant-history-header">
    <div><p class="assistant-history-eyebrow" th:text="#{ui.charlie.history}"></p>
        <h1 th:text="#{ui.charlie.history}"></h1><p th:text="#{ui.charlie.historyHint}"></p></div>
    <a class="assistant-history-action" th:href="@{/chat}" th:text="#{ui.charlie.archive.openCurrent}"></a>
</header>
<div class="assistant-history-layout">
    <th:block th:replace="~{shared-views/chat/fragments/sidebar :: chatSidebar(${folders}, null, null, null, null)}"></th:block>
    <section class="assistant-history-panel" aria-labelledby="history-list-title">
        <h2 id="history-list-title" th:text="#{ui.01866}"></h2>
        <th:block th:replace="~{shared-views/chat/fragments/history-list :: historyList}"></th:block>
    </section>
</div>
</div>
<th:block th:fragment="scripts"><script th:src="@{/js/messaging/archive-history.js(v=${uiCssVersion})}" defer></script></th:block>
</th:block>
