<aside xmlns:th="http://www.thymeleaf.org" th:fragment="chatSidebar(folders, threads, icons, activeFolderId, activeThreadId)" class="assistant-history-panel assistant-history-sidebar">
    <a class="assistant-history-action" th:href="@{/chatv2/history}" th:attr="aria-current=${activeFolderId == null and activeThreadId == null ? 'page' : null}" th:text="#{ui.00485}"></a>
    <details class="assistant-history-collections" open>
        <summary th:text="#{ui.charlie.archive.collections}"></summary>
        <nav th:attr="aria-label=#{ui.01937}">
            <p th:if="${#lists.isEmpty(folders)}" class="assistant-history-empty" th:text="#{ui.charlie.archive.noFolders}"></p>
            <ul class="assistant-history-folders"><li th:each="folder : ${folders}">
                <a th:href="@{/chatv2/history/folder/{id}(id=${folder.id})}" dir="auto" th:text="${folder.name}" th:attr="aria-current=${folder.id == activeFolderId ? (activeThreadId == null ? 'page' : 'location') : null}"></a>
            </li></ul>
        </nav>
    </details>
    <a class="assistant-history-action" th:href="@{/inbox}" th:text="#{ui.00081}"></a>
</aside>
