<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.charlie.history}, null, ~{::content}, ~{::scripts})}">
<div th:fragment="content" class="coach-workspace-v2 assistant-history-v2">
<header class="assistant-history-header">
    <div><p class="assistant-history-eyebrow" th:text="#{ui.charlie.history}"></p>
        <h1 dir="auto" th:text="${thread.title}"></h1><p th:text="#{ui.charlie.historyHint}"></p></div>
    <a class="assistant-history-action" th:href="@{/chat}" th:text="#{ui.charlie.archive.openCurrent}"></a>
</header>
<div class="assistant-history-layout">
    <th:block th:replace="~{shared-views/chat/fragments/sidebar :: chatSidebar(${folders}, null, null, ${thread.folder != null ? thread.folder.id : null}, ${thread.id})}"></th:block>
    <section class="assistant-history-panel" th:attr="aria-label=#{ui.02083}">
        <a class="assistant-history-action" th:href="@{${historyListPath}(q=${searchQuery},page=${historyReturnPage})}" th:text="#{ui.charlie.archive.return}"></a>
        <div class="assistant-history-tags">
            <a th:if="${thread.folder != null}" class="assistant-history-action" th:href="@{/chatv2/history/folder/{id}(id=${thread.folder.id})}" dir="auto" th:text="${thread.folder.name}"></a>
            <span th:if="${thread.pinned}" class="assistant-history-meta" th:text="#{ui.charlie.archive.pinned}"></span>
            <span th:if="${thread.archived}" class="assistant-history-meta" th:text="#{ui.00592}"></span>
            <span th:if="${thread.type.name() == 'TRAINER_CLIENT'}" class="assistant-history-meta" th:text="#{ui.charlie.archive.coaching}"></span>
        </div>
        <details th:if="${!#strings.isEmpty(thread.customInstructions)}" class="assistant-history-instructions">
            <summary th:text="#{ui.01947}"></summary><p dir="auto" th:text="${thread.customInstructions}"></p>
        </details>
        <p th:if="${#lists.isEmpty(messages)}" class="assistant-history-empty" th:text="#{ui.02005}"></p>
        <ol class="assistant-history-messages">
            <li th:each="message : ${messages}" th:attr="data-history-message=${message.id}" th:classappend="${message.role.name() == 'USER'} ? 'assistant-history-own' : ''">
                <p class="assistant-history-meta"><span th:text="${message.role.name() == 'USER'} ? #{ui.charlie.you} : (${message.role.name() == 'SYSTEM'} ? #{ui.charlie.archive.system} : (${thread.type.name() == 'TRAINER_CLIENT'} ? #{ui.charlie.archive.savedReply} : 'Charlie'))"></span>
                    <time dir="ltr" th:text="${historyMessageDates[message.id]}" th:datetime="${message.createdAt}"></time></p>
                <p class="assistant-history-body" dir="auto" th:text="${message.content}"></p>
            </li>
        </ol>
        <th:block th:replace="~{shared-views/chat/fragments/history-pagination :: historyPagination}"></th:block>
    </section>
</div>
</div>
<th:block th:fragment="scripts"><script th:src="@{/js/messaging/archive-history.js(v=${uiCssVersion})}" defer></script></th:block>
</th:block>
