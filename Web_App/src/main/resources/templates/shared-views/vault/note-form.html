<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.02280}, ~{::styles}, ~{::content}, ~{::pageScripts})}">
<div th:fragment="styles"></div>
<div th:fragment="content" class="vault-workspace-v2 vault-editor-v2">
<header class="vault-heading"><div><a class="vault-action" th:href="${vaultReturnTo}" th:text="#{ui.02281}"></a><h1 th:text="${editingId != null ? #messages.msg('ui.00138') + ' · ' + #messages.msg('ui.02295') : #messages.msg('ui.02124') + ' · ' + #messages.msg('ui.02295')}"></h1><p th:text="#{ui.vault.reflectionHint}"></p></div></header>
<p class="vault-feedback" role="alert" th:if="${vaultInvalid == true}" th:text="#{ui.vault.invalid}"></p>
<section class="vault-panel vault-feedback vault-conflict" role="alert" th:if="${vaultConflict != null}">
<h2 th:text="#{ui.notes.conflict}"></h2><p th:text="#{ui.notes.reviewHint}"></p>
<strong dir="auto" th:text="${vaultConflict.title}"></strong><label for="vaultSavedContent" th:text="#{ui.notes.savedContent}"></label><textarea id="vaultSavedContent" readonly dir="auto" th:text="${vaultConflict.content}"></textarea>
<dl class="vault-context"><dt th:text="#{ui.00623}"></dt><dd th:text="${#messages.msg(vaultConflict.noteType.labelKey)}"></dd><dt th:text="#{ui.02282}"></dt><dd dir="ltr" th:text="${vaultConflict.linkedDate ?: '—'}"></dd><dt th:text="#{ui.02285}"></dt><dd dir="auto" th:text="${vaultConflict.tags ?: '—'}"></dd><dt th:text="#{ui.02289}"></dt><dd th:text="${vaultConflict.mood != null ? #messages.msg(vaultConflict.mood == 'LOW' ? 'ui.01739' : 'ui.vault.mood.' + vaultConflict.mood) : #messages.msg('ui.02290')}"></dd><dt th:text="#{ui.02291}"></dt><dd th:text="${vaultConflictSession != null ? vaultConflictSession.nameSnapshot : #messages.msg('ui.02292')}"></dd></dl>
</section>
<form class="vault-panel vault-editor-form" data-vault-editor th:attr="data-unsaved=#{ui.notes.unsaved},data-retained=${vaultInvalid == true or vaultConflict != null}" method="post" th:action="${editingId != null} ? @{/vault/{id}/edit(id=${editingId})} : @{/vault/new}">
<input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<input type="hidden" name="returnTo" th:value="${vaultReturnTo}"><input type="hidden" name="revision" th:if="${editingId != null}" th:value="${draft['revision']}">
<div><label for="reflectionTitle" th:text="#{ui.00583}"></label><input dir="auto" id="reflectionTitle" name="title" required maxlength="120" th:value="${draft['title']}" th:placeholder="#{ui.02283}"></div>
<div><label for="reflectionContent" th:text="#{ui.02167}"></label><textarea dir="auto" id="reflectionContent" name="content" required rows="12" maxlength="10000" th:text="${draft['content']}" th:placeholder="#{ui.02284}"></textarea></div>
<div class="vault-form-grid"><div><label for="reflectionType" th:text="#{ui.00623}"></label><select id="reflectionType" name="noteType" required><option th:each="type : ${noteTypes}" th:value="${type}" th:selected="${type.name() == draft['noteType']}" th:text="${#messages.msg(type.labelKey)}"></option></select></div>
<div><label for="reflectionDate" th:text="#{ui.02282}"></label><input dir="ltr" id="reflectionDate" name="linkedDate" type="text" inputmode="numeric" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" placeholder="YYYY-MM-DD" th:value="${draft['linkedDate']}"></div>
<div><label for="reflectionTags" th:text="#{ui.02285}"></label><input id="reflectionTags" name="tags" maxlength="255" th:value="${draft['tags']}" th:placeholder="#{ui.02287}"></div>
<div><label for="reflectionMood" th:text="#{ui.02289}"></label><select id="reflectionMood" name="mood"><option value="" th:text="#{ui.02290}"></option><option th:each="mood : ${moods}" th:value="${mood}" th:selected="${mood == draft['mood']}" th:text="${#messages.msg(mood == 'LOW' ? 'ui.01739' : 'ui.vault.mood.' + mood)}"></option></select></div></div>
<div><label for="reflectionSession" th:text="#{ui.02291}"></label><select id="reflectionSession" name="linkedWorkoutSessionId"><option value="" th:text="#{ui.02292}"></option><option th:each="trainingSession : ${recentSessions}" th:value="${trainingSession.id}" th:selected="${#strings.toString(trainingSession.id) == draft['linkedWorkoutSessionId']}" th:text="${trainingSession.date + ' · ' + (trainingSession.nameSnapshot ?: #messages.msg('ui.02296'))}"></option></select><p th:text="#{ui.02293}"></p></div>
<output class="vault-editor-status" aria-live="polite" th:text="${vaultInvalid == true or vaultConflict != null ? #messages.msg('ui.notes.unsaved') : ''}"></output>
<div class="vault-actions"><button class="vault-action vault-primary" type="submit" th:text="${vaultConflict != null ? #messages.msg('ui.notes.keepDraft') : #messages.msg('ui.02294')}"></button><a class="vault-action" th:href="${vaultDetailReturnTo}" th:text="#{ui.00125}"></a></div>
</form></div>
<div th:fragment="pageScripts"><script th:src="@{/js/notes/vault.js(v=${uiCssVersion})}" defer></script></div>
</th:block>
