<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.02280}, ~{::styles}, ~{::content}, ~{::pageScripts})}">
<div th:fragment="styles"></div>
<div th:fragment="content" class="vault-workspace-v2">
<header class="vault-heading"><div><p class="vault-eyebrow" th:text="#{ui.02280}"></p><h1 th:text="#{ui.02280}"></h1><p th:text="#{ui.vault.entryHint}"></p></div>
<nav class="vault-actions"><a class="vault-action" th:href="@{/notes}" th:text="#{ui.00175}"></a><a class="vault-action vault-primary" th:href="@{/vault/new(returnTo=${vaultReturnTo})}" th:text="#{ui.vault.new}"></a></nav></header>
<div class="vault-feedback" role="alert" th:if="${vaultInvalid}"><p th:text="#{ui.vault.filtersInvalid}"></p><div class="vault-actions"><a class="vault-action" href="#vaultSearch" th:text="#{ui.02264}"></a><a class="vault-action" href="#vaultFrom" th:text="#{ui.02259}"></a><a class="vault-action" href="#vaultTo" th:text="#{ui.02260}"></a></div></div>
<p class="vault-feedback" role="alert" th:if="${vaultAiError}" th:text="${vaultAiError == 'stale' ? #messages.msg('ui.vault.stale') : #messages.msg('ui.vault.aiError')}"></p>
<p class="vault-feedback" role="status" th:if="${vaultDeleted}" th:text="#{ui.scheduleWorkout.deleted}"></p>
<p class="vault-feedback" role="status" th:if="${vaultSaved}" th:text="#{ui.vault.saved}"></p>
<section class="vault-panel vault-generated" th:if="${aiResult != null}" aria-labelledby="vault-result-title">
<h2 id="vault-result-title" th:text="${aiResultKind == 'rewrite' ? #messages.msg('ui.02305') : (aiResultKind == 'insight' ? #messages.msg('ui.02299') : #messages.msg('ui.02304'))}"></h2>
<p th:text="#{ui.vault.source}"></p><ul><li th:each="title : ${aiResultTitles}" th:text="${title}"></li></ul>
<time dir="ltr" th:if="${aiResultGeneratedAt != null}" th:attr="datetime=${aiResultGeneratedAt}" th:text="${#temporals.format(aiResultGeneratedAt, 'dd MMM yyyy HH:mm')}"></time><p class="vault-reflection-text" dir="auto" th:text="${aiResult}"></p></section>
<div class="vault-metrics" th:if="${metrics != null}">
<div class="vault-panel"><strong th:text="${metrics['totalNotes'] ?: 0}"></strong><span th:text="#{ui.02254}"></span></div>
<div class="vault-panel"><strong th:text="${metrics['notesThisMonth'] ?: 0}"></strong><span th:text="#{ui.02255}"></span></div>
<div class="vault-panel"><strong th:text="${metrics['pinnedCount'] ?: 0}"></strong><span th:text="#{ui.01747}"></span></div>
<div class="vault-panel"><strong th:text="${metrics['topTag'] != null ? '#' + metrics['topTag'] : '—'}"></strong><span th:text="#{ui.02256}"></span></div>
</div>
<form class="vault-panel vault-filters" th:action="@{/vault}" method="get">
<div><label for="vaultSearch" th:text="#{ui.02264}"></label><input id="vaultSearch" name="search" type="search" maxlength="120" th:value="${searchQuery}"></div>
<div><label for="vaultType" th:text="#{ui.00623}"></label><select id="vaultType" name="type"><option value="" th:text="#{ui.01727}"></option><option th:each="type : ${noteTypes}" th:value="${type}" th:selected="${type == selectedType}" th:text="${#messages.msg(type.labelKey)}"></option></select></div>
<div><label for="vaultFrom" th:text="#{ui.02259}"></label><input dir="ltr" id="vaultFrom" name="from" type="text" inputmode="numeric" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" placeholder="YYYY-MM-DD" th:value="${fromDate}"></div>
<div><label for="vaultTo" th:text="#{ui.02260}"></label><input dir="ltr" id="vaultTo" name="to" type="text" inputmode="numeric" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" placeholder="YYYY-MM-DD" th:value="${toDate}"></div>
<label class="vault-check"><input type="checkbox" name="pinned" value="true" th:checked="${pinnedOnly}"><span th:text="#{ui.02258}"></span></label>
<div class="vault-actions"><button class="vault-action vault-primary" type="submit" th:text="#{ui.00554}"></button><a class="vault-action" th:href="@{/vault}" th:text="#{ui.02273}"></a></div></form>
<details class="vault-panel vault-ai-controls" th:if="${notes != null and !notes.isEmpty()}"><summary th:text="#{ui.02301}"></summary>
<p th:text="#{ui.vault.aiInput}"></p>
<p th:if="${!vaultPremium}" th:text="#{ui.vault.aiPremium}"></p>
<p th:if="${vaultPremium and !vaultAiAvailable}" th:text="#{ui.vault.aiUnavailable}"></p>
<form id="vaultSelection" method="post" th:action="@{/vault/ai/summarise-week}">
<input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<input type="hidden" name="returnTo" th:value="${vaultReturnTo}">
<p class="vault-scope" th:text="#{ui.vault.scope}"></p><p th:text="#{ui.vault.select}"></p><output id="vaultSelectionCount" aria-live="polite">0 / 20</output>
<fieldset th:disabled="${!vaultAiEnabled}"><legend class="sr-only" th:text="#{ui.02301}"></legend>
<label class="vault-check"><input type="checkbox" name="aiConsent" value="true" required><span th:text="#{ui.vault.aiDisclosure}"></span></label>
<div class="vault-actions"><button class="vault-action vault-primary" type="submit" th:text="#{ui.02304}"></button><button class="vault-action" type="submit" th:formaction="@{/vault/ai/rewrite-checkin}" th:text="#{ui.02305}"></button></div></fieldset>
</form></details>
<div class="vault-card-grid" th:if="${notes != null and !notes.isEmpty()}">
<article class="vault-panel vault-reflection-card" th:each="note : ${notes}">
<div class="vault-card-meta"><span class="vault-type-badge" th:classappend="${note.noteType}" th:text="${#messages.msg(note.noteType.labelKey)}"></span><span th:if="${note.pinned}" th:text="#{ui.01747}"></span></div>
<h2 dir="auto"><a th:href="@{/vault/{id}(id=${note.id},returnTo=${vaultReturnTo})}" th:text="${note.title}"></a></h2>
<p dir="auto" class="vault-reflection-preview" th:text="${#strings.abbreviate(note.content, 200)}"></p>
<p th:if="${note.linkedDate != null}"><span th:text="#{ui.02282}"></span>: <time dir="ltr" th:attr="datetime=${note.linkedDate}" th:text="${note.linkedDate}"></time></p>
<p th:if="${note.linkedWorkoutSessionId != null and sessionsById[note.linkedWorkoutSessionId] != null}" th:text="${sessionsById[note.linkedWorkoutSessionId].nameSnapshot}"></p>
<time dir="ltr" th:attr="datetime=${note.updatedAt}" th:if="${note.updatedAt != null}" th:text="${#temporals.format(note.updatedAt, 'dd MMM yyyy HH:mm')}"></time>
<p class="vault-tags" th:if="${!#strings.isEmpty(note.tags)}" th:text="${note.tags}"></p>
<div class="vault-actions"><a class="vault-action" th:href="@{/vault/{id}/edit(id=${note.id},returnTo=${vaultReturnTo})}" th:text="#{ui.00138}"></a>
<form method="post" th:action="@{/vault/{id}/pin(id=${note.id})}"><input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="returnTo" th:value="${vaultReturnTo}"><button class="vault-action" type="submit" th:text="${note.pinned ? #messages.msg('ui.vault.unpin') : #messages.msg('ui.vault.pin')}"></button></form></div>
<label class="vault-check"><input type="checkbox" name="noteIds" th:disabled="${!vaultAiEnabled}" th:value="${note.id}" form="vaultSelection"><span th:text="#{ui.vault.select}"></span><span class="sr-only" th:text="${note.title}"></span></label>
</article></div>
<section class="vault-panel vault-empty" th:if="${notes == null or notes.isEmpty()}"><h2 th:text="${metrics['totalNotes'] == 0 ? #messages.msg('ui.02276') : #messages.msg('ui.02275')}"></h2><p th:text="${metrics['totalNotes'] == 0 ? #messages.msg('ui.02278') : #messages.msg('ui.02277')}"></p><a class="vault-action" th:href="@{/vault/new(returnTo=${vaultReturnTo})}" th:text="#{ui.vault.new}"></a></section>
<nav class="vault-pagination" th:attr="aria-label=#{ui.vault.pages}"><p th:text="#{ui.vault.page(${vaultPage.page},${vaultPage.pageCount},${vaultPage.total})}"></p><a class="vault-action" th:if="${vaultPage.page > 1}" th:href="${vaultPrevious}" th:text="#{ui.library.previousPage}"></a><a class="vault-action" th:if="${vaultPage.page < vaultPage.pageCount}" th:href="${vaultNext}" th:text="#{ui.library.nextPage}"></a></nav>
</div>
<div th:fragment="pageScripts"><script th:src="@{/js/notes/vault.js(v=${uiCssVersion})}" defer></script></div>
</th:block>
