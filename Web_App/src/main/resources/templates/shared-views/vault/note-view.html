<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.02280}, ~{::styles}, ~{::content}, ~{::pageScripts})}">
<div th:fragment="styles"></div>
<div th:fragment="content" class="vault-workspace-v2 vault-reader-v2">
<header class="vault-heading"><div><a class="vault-action" th:href="${vaultReturnTo}" th:text="#{ui.02281}"></a><p class="vault-eyebrow" th:text="${#messages.msg(note.noteType.labelKey)}"></p><h1 dir="auto" th:text="${note.title}"></h1>
<p th:if="${note.updatedAt != null}"><span th:text="#{ui.02297}"></span> <time dir="ltr" th:attr="datetime=${note.updatedAt}" th:text="${#temporals.format(note.updatedAt, 'dd MMM yyyy HH:mm')}"></time></p></div>
<div class="vault-actions"><a class="vault-action" th:href="@{/vault/{id}/edit(id=${note.id},returnTo=${vaultReturnTo})}" th:text="#{ui.00138}"></a>
<form method="post" th:action="@{/vault/{id}/pin(id=${note.id})}"><input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="returnTo" th:value="${vaultDetailReturnTo}"><button class="vault-action" type="submit" th:text="${note.pinned ? #messages.msg('ui.vault.unpin') : #messages.msg('ui.vault.pin')}"></button></form>
<form method="post" th:action="@{/vault/{id}/delete(id=${note.id})}" th:attr="data-confirm=#{ui.notes.deleteNote}"><input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="returnTo" th:value="${vaultReturnTo}"><button class="vault-action vault-delete" type="submit" th:text="#{ui.00139}"></button></form></div></header>
<p class="vault-feedback" role="alert" th:if="${vaultInvalid}" th:text="#{ui.vault.invalid}"></p>
<p class="vault-feedback" role="alert" th:if="${vaultAiError}" th:text="${vaultAiError == 'stale' ? #messages.msg('ui.vault.stale') : #messages.msg('ui.vault.aiError')}"></p>
<p class="vault-feedback" role="status" th:if="${vaultSaved}" th:text="#{ui.vault.saved}"></p>
<section class="vault-panel vault-generated" th:if="${aiResult != null}" aria-labelledby="vault-result-title">
<h2 id="vault-result-title" th:text="${aiResultKind == 'rewrite' ? #messages.msg('ui.02305') : (aiResultKind == 'insight' ? #messages.msg('ui.02299') : #messages.msg('ui.02304'))}"></h2>
<p th:text="#{ui.vault.source}"></p><ul><li th:each="title : ${aiResultTitles}" th:text="${title}"></li></ul>
<time dir="ltr" th:if="${aiResultGeneratedAt != null}" th:attr="datetime=${aiResultGeneratedAt}" th:text="${#temporals.format(aiResultGeneratedAt, 'dd MMM yyyy HH:mm')}"></time><p class="vault-reflection-text" dir="auto" th:text="${aiResult}"></p></section>
<article class="vault-panel"><h2 th:text="#{ui.02300}"></h2><p class="vault-reflection-text" dir="auto" th:text="${note.content}"></p>
<dl class="vault-context"><th:block th:if="${note.linkedDate != null}"><dt th:text="#{ui.02282}"></dt><dd dir="ltr" th:text="${note.linkedDate}"></dd></th:block>
<th:block th:if="${linkedSession != null}"><dt th:text="#{ui.02291}"></dt><dd><a class="vault-action" th:href="@{/workout-session/{id}(id=${linkedSession.id})}" th:text="${linkedSession.nameSnapshot ?: #messages.msg('ui.02291')}"></a></dd></th:block>
<th:block th:if="${!#strings.isEmpty(note.mood)}"><dt th:text="#{ui.02289}"></dt><dd th:text="${#messages.msg(note.mood == 'LOW' ? 'ui.01739' : 'ui.vault.mood.' + note.mood)}"></dd></th:block>
<th:block th:if="${!#strings.isEmpty(note.tags)}"><dt th:text="#{ui.02285}"></dt><dd th:text="${note.tags}"></dd></th:block></dl></article>
<section class="vault-panel vault-generated" th:if="${!#strings.isEmpty(note.aiSummary)}"><h2 th:text="#{ui.02299}"></h2><p th:text="#{ui.vault.source}"></p><p th:if="${note.aiSourceRevision != null and note.aiSourceRevision == note.revision}" th:text="#{ui.vault.sourceCurrent}"></p><p th:if="${note.aiSourceRevision == null or note.aiGeneratedAt == null}" th:text="#{ui.vault.sourceUnknown}"></p><p th:if="${note.aiGeneratedAt != null}"><span th:text="#{ui.vault.insightSaved}"></span> <time dir="ltr" th:attr="datetime=${note.aiGeneratedAt}" th:text="${#temporals.format(note.aiGeneratedAt, 'dd MMM yyyy HH:mm')}"></time></p><p class="vault-reflection-text" dir="auto" th:text="${note.aiSummary}"></p></section>
<details class="vault-panel vault-ai-controls"><summary th:text="#{ui.02301}"></summary>
<p th:text="#{ui.vault.aiInput}"></p>
<p th:if="${!vaultPremium}" th:text="#{ui.vault.aiPremium}"></p>
<p th:if="${vaultPremium and !vaultAiAvailable}" th:text="#{ui.vault.aiUnavailable}"></p>
<form method="post" th:action="@{/vault/ai/insight/{id}(id=${note.id})}"><input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="noteIds" th:value="${note.id}"><input type="hidden" name="returnTo" th:value="${vaultDetailReturnTo}">
<fieldset th:disabled="${!vaultAiEnabled}"><legend class="sr-only" th:text="#{ui.02301}"></legend><label class="vault-check"><input type="checkbox" name="aiConsent" value="true" required><span th:text="#{ui.vault.aiDisclosure}"></span></label>
<div class="vault-actions"><button class="vault-action vault-primary" type="submit" th:text="#{ui.02303}"></button><button class="vault-action" type="submit" th:formaction="@{/vault/ai/summarise-week}" th:text="#{ui.02304}"></button><button class="vault-action" type="submit" th:formaction="@{/vault/ai/rewrite-checkin}" th:text="#{ui.02305}"></button></div></fieldset></form></details>
</div>
<div th:fragment="pageScripts"><script th:src="@{/js/notes/vault.js(v=${uiCssVersion})}" defer></script></div>
</th:block>
