<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(#{ui.02367}, ~{::pageStyles}, ~{::content}, ~{::pageScripts})}">

    <th:block th:fragment="pageStyles">
        <link rel="stylesheet" th:href="@{/css/components/dev/dev-mode-pages.css(v=${uiCssVersion})}">
    </th:block>

    <div th:fragment="content"
         class="devunauth-wrap guest-experience guest-experience--dev-state guest-dev-state"
         data-guest-scene>

        <!-- Persistent DEV MODE badge -->
        <div class="devunauth-env-badge" aria-label="Development environment" th:attr="aria-label=#{ui.02364}">
            <span class="devunauth-env-badge-dot"></span>
            <th:block th:text="#{ui.02365}">DEV MODE</th:block>
        </div>

        <div class="devunauth-card guest-panel" data-guest-reveal>

            <div class="devunauth-badge">
                <span class="devunauth-env-badge-dot"></span>
                <th:block th:text="#{ui.02366}">Development Environment</th:block>
            </div>

            <div class="devunauth-icon" aria-hidden="true">
                <th:block th:replace="~{universal-fragments/dev/dev-page-display :: icon('shield')}"></th:block>
            </div>
            <h1 th:text="#{ui.02367}">Login Required</h1>
            <p th:text="#{ui.02368}">This page needs an authenticated session to display content. Sign in to explore it with real data, or return to the Dev Hub to browse public pages.</p>

            <div class="devunauth-actions">
                <a th:href="@{/login(devLogin=1)}" class="devunauth-btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                    <th:block th:text="#{ui.01126}">Sign In</th:block>
                </a>
                <a th:href="@{/dev-mode}" class="devunauth-btn-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                    <th:block th:text="#{ui.02360}">Dev Hub</th:block>
                </a>
            </div>

        </div>
    </div>

    <th:block th:fragment="pageScripts">
    </th:block>

</th:block>
