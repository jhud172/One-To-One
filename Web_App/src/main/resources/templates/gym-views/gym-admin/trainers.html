<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.gymRoster.title}, null, ~{::content}, ~{::pageScripts})}">
<div th:fragment="content" class="gym-operations-v2 gym-roster-v2 mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
    <header class="gym-roster-header" data-site-tour="gym-trainers">
        <div><h1 th:text="#{ui.gymRoster.title}">Trainer operations</h1><p th:text="#{ui.gymRoster.hint}"></p></div>
        <nav><a th:href="@{/gym/dashboard}" th:text="#{ui.00945}"></a><a th:href="@{/gym/admin/trainers/affiliations}" th:text="#{ui.gymLink.title}"></a></nav>
    </header>
    <p th:if="${successMessage}" class="gym-roster-feedback" role="status" th:text="${successMessage}"></p>
    <p th:if="${errorMessage}" class="gym-roster-feedback gym-feedback" role="alert" th:text="${errorMessage}"></p>
    <p th:if="${rosterFilterInvalid}" class="gym-roster-feedback gym-feedback" role="alert" th:text="#{ui.gymRoster.filtersInvalid}"></p>

    <section class="gym-roster-panel">
        <h2 th:text="#{ui.00269}">Trainers</h2>
        <form th:action="@{/gym/admin/trainers#trainer-results}" method="get" class="gym-roster-filters">
            <div><label for="gym-trainer-search" th:text="#{ui.00258}"></label><input id="gym-trainer-search" type="search" name="search" maxlength="120" th:value="${search}"></div>
            <div><label for="gym-review-filter" th:text="#{ui.gymRoster.ownReview}"></label><select id="gym-review-filter" name="review">
                <option value="" th:selected="${review == ''}" th:text="#{ui.00485}"></option>
                <option th:each="code : ${reviewFilters}" th:value="${code}" th:selected="${review == code}" th:text="${#messages.msg(reviewLabels.get(code))}"></option>
                <option th:if="${rosterFilterInvalid and !reviewLabels.containsKey(review) and review != ''}" th:value="${review}" selected th:text="${review}"></option>
            </select></div>
            <label class="gym-roster-check"><input type="checkbox" name="verifiedOnly" value="true" th:checked="${verifiedOnly}"><span th:text="#{ui.gymRoster.verifiedOnly}"></span></label>
            <button type="submit" class="btn btn--primary" th:text="#{ui.00554}"></button>
            <a th:href="@{/gym/admin/trainers}" class="btn btn--secondary" th:text="#{ui.00563}"></a>
        </form>
        <p id="trainer-results" tabindex="-1" th:text="#{ui.library.resultsRange(${firstTrainer},${lastTrainer},${rosterPage.totalElements})}"></p>
        <div th:if="${#lists.isEmpty(trainers)}" class="gym-roster-empty">
            <h3 th:text="${trainerCount == 0} ? #{ui.01061} : #{ui.gymRoster.emptyResults}"></h3>
            <p th:text="${trainerCount == 0} ? #{ui.gymLink.intro} : #{ui.02223}"></p>
            <a th:if="${trainerCount == 0}" class="btn btn--secondary" th:href="@{/gym/admin/trainers/affiliations}" th:text="#{ui.gymLink.invite}"></a>
        </div>
        <div class="gym-roster-list" th:if="${!#lists.isEmpty(trainers)}">
            <article th:each="trainer : ${trainers}" class="gym-roster-card" th:with="reviewRequest=${latestRequests[trainer.id]}" th:attr="data-trainer-id=${trainer.id},aria-labelledby=${'gym-trainer-' + trainer.id}">
                <header>
                    <h3 th:id="${'gym-trainer-' + trainer.id}" dir="auto" th:text="${trainer.fullName}"></h3>
                    <p dir="auto" th:text="'@' + ${trainer.username}"></p><p dir="auto" th:text="${trainer.email}"></p>
                    <p th:if="${!trainer.enabled}" th:text="#{ui.00137}"></p>
                </header>
                <dl class="gym-roster-status">
                    <div><dt th:text="#{ui.gymRoster.platformVerification}"></dt><dd th:text="${trainer.trainerVerified} ? #{ui.00564} : #{ui.gymRoster.notVerified}"></dd></div>
                    <div><dt th:text="#{ui.gymRoster.ownReview}"></dt><dd th:text="${reviewRequest == null} ? #{ui.gymRoster.noReview} : ${#messages.msg(reviewLabels[reviewRequest.status.name()])}"></dd></div>
                    <div th:if="${reviewRequest != null}"><dt th:text="#{ui.00151}"></dt><dd><time th:datetime="${reviewRequest.submittedAt}" th:text="${#temporals.format(reviewRequest.submittedAt, 'dd MMM yyyy')}"></time></dd></div>
                </dl>
                <section th:if="${reviewRequest != null}" class="gym-roster-review">
                    <details class="gym-roster-review-notes"><summary th:text="#{ui.01063}"></summary><p class="gym-review-notes" dir="auto" th:text="${#strings.isEmpty(reviewRequest.notes)} ? #{ui.01065} : ${reviewRequest.notes}"></p><h4 th:text="#{ui.00155}"></h4><p class="gym-review-notes" dir="auto" th:text="${#strings.isEmpty(reviewRequest.adminNotes)} ? #{ui.01066} : ${reviewRequest.adminNotes}"></p></details>
                    <details th:if="${reviewRequest.status.name() == 'NEEDS_INFO' and trainer.enabled}" class="gym-notes-editor" th:open="${updateNotesRequestId == reviewRequest.id}">
                        <summary th:text="#{ui.01067}"></summary>
                        <form method="post" th:action="@{/gym/admin/trainers/{id}/update-notes(id=${reviewRequest.id})}">
                    <input type="hidden" name="search" th:value="${search}">
                    <input type="hidden" name="review" th:value="${review}">
                    <input type="hidden" name="verifiedOnly" th:value="${verifiedOnly}">
                    <input type="hidden" name="page" th:value="${rosterPage.number + 1}">
                            <label th:for="${'request-notes-' + reviewRequest.id}" th:text="#{ui.01071}"></label>
                            <textarea name="notes" rows="5" required maxlength="1000" th:id="${'request-notes-' + reviewRequest.id}" th:text="${updateNotesRequestId == reviewRequest.id ? updateNotesNotes : reviewRequest.notes}"></textarea>
                            <p role="alert" th:if="${updateNotesRequestId == reviewRequest.id and #fields.hasErrors('updateNotesForm.*')}" th:text="#{ui.00958}"></p>
                            <button type="submit" class="btn btn--primary" th:text="#{ui.01073}"></button>
                        </form>
                    </details>
                </section>
            </article>
        </div>
        <nav th:if="${rosterPage.totalPages > 1}" class="gym-roster-pagination" th:attr="aria-label=#{ui.00269}">
            <p th:text="#{ui.library.pageNumber(${rosterPage.number + 1},${rosterPage.totalPages})}"></p>
            <a th:if="${rosterPage.hasPrevious()}" class="btn btn--secondary" th:href="@{/gym/admin/trainers(search=${search},review=${review},verifiedOnly=${verifiedOnly},page=${rosterPage.number})}" th:text="#{ui.library.previousPage}"></a>
            <a th:if="${rosterPage.hasNext()}" class="btn btn--secondary" th:href="@{/gym/admin/trainers(search=${search},review=${review},verifiedOnly=${verifiedOnly},page=${rosterPage.number + 2})}" th:text="#{ui.library.nextPage}"></a>
        </nav>
    </section>

    <details id="gym-create-account" class="gym-roster-panel gym-create-account" th:open="${#fields.hasErrors('newRequest.*')}">
        <summary th:text="#{ui.gymRoster.createAccount}"></summary><p th:text="#{ui.gym.accountNotice}"></p>
                <form th:action="@{/gym/admin/trainers/create}" th:object="${newRequest}" method="post" class="space-y-4">
                    <input type="hidden" name="search" th:value="${search}">
                    <input type="hidden" name="review" th:value="${review}">
                    <input type="hidden" name="verifiedOnly" th:value="${verifiedOnly}">
                    <input type="hidden" name="page" th:value="${rosterPage.number + 1}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div th:if="${#fields.hasAnyErrors()}" class="rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800" role="alert" th:text="#{ui.00958}">
                        Please fix the highlighted errors below.
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="firstName" class="block text-sm font-semibold text-blue-900 dark:text-blue-100 mb-2">
                                <th:block th:text="#{ui.01047}">First Name</th:block> <span class="text-red-500">*</span>
                            </label>
                            <input id="firstName" th:field="*{firstName}" maxlength="100" required
                                   th:classappend="${#fields.hasErrors('firstName')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''"
                                   class="block w-full rounded-xl border border-blue-300 dark:border-blue-700 bg-white dark:bg-slate-800 px-4 py-2.5 text-slate-900 dark:text-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
                                   placeholder="Alex"  th:placeholder="#{ui.01048}"/>
                            <div th:if="${#fields.hasErrors('firstName')}" class="mt-1 text-sm text-rose-700">
                                <span th:errors="*{firstName}"></span>
                            </div>
                        </div>
                        <div>
                            <label for="lastName" class="block text-sm font-semibold text-blue-900 dark:text-blue-100 mb-2">
                                <th:block th:text="#{ui.01049}">Last Name</th:block> <span class="text-red-500">*</span>
                            </label>
                            <input id="lastName" th:field="*{lastName}" maxlength="100" required
                                   th:classappend="${#fields.hasErrors('lastName')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''"
                                   class="block w-full rounded-xl border border-blue-300 dark:border-blue-700 bg-white dark:bg-slate-800 px-4 py-2.5 text-slate-900 dark:text-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
                                   placeholder="Morgan"  th:placeholder="#{ui.01050}"/>
                            <div th:if="${#fields.hasErrors('lastName')}" class="mt-1 text-sm text-rose-700">
                                <span th:errors="*{lastName}"></span>
                            </div>
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-semibold text-blue-900 dark:text-blue-100 mb-2">
                                <th:block th:text="#{ui.00096}">Email</th:block> <span class="text-red-500">*</span>
                            </label>
                            <input id="email" th:field="*{email}" type="email" maxlength="100" required
                                   th:classappend="${#fields.hasErrors('email')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''"
                                   class="block w-full rounded-xl border border-blue-300 dark:border-blue-700 bg-white dark:bg-slate-800 px-4 py-2.5 text-slate-900 dark:text-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
                                   placeholder="trainer@example.com"  th:placeholder="#{ui.01051}"/>
                            <div th:if="${#fields.hasErrors('email')}" class="mt-1 text-sm text-rose-700">
                                <span th:errors="*{email}"></span>
                            </div>
                        </div>
                        <div>
                            <label for="username" class="block text-sm font-semibold text-blue-900 dark:text-blue-100 mb-2">
                                <th:block th:text="#{ui.01052}">Username</th:block> <span class="text-red-500">*</span>
                            </label>
                            <input id="username" th:field="*{username}" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" required
                                   th:classappend="${#fields.hasErrors('username')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''"
                                   class="block w-full rounded-xl border border-blue-300 dark:border-blue-700 bg-white dark:bg-slate-800 px-4 py-2.5 text-slate-900 dark:text-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
                                   placeholder="trainer_morgan"  th:placeholder="#{ui.01053}"/>
                            <div th:if="${#fields.hasErrors('username')}" class="mt-1 text-sm text-rose-700">
                                <span th:errors="*{username}"></span>
                            </div>
                        </div>
                        <div>
                            <label for="temporaryPassword" class="block text-sm font-semibold text-blue-900 dark:text-blue-100 mb-2">
                                <th:block th:text="#{ui.01054}">Temporary Password</th:block> <span class="text-red-500">*</span>
                            </label>
                            <input id="temporaryPassword" name="temporaryPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required
                                   th:classappend="${#fields.hasErrors('temporaryPassword')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''"
                                   class="block w-full rounded-xl border border-blue-300 dark:border-blue-700 bg-white dark:bg-slate-800 px-4 py-2.5 text-slate-900 dark:text-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
                                   placeholder="Secure temporary password"  th:placeholder="#{ui.01055}"/>
                            <div th:if="${#fields.hasErrors('temporaryPassword')}" class="mt-1 text-sm text-rose-700">
                                <span th:errors="*{temporaryPassword}"></span>
                            </div>
                            <p class="mt-1 text-xs text-blue-700 dark:text-blue-300" th:text="#{ui.01056}">Share this securely with the trainer.</p>
                        </div>
                        <div>
                            <label for="notes" class="block text-sm font-semibold text-blue-900 dark:text-blue-100 mb-2" th:text="#{ui.01057}">
                                Notes (Optional)
                            </label>
                            <textarea id="notes" th:field="*{notes}" rows="3" maxlength="1000"
                                      th:classappend="${#fields.hasErrors('notes')} ? ' border-rose-300 focus:border-rose-400 focus:ring-rose-400/20' : ''"
                                      class="block w-full rounded-xl border border-blue-300 dark:border-blue-700 bg-white dark:bg-slate-800 px-4 py-2.5 text-slate-900 dark:text-white placeholder-blue-400 dark:placeholder-blue-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
                                      placeholder="Any additional information for the super admin..." th:placeholder="#{ui.01058}"></textarea>
                            <div th:if="${#fields.hasErrors('notes')}" class="mt-1 text-sm text-rose-700">
                                <span th:errors="*{notes}"></span>
                            </div>
                            <p class="mt-1 text-xs text-blue-700 dark:text-blue-300" th:text="#{ui.01059}">Max 1000 characters</p>
                        </div>
                    </div>

                    <button type="submit"
                            class="inline-flex min-h-11 items-center justify-center rounded-xl bg-blue-600 px-6 py-2 text-sm font-semibold text-white hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600" th:text="#{ui.01060}">
                        Submit for Verification
                    </button>
                </form>
    </details>
</div>
<th:block th:fragment="pageScripts"><script th:src="@{/js/trainer/gym-admin-trainers-page.js(v=${uiCssVersion})}" defer></script></th:block>
</th:block>
