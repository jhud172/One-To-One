<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(${editingId != null} ? #{ui.00955} : #{ui.00954}, null, ~{::content}, null)}">
<div th:fragment="content" class="gym-operations-v2 gym-products-v2 gym-membership-editor mx-auto w-full max-w-3xl px-4 py-6 sm:px-6 lg:px-8">
    <header class="gym-roster-header">
        <div><h1 th:text="${editingId != null} ? #{ui.00955} : #{ui.00954}"></h1><p th:text="${editingId != null} ? #{ui.00957} : #{ui.00956}"></p></div>
        <nav><a th:href="${catalogueUrl}" th:text="#{ui.00571}"></a></nav>
    </header>
    <section class="gym-roster-panel">
        <p th:if="${errorMessage}" class="gym-feedback" role="alert" th:text="${errorMessage}"></p>
        <form th:action="@{${editingId != null} ? '/gym/admin/memberships/' + ${editingId} + '/edit' : '/gym/admin/memberships/create'}" th:object="${product}" method="post" class="gym-membership-fields">
            <input type="hidden" name="search" th:value="${catalogueSearch}"><input type="hidden" name="state" th:value="${catalogueState}"><input type="hidden" name="page" th:value="${cataloguePage}"><input type="hidden" name="size" th:value="${catalogueSize}">
            <div th:if="${#fields.hasAnyErrors()}" class="gym-feedback" role="alert">
                <p th:text="#{ui.00958}"></p>
                <ul><li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li></ul>
            </div>
            <div>
                <label for="name" th:text="#{ui.00959}"></label>
                <input id="name" type="text" th:field="*{name}" required maxlength="200" dir="auto" aria-describedby="name-help name-error" th:attr="aria-invalid=${#fields.hasErrors('name')}" th:placeholder="#{ui.00960}">
                <p id="name-help" th:text="#{ui.00961}"></p><p id="name-error" class="gym-field-error"><span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span></p>
            </div>
            <div>
                <label for="description" th:text="#{ui.00113}"></label>
                <textarea id="description" rows="4" th:field="*{description}" maxlength="1000" dir="auto" aria-describedby="description-help description-error" th:attr="aria-invalid=${#fields.hasErrors('description')}" th:placeholder="#{ui.00962}"></textarea>
                <p id="description-help" th:text="#{ui.00963}"></p><p id="description-error" class="gym-field-error"><span th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span></p>
            </div>
            <div class="gym-membership-billing" th:if="${editingId == null}">
                <div><label for="priceDollars" th:text="#{ui.00964}"></label>
                    <input id="priceDollars" type="number" th:field="*{priceDollars}" step="0.01" min="0" max="21474836.47" required dir="ltr" aria-describedby="price-help price-error" th:attr="aria-invalid=${#fields.hasErrors('priceDollars')}">
                    <p id="price-help" th:text="#{ui.00965}"></p><p id="price-error" class="gym-field-error"><span th:if="${#fields.hasErrors('priceDollars')}" th:errors="*{priceDollars}"></span></p>
                </div>
                <div><label for="billingPeriod" th:text="#{ui.00968}"></label>
                    <select id="billingPeriod" th:field="*{billingPeriod}" required aria-describedby="billing-help billing-error" th:attr="aria-invalid=${#fields.hasErrors('billingPeriod')}"><option value="MONTHLY" th:text="#{ui.00969}"></option></select>
                    <p id="billing-help" th:text="#{ui.00970}"></p><p id="billing-error" class="gym-field-error"><span th:if="${#fields.hasErrors('billingPeriod')}" th:errors="*{billingPeriod}"></span></p>
                </div>
            </div>
            <aside class="gym-membership-current" th:if="${editingId != null}">
                <h2 th:text="#{ui.00966}"></h2>
                <dl class="gym-product-facts">
                    <div><dt th:text="#{ui.00964}"></dt><dd dir="ltr">$<span th:text="${#numbers.formatDecimal(currentPrice, 1, 2)}"></span> <small>USD</small></dd></div>
                    <div><dt th:text="#{ui.00968}"></dt><dd th:text="#{ui.00969}"></dd></div>
                    <div><dt th:text="#{ui.gymRoster.activeSubscribers}"></dt><dd th:text="${currentSubscribers}"></dd></div>
                </dl>
                <p th:text="#{ui.gym.delivery}"></p>
                <a class="btn btn--secondary" th:href="@{/gym/admin/memberships/{id}/price-change(id=${editingId})}" th:text="#{ui.00980}"></a>
            </aside>
            <div>
                <label class="gym-roster-check" for="active"><input type="checkbox" id="active" th:field="*{active}" aria-describedby="active-help"><span th:text="#{ui.00134}"></span></label>
                <p id="active-help" th:text="${editingId != null} ? #{ui.gym.deactivate} : #{ui.00971}"></p>
            </div>
            <footer class="gym-membership-actions"><a class="btn btn--secondary" th:href="${catalogueUrl}" th:text="#{ui.00125}">Cancel</a><button class="btn btn--primary" type="submit" th:text="${editingId != null} ? #{ui.00686} : #{ui.00972}">Save</button></footer>
        </form>
    </section>
</div>
</th:block>
