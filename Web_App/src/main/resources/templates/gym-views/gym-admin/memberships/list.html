<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(${pageTitle} ?: #{ui.00989}, null, ~{::content}, null)}">
<div th:fragment="content" class="gym-operations-v2 gym-products-v2 mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
    <header class="gym-roster-header" data-site-tour="gym-memberships">
        <div><h1 th:text="#{ui.00974}"></h1><p th:text="#{ui.00975}"></p></div>
        <nav><a th:href="@{/gym/dashboard}" th:text="#{ui.00945}"></a><a class="btn btn--primary" th:href="@{/gym/admin/memberships/create(search=${search},state=${state},page=${productsPage.number},size=${pageSize})}" th:text="#{ui.00972}"></a></nav>
    </header>
    <p th:if="${successMessage}" class="gym-roster-feedback" role="status" th:text="${successMessage}"></p>
    <p th:if="${errorMessage}" class="gym-feedback" role="alert" th:text="${errorMessage}"></p>
    <dl class="gym-products-metrics">
        <div><dt th:text="#{ui.00986}"></dt><dd th:text="${totalProductsCount}"></dd></div>
        <div><dt th:text="#{ui.00987}"></dt><dd th:text="${activeProductsCount}"></dd></div>
        <div><dt th:text="#{ui.gymRoster.activeSubscribers}"></dt><dd th:text="${subscribersCount}"></dd></div>
    </dl>
    <section class="gym-roster-panel" th:attr="aria-label=#{ui.00974}">
        <p th:text="#{ui.gymProducts.countHint}"></p>
        <form class="gym-products-filters" method="get" th:action="@{/gym/admin/memberships} + '#membership-results'">
            <input type="hidden" name="size" th:value="${pageSize}">
            <div><label for="membership-search" th:text="#{ui.gymProducts.search}"></label><input id="membership-search" name="search" type="search" maxlength="120" th:value="${search}"></div>
            <div><label for="membership-state" th:text="#{ui.00006}"></label><select id="membership-state" name="state">
                <option value="" th:selected="${state == ''}" th:text="#{ui.00485}"></option>
                <option value="ACTIVE" th:selected="${state == 'ACTIVE'}" th:text="#{ui.00134}"></option>
                <option value="INACTIVE" th:selected="${state == 'INACTIVE'}" th:text="#{ui.00137}"></option>
                <option th:if="${productFilterInvalid and state != '' and state != 'ACTIVE' and state != 'INACTIVE'}" th:value="${state}" selected th:text="${state}"></option>
            </select></div>
            <button class="btn btn--primary" type="submit" th:text="#{ui.00554}"></button><a class="btn btn--secondary" th:href="@{/gym/admin/memberships}" th:text="#{ui.00563}"></a>
        </form>
        <p th:if="${productFilterInvalid}" class="gym-feedback" role="alert" th:text="#{ui.gymProducts.filtersInvalid}"></p>
        <p id="membership-results" tabindex="-1" th:text="#{ui.library.resultsRange(${rangeStart},${rangeEnd},${productsPage.totalElements})}"></p>
        <div class="gym-roster-empty" th:if="${productsPage.empty and !productFilterInvalid}">
            <h2 th:text="${totalProductsCount == 0} ? #{ui.00976} : #{ui.gymProducts.emptyResults}"></h2>
            <p th:text="${totalProductsCount == 0} ? #{ui.00977} : #{ui.gymProducts.adjustFilters}"></p>
        </div>
        <div class="gym-product-list">
            <article class="gym-product-card" th:each="product : ${products}" th:attr="data-product-id=${product.id},aria-labelledby=${'membership-title-' + product.id}">
                <header><h2 dir="auto" th:id="${'membership-title-' + product.id}" th:text="${product.name}"></h2><span class="gym-product-state" th:text="${product.active} ? #{ui.00134} : #{ui.00137}"></span></header>
                <p class="gym-product-description" dir="auto" th:if="${!#strings.isEmpty(product.description)}" th:text="${product.description}"></p>
                <dl class="gym-product-facts">
                    <div><dt th:text="#{ui.00964}"></dt><dd dir="ltr">$<span th:text="${#numbers.formatDecimal(product.priceDollars, 1, 2)}"></span> <small>USD</small></dd></div>
                    <div><dt th:text="#{ui.00978}"></dt><dd th:text="#{ui.00969}"></dd></div>
                    <div><dt th:text="#{ui.gymRoster.activeSubscribers}"></dt><dd th:text="${subscriberCounts.get(product.id)}"></dd></div>
                </dl>
                <div class="gym-product-actions">
                    <a class="btn btn--secondary" th:href="@{/gym/admin/memberships/{id}/edit(id=${product.id},search=${search},state=${state},page=${productsPage.number},size=${pageSize})}" th:text="#{ui.00138}"></a>
                    <a class="btn btn--primary" th:href="@{/gym/admin/memberships/{id}/price-change(id=${product.id})}" th:text="#{ui.00980}"></a>
                    <a class="btn btn--secondary" th:href="@{/gym/admin/memberships/{id}/price-history(id=${product.id})}" th:text="#{ui.00981}"></a>
                    <form th:if="${!product.active}" method="post" th:action="@{/gym/admin/memberships/{id}/status(id=${product.id})}">
                        <input type="hidden" name="active" value="true"><input type="hidden" name="search" th:value="${search}"><input type="hidden" name="state" th:value="${state}"><input type="hidden" name="page" th:value="${productsPage.number}"><input type="hidden" name="size" th:value="${pageSize}">
                        <button class="btn btn--secondary" type="submit" th:text="#{ui.gymProducts.activate}"></button>
                    </form>
                </div>
                <details class="gym-product-deactivation" th:if="${product.active}">
                    <summary th:text="#{ui.gymProducts.deactivate}"></summary><p th:text="#{ui.gym.deactivate}"></p>
                    <form method="post" th:action="@{/gym/admin/memberships/{id}/status(id=${product.id})}">
                        <input type="hidden" name="active" value="false"><input type="hidden" name="search" th:value="${search}"><input type="hidden" name="state" th:value="${state}"><input type="hidden" name="page" th:value="${productsPage.number}"><input type="hidden" name="size" th:value="${pageSize}">
                        <button class="btn btn--secondary" type="submit" th:text="#{ui.gymProducts.confirmDeactivate}"></button>
                    </form>
                </details>
            </article>
        </div>
        <nav th:if="${productsPage.totalPages > 1}" class="gym-roster-pagination" th:attr="aria-label=#{ui.00974}">
            <p th:text="#{ui.library.pageNumber(${productsPage.number + 1},${productsPage.totalPages})}"></p>
            <a th:if="${productsPage.hasPrevious()}" class="btn btn--secondary" th:href="@{/gym/admin/memberships(search=${search},state=${state},page=${productsPage.number - 1},size=${pageSize})}" th:text="#{ui.library.previousPage}"></a>
            <a th:if="${productsPage.hasNext()}" class="btn btn--secondary" th:href="@{/gym/admin/memberships(search=${search},state=${state},page=${productsPage.number + 1},size=${pageSize})}" th:text="#{ui.library.nextPage}"></a>
        </nav>
    </section>
</div>
</th:block>
