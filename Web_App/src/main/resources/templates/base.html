<!DOCTYPE html>
<html lang="en"
    xmlns:th="http://www.thymeleaf.org"
    th:classappend="${userSettings != null and userSettings.theme != null and userSettings.theme.toString() == 'DARK'} ? ' dark'"
    th:attr="lang=${currentLanguage.localeTag()},
             dir=${textDirection},
             data-lang=${currentLanguage.code()},
             data-theme=${userSettings != null && userSettings.theme != null ? userSettings.theme.toString().toLowerCase() : 'system'},
             data-colorblind=${userSettings != null && userSettings.colorBlindMode ? 'on' : 'off'}"
    th:with="assetVersion=${uiCssVersion != null and !#strings.isEmpty(uiCssVersion) ? uiCssVersion : '20261002v2b'},
             authUser=${@authHelper.getAuthenticatedUser()},
             includeNavbar=${@environment.getProperty('app.ui.includeNavbar') != 'false' and disableNavbar != true},
             includeGlobalChatbot=${@environment.getProperty('app.ui.includeChatbot') != 'false' and disableGlobalChatbot != true and disableGlobalChatbot != 'true'},
             includeQuickActions=${#authentication != null and #authentication.authenticated and #authentication.principal != 'anonymousUser' and disableQuickActions != true},
             documentTitle=${includeGuestExperience == true and currentRequestPath != '/' and pageTitle != null and !#strings.isEmpty(pageTitle) and !#strings.contains(#strings.toLowerCase(pageTitle), 'one to one') ? pageTitle + ' | One To One' : (pageTitle != null and !#strings.isEmpty(pageTitle) ? pageTitle : 'One To One')}"
    th:fragment="layout(pageTitle, pageStyles, content, pageScripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
          th:content="${pageDescription} ?: 'One To One connects clients with verified personal trainers through structured programmes, secure payments and visible progress.'">
    <meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#060914" media="(prefers-color-scheme: dark)">
    <meta property="og:site_name" content="One To One">
    <meta property="og:type" content="website">
    <meta property="og:title" th:content="${documentTitle}">
    <meta property="og:description"
          th:content="${pageDescription} ?: 'Verified personal training, connected programmes and visible progress.'">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <meta name="_csrf_param" th:if="${_csrf != null}" th:content="${_csrf.parameterName}">
    <title th:text="${documentTitle}">One To One</title>
    <link rel="shortcut icon" th:href="@{/favicon.ico}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/brand/tab_logo.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/brand/tab_logo.png}">
    <link rel="apple-touch-icon" th:href="@{/img/brand/tab_logo.png}">

    <!-- No-flash theme script: must run before CSS to prevent flash of wrong theme. -->
    <script th:src="@{/js/core/theme-preload.js(v='20260730a')}"></script>
    <noscript>
        <link rel="stylesheet" th:href="@{/css/components/core/shell-noscript.css(v=${assetVersion})}"/>
    </noscript>
    <script th:src="@{/js/core/overlay-manager.js(v='20260713a')}"></script>

    <!-- Core styles stay small; shell and route bundles load only when their UI is present. -->
    <link rel="stylesheet" th:href="@{/css/app.css(v=${assetVersion})}">
    <link rel="stylesheet" th:if="${includeGlobalChatbot}"
          th:href="@{/css/bundles/assistant.css(v=${assetVersion})}">
    <link rel="stylesheet" th:if="${includeQuickActions}"
          th:href="@{/css/bundles/authenticated-shell.css(v=${assetVersion})}">
    <link rel="stylesheet" th:if="${includeQuickActions}"
          th:href="@{/css/bundles/tutorial.css(v=${assetVersion})}">
    <link rel="stylesheet" th:each="styleBundle : ${uiStyleBundles}"
          th:href="${styleBundle + '?v=' + assetVersion}">

    <!-- Page-specific styles -->
    <th:block th:if="${pageStyles != null}">
        <th:block th:replace="${pageStyles}"></th:block>
    </th:block>
    <link rel="stylesheet" th:href="@{/css/bundles/design-system.css(v=${assetVersion})}">
</head>

<body class="version-two min-h-screen bg-cyber-900 text-slate-100 antialiased"
    th:classappend="${((userSettings != null and userSettings.easyMode) ? ' text-lg leading-relaxed' : ' text-base') + (userSettings != null and userSettings.colorBlindMode ? ' color-blind' : '') + (timeOfDayMoodClass != null ? ' ' + timeOfDayMoodClass : '') + (includeGlobalChatbot == true ? ' has-global-chat' : '') + (includeQuickActions == true ? ' has-quick-actions has-platform-panel' : ' public-guest') + (includeGuestExperience == true ? ' guest-route' : '')}"
    th:attr="data-time-theme=${timeTheme},
             data-chat-history=${disableChatHistory == true ? 'off' : 'on'},
             data-language=${currentLanguage.code()},
             data-easy-mode=${userSettings != null && userSettings.easyMode ? 'on' : 'off'},
             data-color-blind=${userSettings != null && userSettings.colorBlindMode ? 'on' : 'off'},
             data-disability-hearing=${userSettings != null && userSettings.disabilityHearing ? 'on' : 'off'},
             data-disability-mobility=${userSettings != null && userSettings.disabilityMobility ? 'on' : 'off'},
             data-disability-vision=${userSettings != null && userSettings.disabilityVision ? 'on' : 'off'},
             data-day-mode=${dayMode != null ? dayMode : 'REST_DAY'}">

<!-- NAVBAR -->
<th:block th:if="${includeNavbar}">
    <th:block th:insert="~{universal-fragments/layout/navbar :: navbar}"></th:block>
</th:block>

<!-- MAIN CONTENT -->
<main id="main-content" th:class="${authPageLayout == true ? 'auth-page-main pt-2 sm:pt-3' : 'min-h-[calc(100vh-5rem)] ' + (compactTopContent == true ? 'pt-2 sm:pt-3' : 'pt-4 sm:pt-6')}">
    <th:block th:replace="${content}"></th:block>
</main>

<!-- FOOTER -->
<th:block th:if="${disableFooter != true}" th:insert="~{universal-fragments/layout/footer :: footer}"></th:block>

<!-- CHATBOT (global) -->
<th:block th:if="${includeGlobalChatbot}">
    <div th:replace="~{universal-fragments/chat/chat-widget :: chatWidget}"></div>
</th:block>

<!-- QUICK ACTIONS (global, authenticated only) -->
<th:block th:if="${includeQuickActions}">
    <div th:replace="~{universal-fragments/layout/quick-actions :: quickActionsShelf}"></div>
    <div th:replace="~{universal-fragments/layout/platform-panel :: platformPanel}"></div>
    <div th:replace="~{universal-fragments/tutorial/site-tour :: siteTour}"></div>
</th:block>

<!-- Core scripts -->
<th:block th:insert="~{universal-fragments/layout/confirmation-dialog :: confirmationDialog}"></th:block>
<script th:src="@{/js/core/dom-safety.js(v=${assetVersion})}" defer></script>
<script th:if="${includeGlobalChatbot}" th:src="@{/js/chat/chat.js(v=${assetVersion})}" defer></script>
<script th:src="@{/js/core/form-auto-submit.js(v='20260320a')}" defer></script>
<script th:src="@{/js/core/confirm-action.js(v=${assetVersion})}" defer></script>
<script th:src="@{/js/core/back-navigation.js(v=${assetVersion})}" defer></script>
<script th:src="@{/js/core/health-chart-toggle.js(v='20260320a')}" defer></script>
<script th:if="${includeQuickActions}" th:src="@{/js/core/quick-actions.js(v=${assetVersion})}" defer></script>
<script th:if="${includeQuickActions}" th:src="@{/js/core/platform-panel.js(v=${assetVersion})}" defer></script>
<script th:if="${includeQuickActions}" th:src="@{/js/public/site-tour.js(v=${assetVersion})}" defer></script>
<script th:src="@{/js/core/navbar-premium.js(v='20260316a')}" defer></script>
<script th:src="@{/js/core/language-selector.js(v=${assetVersion})}" defer></script>
<script th:src="@{/js/core/floating-profile-card.js(v=${assetVersion})}" defer></script>
<script th:src="@{/js/core/profile-preview.js(v=${assetVersion})}" defer></script>
    <script th:if="${includeGuestExperience}"
        th:src="@{/js/public/guest-experience.js(v=${assetVersion})}" defer></script>
    <script th:if="${authPageLayout == true}"
        th:src="@{/js/auth/auth-experience.js(v=${assetVersion})}" defer></script>

<!-- Page-specific scripts -->
<th:block th:if="${pageScripts != null}">
    <th:block th:replace="${pageScripts}"></th:block>
</th:block>

<!-- Global AI button loading handler -->
<script th:src="@{/js/core/ai-loading.js(v=${assetVersion})}" defer></script>

</body>
</html>
