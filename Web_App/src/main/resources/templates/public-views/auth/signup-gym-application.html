<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(#{ui.01212}, null, ~{::content}, null)}">

    <div th:fragment="content" class="auth-container auth-container--wide guest-experience guest-auth guest-auth--application" data-guest-scene>
        <div class="guest-auth__stage">
            <header class="guest-auth__assurance">
                <span class="guest-auth__brand-mark" aria-hidden="true"></span>
                <div class="guest-auth__intro">
                    <span class="guest-auth__signal-line" aria-hidden="true"></span>
                    <h1 class="auth-heading" th:text="#{ui.01206}">Gym application status</h1>
                    <p class="auth-subheading" th:text="#{ui.01207}">Track the review status and reply when our team requests more information.</p>
                </div>
                <span class="guest-auth__assurance-rail" aria-hidden="true"></span>
            </header>

            <div class="auth-card guest-auth__panel">
                <div class="auth-accent-bar"></div>

            <div th:if="${gymApplicationSuccess}" class="auth-alert auth-alert--success" role="alert" th:text="${gymApplicationSuccess}">Saved.</div>
            <div th:if="${gymApplicationError}" class="auth-alert auth-alert--error" role="alert" th:text="${gymApplicationError}">Error.</div>

            <section class="auth-application-card">
                <div class="auth-application-card__header">
                    <div>
                        <p class="auth-application-card__eyebrow" th:text="#{ui.01208}">Application</p>
                        <h2 class="auth-application-card__title" th:text="${gymApplication.gymName}">Gym name</h2>
                        <p class="auth-application-card__email" th:text="${gymApplication.adminEmail}">email@example.com</p>
                    </div>
                    <span class="auth-application-status" th:text="${gymApplication.status}">PENDING</span>
                </div>

                <dl class="auth-application-details">
                    <div>
                        <dt th:text="#{ui.01177}">Gym username</dt>
                        <dd th:text="${gymApplication.gymUsername}">gym_username</dd>
                    </div>
                    <div>
                        <dt th:text="#{ui.00019}">Primary contact</dt>
                        <dd th:text="${gymApplication.contactName}">Contact name</dd>
                    </div>
                    <div>
                        <dt th:text="#{ui.00020}">Phone</dt>
                        <dd th:text="${gymApplication.contactPhone}">000</dd>
                    </div>
                    <div>
                        <dt th:text="#{ui.00546}">Location</dt>
                        <dd th:text="${gymApplication.address + ', ' + gymApplication.city}">Address</dd>
                    </div>
                </dl>
            </section>

            <section class="auth-application-messages">
                <div th:each="message : ${messages}" class="auth-application-message">
                    <div class="auth-application-message__meta">
                        <p th:text="${message.senderType}">SYSTEM</p>
                        <time th:datetime="${message.createdAt}" th:text="${#temporals.format(message.createdAt, 'yyyy-MM-dd HH:mm')}">2026-03-30 10:00</time>
                    </div>
                    <p th:if="${message.subject != null}" class="auth-application-message__subject" th:text="${message.subject}">Subject</p>
                    <p class="auth-application-message__body" th:text="${message.body}">Message body.</p>
                </div>
            </section>

            <form th:if="${gymApplication.status.name() != 'APPROVED' and gymApplication.status.name() != 'DECLINED'}"
                  th:action="@{/signup/gym/application/{token}/reply(token=${gymApplication.accessToken})}"
                  method="post"
                  class="auth-application-reply">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div>
                    <label for="applicationReply" class="auth-field__label" th:text="#{ui.01209}">Reply to the review team</label>
                    <textarea id="applicationReply" name="message" rows="5" maxlength="5000" class="auth-field__input" placeholder="Add further details, documents, or clarifications for the application review." th:placeholder="#{ui.01210}"></textarea>
                </div>
                <button type="submit" class="auth-btn auth-btn--primary">
                    <span th:text="#{ui.01211}">Send update</span>
                </button>
            </form>
            </div>
        </div>
    </div>

</th:block>
