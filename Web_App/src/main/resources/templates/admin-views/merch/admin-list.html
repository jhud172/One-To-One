<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{base :: layout(#{ui.00141}, null, ~{::content}, null)}">

    <div th:fragment="content" class="merch-workspace-v2 merch-admin-v2 mx-auto w-full max-w-5xl px-4 py-10 sm:px-6 lg:px-8">

        <div class="mb-6 flex flex-wrap items-center justify-between gap-4" data-site-tour="admin-merch">
            <h1 class="text-2xl font-bold gradient-text" th:text="#{ui.00127}">Merch Products</h1>
            <a th:href="@{/admin/merch/new}" class="btn btn--primary text-sm" th:text="#{ui.00128}">+ Add Product</a>
        </div>

        <!-- Flash messages -->
        <div th:if="${successMessage}"
             class="mb-4 rounded-lg border border-neon-green/40 bg-neon-green/10 p-3 text-sm text-neon-green"
             th:text="${successMessage}"></div>
        <div th:if="${errorMessage}"
             class="mb-4 rounded-lg border border-red-500/40 bg-red-500/10 p-3 text-sm text-red-400"
             th:text="${errorMessage}"></div>

        <form method="get" th:action="@{/admin/merch}" class="merch-native-filters">
            <div><label for="admin-merch-search" th:text="#{ui.02062}"></label><input id="admin-merch-search" name="search" type="search" maxlength="120" th:value="${search}"></div>
            <div><label for="admin-merch-state" th:text="#{ui.00134}"></label><select id="admin-merch-state" name="state"><option value="" th:text="#{ui.00485}"></option><option value="active" th:selected="${selectedState == 'active'}" th:text="#{ui.00134}"></option><option value="inactive" th:selected="${selectedState == 'inactive'}" th:text="#{ui.00137}"></option></select></div>
            <button type="submit" class="btn btn--primary" th:text="#{ui.00554}"></button><a th:href="@{/admin/merch}" class="btn btn--secondary" th:text="#{ui.00563}"></a>
        </form>
        <p><span th:text="#{ui.00982}"></span> <span th:text="${#lists.size(products)}"></span> <span th:text="#{ui.00983}"></span> <span th:text="${totalProducts}"></span></p>
        <!-- Products table -->
        <div th:if="${#lists.isEmpty(products)}"
             class="card-neon card--cyan p-8 text-center text-slate-400" th:text="${totalProducts > 0} ? #{ui.02068} : #{ui.00129}">
            No products yet. Click "Add Product" to get started.
        </div>

        <div th:if="${!#lists.isEmpty(products)}" class="card-neon card--cyan overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="border-b border-slate-700/50">
                    <tr class="text-xs uppercase tracking-wide text-slate-500">
                        <th class="px-4 py-3 text-left" th:text="#{ui.00130}">Image</th>
                        <th class="px-4 py-3 text-left" th:text="#{ui.00131}">Name</th>
                        <th class="px-4 py-3 text-left" th:text="#{ui.00117}">Category</th>
                        <th class="px-4 py-3 text-right" th:text="#{ui.00132}">Price</th>
                        <th class="px-4 py-3 text-right" th:text="#{ui.00133}">Stock</th>
                        <th class="px-4 py-3 text-center" th:text="#{ui.00134}">Active</th>
                        <th class="px-4 py-3 text-right" th:text="#{ui.00135}">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}"
                        class="border-b border-slate-700/30 last:border-0 hover:bg-slate-800/30 transition-colors">
                        <!-- Image -->
                        <td class="px-4 py-3">
                            <img th:if="${product.imageUrl != null}"
                                 th:src="${product.imageUrl}"
                                 th:alt="${product.name}"
                                 class="h-10 w-10 rounded object-cover" />
                            <span th:if="${product.imageUrl == null}"
                                  class="inline-flex h-10 w-10 items-center justify-center rounded bg-slate-700 text-slate-500 text-xs" th:text="#{ui.00136}">N/A</span>
                        </td>
                        <!-- Name -->
                        <td class="px-4 py-3 font-medium text-white" th:text="${product.name}">Name</td>
                        <!-- Category -->
                        <td class="px-4 py-3 text-slate-400" th:text="${product.category ?: '—'}">Cat</td>
                        <!-- Price -->
                        <td class="px-4 py-3 text-right text-neon-cyan font-semibold"
                            th:text="'£' + ${#numbers.formatDecimal(product.price, 1, 2)}">£0.00</td>
                        <!-- Stock -->
                        <td class="px-4 py-3 text-right"
                            th:classappend="${product.stockQuantity == 0} ? 'text-red-400' : 'text-slate-300'"
                            th:text="${product.stockQuantity}">0</td>
                        <!-- Active -->
                        <td class="px-4 py-3 text-center">
                            <span th:if="${product.active}"
                                  class="inline-flex items-center rounded-full bg-neon-green/10 border border-neon-green/30 px-2 py-0.5 text-xs text-neon-green" th:text="#{ui.00134}">Active</span>
                            <span th:if="${!product.active}"
                                  class="inline-flex items-center rounded-full bg-slate-700/50 border border-slate-600 px-2 py-0.5 text-xs text-slate-500" th:text="#{ui.00137}">Inactive</span>
                        </td>
                        <!-- Actions -->
                        <td class="px-4 py-3 text-right">
                            <div class="flex items-center justify-end gap-2">
                                <a th:href="@{/admin/merch/{id}/edit(id=${product.id})}"
                                   class="btn btn--secondary text-xs px-3 py-1" th:text="#{ui.00138}">Edit</a>
                                <form th:action="@{/admin/merch/{id}/delete(id=${product.id})}"
                                      method="post"
                                      th:attr="data-confirm=#{ui.merch.retireConfirm}">
                                    <button type="submit" class="btn text-xs px-3 py-1 bg-red-900/40 border border-red-700/50 text-red-400 hover:bg-red-800/60" th:text="#{ui.merch.retire}">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-4">
            <a th:href="@{/merch}" class="text-sm text-neon-cyan hover:underline" th:text="#{ui.00140}">← View public shop</a>
        </div>
    </div>

</th:block>
