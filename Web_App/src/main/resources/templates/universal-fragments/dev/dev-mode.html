<th:block xmlns:th="http://www.thymeleaf.org"
          th:fragment="devModeFragments">

    <a th:fragment="pill(variantClass, labelText)"
       th:if="${@devModeProperties.devMode}"
       th:with="resolvedVariant=${variantClass != null ? variantClass : ''},
                resolvedLabel=${labelText != null ? labelText : 'DEV'}"
       th:href="@{/dev-mode}"
       class="dev-mode-pill"
       th:classappend="${resolvedVariant}"
       data-dev-mode-trigger
       th:attr="title=#{dev.pill.title},aria-label=${resolvedLabel}">
        <span class="dev-mode-pill__icon" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="m7.2 6.2-3.1 3.1 3.1 3.1"/>
                <path d="m12.8 6.2 3.1 3.1-3.1 3.1"/>
                <path d="m11.2 4.7-2.4 9.2"/>
            </svg>
            <span class="dev-mode-pill__dot"></span>
        </span>
        <span class="dev-mode-pill__label" th:text="${resolvedLabel}">DEV</span>
    </a>

    <div th:fragment="homeGuestNotice"
         th:if="${@devModeProperties.devMode}"
         id="devModeHomeNotice"
         class="dev-mode-notification"
         role="status"
         aria-live="polite"
         aria-atomic="true"
         aria-hidden="true"
         data-auto-dismiss-ms="5000"
         inert
         hidden>
        <article class="dev-mode-notification__card" data-dev-mode-notification-card>
            <div class="dev-mode-notification__signal" aria-hidden="true">
                <span class="dev-mode-notification__signal-core"></span>
            </div>

            <div class="dev-mode-notification__content">
                <p class="dev-mode-notification__eyebrow">
                    <span class="dev-mode-notification__dot" aria-hidden="true"></span>
                    <th:block th:text="#{dev.notice.eyebrow}">Development environment</th:block>
                </p>
                <h2 class="dev-mode-notification__title" th:text="#{dev.notice.title}">Development mode is active</h2>
                <p class="dev-mode-notification__copy" th:text="#{dev.notice.copy}">Data entered during testing may be reset or changed.</p>
            </div>

            <div class="dev-mode-notification__actions">
                <a th:href="@{/dev-mode}" class="dev-mode-notification__hub-link">
                    <span th:text="#{dev.notice.action}">Open Dev Hub</span>
                    <svg class="dev-mode-notification__arrow" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
                    </svg>
                </a>
                <button type="button"
                        class="dev-mode-notification__close"
                        data-dev-mode-notification-close
                        th:attr="aria-label=#{dev.notice.dismiss}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6l12 12M18 6L6 18"/>
                    </svg>
                </button>
            </div>

            <span class="dev-mode-notification__timer" aria-hidden="true"></span>
        </article>
    </div>
</th:block>
