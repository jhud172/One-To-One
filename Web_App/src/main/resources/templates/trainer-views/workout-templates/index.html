<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.02848}, null, ~{::content}, null)}">
<div th:fragment="content" class="display-studio">
    <header class="display-studio__header"><div><p class="display-studio__eyebrow" th:text="#{ui.02832}">Layout</p><h1 th:text="#{ui.02848}">Workout templates</h1><p th:text="#{ui.display.context}">Choose the appearance of your workout player. These layouts do not change your training plan.</p></div><a class="training-launch__action training-launch__action--primary" href="/workout-templates/builder" th:text="#{ui.02850}">New template</a></header>
    <p th:if="${displayFeedback != null}" class="display-studio__notice" role="status" th:text="${#messages.msg(displayFeedback)}"></p>
    <p th:if="${displayError != null}" class="display-studio__notice display-studio__notice--error" role="alert" th:text="${#messages.msg(displayError)}"></p>
    <section aria-labelledby="own-layouts"><h2 id="own-layouts" th:text="#{ui.02851}">My templates</h2><p class="display-studio__empty" th:if="${#lists.isEmpty(userTemplates)}"><span th:text="#{ui.02852}">No custom templates yet.</span> <a href="/workout-templates/builder" th:text="#{ui.02853}">Create your first template</a></p><div class="display-studio__cards"><th:block th:each="tpl : ${userTemplates}"><article th:replace="~{trainer-views/workout-templates/index :: card(${tpl}, true)}"></article></th:block></div></section>
    <section aria-labelledby="built-in-layouts" th:if="${!#lists.isEmpty(globalTemplates)}"><h2 id="built-in-layouts" th:text="#{ui.02856}">Built-in templates</h2><div class="display-studio__cards"><th:block th:each="tpl : ${globalTemplates}"><article th:replace="~{trainer-views/workout-templates/index :: card(${tpl}, false)}"></article></th:block></div></section>
</div>
<article th:fragment="card(tpl, own)" class="display-studio__card" th:attr="data-template-id=${tpl.id}">
    <div class="display-studio__card-heading"><h3><bdi th:text="${tpl.name}">Layout</bdi></h3><span class="display-studio__preferred" th:if="${preferredTemplate != null and tpl.id == preferredTemplate.id}" th:text="#{ui.02854}">Preferred</span></div>
    <th:block th:replace="~{fragments/workout-display-preview :: preview(${templatePreviews.get(tpl.id)})}"></th:block>
    <div class="display-studio__actions"><a class="training-launch__action" th:if="${own}" th:href="@{/workout-templates/builder/{id}(id=${tpl.id})}" th:attr="aria-label=#{ui.training.actionFor(#{ui.00138},${tpl.name})}" th:text="#{ui.00138}">Edit</a>
        <a class="training-launch__action" th:href="@{/workout-templates/builder(copy=${tpl.id})}" th:attr="aria-label=#{ui.training.actionFor(#{ui.display.copy},${tpl.name})}" th:text="#{ui.display.copy}">Create a copy</a>
        <form method="post" th:action="@{/workout-templates/{id}/prefer(id=${tpl.id})}"><button class="training-launch__action training-launch__action--primary" type="submit" th:disabled="${preferredTemplate != null and tpl.id == preferredTemplate.id}" th:attr="aria-label=#{ui.training.actionFor(#{ui.02855},${tpl.name})}" th:text="#{ui.02855}">Set as preferred</button></form>
        <form th:if="${own}" method="post" th:action="@{/workout-templates/{id}/delete(id=${tpl.id})}" th:attr="data-confirm=#{ui.02120}"><button class="training-launch__action" type="submit" th:attr="aria-label=#{ui.training.actionFor(#{ui.00139},${tpl.name})}" th:text="#{ui.00139}">Delete</button></form>
    </div>
</article>
</th:block>
