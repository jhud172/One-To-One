<th:block xmlns:th="http://www.thymeleaf.org">
<div th:fragment="libraryShareDialog(dialogId, resourceName)" class="library-share-v2">
    <p th:if="${libraryShared}" class="checkin-feedback" role="status" dir="auto" th:text="${librarySharedRecipient != null ? #messages.msg('ui.library.shareSavedFor', librarySharedRecipient) : #messages.msg('ui.library.shareSaved')}"></p>
    <p th:if="${libraryShareError}" th:id="${dialogId + '-error'}" class="profile-editor-errors" role="alert" th:text="#{ui.library.shareError}"></p>
    <details th:id="${dialogId}" th:attr="data-share-dialog=${dialogId}" th:open="${libraryShareError}">
        <summary th:text="#{ui.02701}">Share to active client</summary>
        <div class="library-share-resource"><p th:text="#{ui.library.resourceToShare}"></p><h3 dir="auto" th:text="${resourceName}"></h3></div>
        <p class="library-share-scope" th:id="${dialogId + '-scope'}" th:text="#{ui.library.shareScope}"></p>
        <div th:if="${#lists.isEmpty(activeClients)}" class="library-share-empty"><p th:text="#{ui.library.noActiveClients}"></p><a class="detail-btn-secondary" th:href="@{/trainer/clients}" th:text="#{ui.02985}"></a></div>
        <form th:unless="${#lists.isEmpty(activeClients)}" method="post" th:action="@{/trainer/library/share}" th:object="${shareForm}">
            <input type="hidden" th:field="*{templateType}"><input type="hidden" th:field="*{templateId}"><input type="hidden" th:field="*{returnUrl}">
            <input type="hidden" name="q" th:value="${query ?: ''}"><input type="hidden" name="page" th:value="${libraryPage ?: 0}">
            <label th:for="${dialogId + '-clientId'}" th:text="#{ui.01288}"></label>
            <select th:id="${dialogId + '-clientId'}" name="clientId" required th:attr="aria-describedby=${dialogId + '-scope' + (libraryShareError == true ? ' ' + dialogId + '-error' : '')},aria-invalid=${libraryShareError == true ? 'true' : null}"><option value="" th:text="#{ui.02703}"></option><option th:each="client : ${activeClients}" th:value="${client.id}" th:selected="${shareForm.clientId == client.id}" th:text="${client.fullName != null and !#strings.isEmpty(client.fullName) ? client.fullName : client.username}"></option></select>
            <button type="submit" class="detail-btn-primary" th:text="#{ui.02697}"></button>
        </form>
    </details>
</div></th:block>
