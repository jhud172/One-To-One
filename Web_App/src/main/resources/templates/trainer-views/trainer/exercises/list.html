<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.02688}, null, ~{::content}, null)}">
<div th:fragment="content" class="client-workspace-v2 library-exercise-v2 library-catalogue-v2">
    <header class="detail-header"><div class="detail-header-content"><div><p class="detail-label" th:text="#{ui.library.privateCatalogue}"></p><h1 class="detail-title" th:text="#{ui.02688}"></h1><p class="detail-subtitle" th:text="#{ui.library.catalogueHint}"></p></div><div class="connection-actions"><a class="detail-btn-secondary" th:href="@{/trainer/library}" th:text="#{ui.02654}"></a><a class="detail-btn-primary" th:href="@{/trainer/library/exercises/create(q=${query},page=${libraryPage})}" th:text="#{ui.02655}"></a></div></div>
        <form method="get" th:action="@{/trainer/library/exercises}" class="connection-search"><label for="exerciseSearch" th:text="#{ui.02690}"></label><div><input id="exerciseSearch" type="search" name="q" maxlength="120" th:value="${query}" th:placeholder="#{ui.02690}"><button class="detail-btn-primary" type="submit" th:text="#{ui.00260}"></button><a th:if="${!#strings.isEmpty(query)}" class="detail-btn-secondary" th:href="@{/trainer/library/exercises}" th:text="#{ui.00555}"></a></div></form>
        <p><span th:text="#{ui.02691}"></span>: <strong th:text="${exerciseCount}"></strong> · <span th:text="#{ui.library.resultsRange(${exercisePage.totalElements == 0 ? 0 : libraryPage * exercisePage.size + 1},${libraryPage * exercisePage.size + #lists.size(exercises)},${exercisePage.totalElements})}"></span></p>
    </header>
    <section th:if="${#lists.isEmpty(exercises)}" class="detail-section library-exercise-empty"><h2 class="detail-section-title" th:text="${exerciseCount == 0} ? #{ui.02692} : #{ui.01563}"></h2><p th:if="${exerciseCount == 0}" th:text="#{ui.02693}"></p><a th:if="${exerciseCount == 0}" class="detail-btn-primary" th:href="@{/trainer/library/exercises/create(q=${query},page=${libraryPage})}" th:text="#{ui.02694}"></a></section>
    <div th:unless="${#lists.isEmpty(exercises)}" class="library-exercise-grid">
        <article th:each="exercise : ${exercises}" class="detail-section library-catalogue-card" th:id="${'exercise-' + exercise.id}">
            <div class="library-catalogue-card-heading"><p class="detail-label" th:text="#{ui.02695}"></p><span class="library-catalogue-difficulty" th:switch="${#strings.toUpperCase(exercise.difficulty)}"><span th:case="'BEGINNER'" th:text="#{ui.02668}"></span><span th:case="'INTERMEDIATE'" th:text="#{ui.02669}"></span><span th:case="'ADVANCED'" th:text="#{ui.02670}"></span><span th:case="'*'" th:text="${exercise.difficulty}"></span></span></div>
            <h2 class="detail-section-title"><a th:href="@{/trainer/library/exercises/{id}(id=${exercise.id},q=${query},page=${libraryPage})}" dir="auto" th:text="${exercise.name}"></a></h2><p class="library-exercise-description" th:if="${!#strings.isEmpty(exercise.description)}" dir="auto" th:text="${exercise.description}"></p>
            <dl class="portfolio-metadata"><div><dt th:text="#{ui.02684}"></dt><dd dir="auto" th:text="${exercise.primaryMuscles}"></dd></div><div><dt th:text="#{ui.02065}"></dt><dd dir="auto" th:text="${exercise.equipment}"></dd></div></dl>
            <div class="library-catalogue-card-footer"><p class="library-catalogue-media"><span aria-hidden="true" th:text="${videoExerciseIds.contains(exercise.id) ? '▶' : '○'}"></span><span th:text="${videoExerciseIds.contains(exercise.id)} ? #{ui.library.videoAvailable} : #{ui.library.noVideo}"></span></p><a class="detail-btn-secondary" th:href="@{/trainer/library/exercises/{id}(id=${exercise.id},q=${query},page=${libraryPage})}" th:text="#{ui.02696}"></a></div>
        </article>
    </div>
    <nav th:if="${exercisePage.totalPages > 1}" class="library-catalogue-pagination" th:attr="aria-label=#{ui.02688}"><a th:if="${exercisePage.hasPrevious()}" class="detail-btn-secondary" th:href="@{/trainer/library/exercises(q=${query},page=${libraryPage - 1})}" th:text="#{ui.library.previousPage}"></a><p th:text="#{ui.library.pageNumber(${libraryPage + 1},${exercisePage.totalPages})}"></p><a th:if="${exercisePage.hasNext()}" class="detail-btn-secondary" th:href="@{/trainer/library/exercises(q=${query},page=${libraryPage + 1})}" th:text="#{ui.library.nextPage}"></a></nav>
</div></th:block>
