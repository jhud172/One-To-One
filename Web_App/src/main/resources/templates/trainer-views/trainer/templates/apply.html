<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.02753}, null, ~{::content}, null)}">
<div th:fragment="content" class="client-workspace-v2 library-exercise-v2 schedule-library-v2 schedule-application-v2">
    <header class="detail-header"><div class="detail-header-content"><div><p class="library-resource-label" th:text="#{ui.schedule.templateResource}"></p><h1 class="detail-title" th:text="#{ui.02753}"></h1><p class="detail-subtitle" dir="auto" th:text="${template.name}"></p></div><a class="detail-btn-secondary" th:href="@{/trainer/templates/{id}/edit(id=${template.id},q=${query},page=${libraryPage})}" th:text="#{ui.02754}"></a></div><p th:if="${appliedCount != null}" class="checkin-feedback" role="status" th:text="#{ui.schedule.applied(${appliedCount})}"></p></header>
    <section th:if="${template.archived}" class="detail-section"><p class="connection-empty" role="status" th:text="#{ui.schedule.archivedHint}"></p></section>
    <th:block th:unless="${template.archived}">
        <form class="detail-section profile-editor-form schedule-application-form" th:object="${applyForm}" method="get" th:action="@{/trainer/templates/{id}/apply(id=${template.id})}">
            <input type="hidden" name="q" th:value="${query}"><input type="hidden" name="page" th:value="${libraryPage}">
            <h2 class="detail-section-title" th:text="#{ui.02755}"></h2><p class="detail-subtitle" th:text="#{ui.schedule.applyHint}"></p>
            <div th:if="${#fields.hasAnyErrors()}" id="application-errors" class="profile-editor-errors" role="alert"><h3 th:text="#{auth.form.fixErrors}"></h3><p th:text="#{ui.schedule.applyInvalid}"></p><ul><li th:if="${#fields.hasErrors('clientId')}"><a href="#applyClient" th:text="#{ui.02756}"></a></li><li th:if="${#fields.hasErrors('start')}"><a href="#applyStart" th:text="#{ui.00589}"></a></li><li th:if="${#fields.hasErrors('end')}"><a href="#applyEnd" th:text="#{ui.01771}"></a></li></ul></div>
            <div th:if="${#lists.isEmpty(activeClients)}" class="connection-empty"><p th:text="#{ui.library.noActiveClients}"></p><a class="detail-btn-secondary" th:href="@{/trainer/clients}" th:text="#{ui.02413}"></a></div>
            <fieldset th:unless="${#lists.isEmpty(activeClients)}"><legend class="detail-section-title" th:text="#{ui.02755}"></legend>
                <label for="applyClient" th:text="#{ui.02756}"></label><select id="applyClient" required th:field="*{clientId}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('clientId')},aria-describedby=${#fields.hasErrors('clientId') ? 'application-errors' : null}"><option value="" th:text="#{ui.02756}"></option><option th:each="client : ${activeClients}" th:value="${client.id}" th:text="${client.fullName}"></option></select>
                <div class="profile-editor-fields"><div><label for="applyStart" th:text="#{ui.00589}"></label><input id="applyStart" type="date" required th:field="*{start}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('start')},aria-describedby=${#fields.hasErrors('start') ? 'application-errors' : null}"><p th:if="${#fields.hasErrors('start')}" dir="auto" th:text="${applyForm.start}"></p></div><div><label for="applyEnd" th:text="#{ui.01771}"></label><input id="applyEnd" type="date" required th:field="*{end}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('end')},aria-describedby=${#fields.hasErrors('end') ? 'application-errors' : null}"><p th:if="${#fields.hasErrors('end')}" dir="auto" th:text="${applyForm.end}"></p></div></div>
                <label class="profile-editor-visibility"><input type="checkbox" th:field="*{idempotent}" aria-describedby="duplicate-policy-help"><span th:text="#{ui.schedule.skipDuplicates}"></span></label><p id="duplicate-policy-help" th:text="#{ui.schedule.duplicatePolicyHelp}"></p>
                <button class="detail-btn-primary" type="submit" th:text="#{ui.00059}"></button>
            </fieldset>
        </form>
        <section th:if="${applicationConflict}" class="detail-section profile-editor-errors" role="alert"><h2 class="detail-section-title" th:text="#{ui.schedule.previewChanged}"></h2><p th:text="#{ui.schedule.previewConflictHelp}"></p></section>
        <section class="detail-section schedule-application-preview" id="application-preview" th:if="${preview != null}" aria-labelledby="application-preview-title">
            <h2 id="application-preview-title" class="detail-section-title" th:text="#{ui.00059}"></h2><h3 dir="auto" th:text="${selectedClient.fullName}"></h3><p class="schedule-application-dates"><time th:datetime="${applyForm.start}" th:text="${applyForm.start}"></time><span aria-hidden="true"> – </span><time th:datetime="${applyForm.end}" th:text="${applyForm.end}"></time></p>
            <dl class="library-exercise-facts"><div><dt th:text="#{ui.02124}"></dt><dd th:text="${newCount}"></dd></div><div><dt th:text="#{ui.schedule.skipped}"></dt><dd th:text="${duplicateCount}"></dd></div></dl><p class="detail-subtitle" th:text="#{ui.schedule.copyBehaviour}"></p>
            <p th:if="${#lists.isEmpty(preview)}" class="detail-empty" th:text="#{ui.02764}"></p><p th:if="${newCount == 0 and !#lists.isEmpty(preview)}" class="connection-empty" role="status" th:text="#{ui.schedule.noNewItemsHelp}"></p>
            <ol class="workout-item-list"><li th:each="item : ${preview}" class="workout-item-card"><div class="schedule-application-item-heading"><h3 dir="auto" th:text="${item.title}"></h3><p class="connection-status" th:text="${item.duplicate} ? #{ui.schedule.skipped} : #{ui.02124}"></p></div><p><time th:datetime="${item.date}" th:text="${#temporals.format(item.date,'EEE d MMM yyyy')}"></time> · <span th:text="${item.type.name() == 'WORKOUT'} ? #{ui.02748} : (${item.type.name() == 'NOTE'} ? #{ui.02173} : #{ui.01637})"></span><span th:if="${item.type.name() == 'TASK' and item.timeWindowStart != null}"> · <time th:text="${item.timeWindowStart}"></time></span></p><p th:if="${item.type.name() == 'WORKOUT' and item.exerciseName != null}"><span th:text="#{ui.schedule.calendarExercise}"></span>: <bdi th:text="${item.exerciseName}"></bdi></p><p th:if="${item.notes != null}" class="plan-coaching-note" dir="auto" th:text="${item.notes}"></p></li></ol>
            <form th:if="${newCount > 0}" class="schedule-reviewed-application" method="post" th:action="@{/trainer/templates/{id}/apply(id=${template.id},q=${query},page=${libraryPage})}" th:attr="data-confirm=#{ui.schedule.confirmApplication(${selectedClient.fullName},${applyForm.start},${applyForm.end},${newCount})}">
                <input type="hidden" name="clientId" th:value="${applyForm.clientId}"><input type="hidden" name="start" th:value="${applyForm.start}"><input type="hidden" name="end" th:value="${applyForm.end}"><input type="hidden" name="idempotent" th:value="${applyForm.idempotent}"><input type="hidden" name="expectedApplyRevision" th:value="${applyForm.expectedApplyRevision}">
                <button class="detail-btn-primary" type="submit" th:text="${applicationConflict} ? #{ui.schedule.applyReviewedPreview} : #{ui.00925}"></button><a class="detail-btn-secondary" th:href="@{/trainer/templates/{id}/edit(id=${template.id},q=${query},page=${libraryPage})}" th:text="#{ui.00125}"></a>
            </form>
        </section>
    </th:block>
</div></th:block>
