<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.02800}, null, ~{::content}, null)}">
<div th:fragment="content" class="client-workspace-v2 library-exercise-v2 workout-library-v2 library-catalogue-v2">
    <header class="detail-header">
        <div class="detail-header-content">
            <div><h1 class="detail-title" th:text="#{ui.02800}"></h1><p class="detail-subtitle" th:text="#{ui.library.workoutCatalogueHint}"></p></div>
            <div class="connection-actions"><a class="detail-btn-secondary" th:href="@{/trainer/library}" th:text="#{ui.02654}"></a><a class="detail-btn-primary" th:href="@{/trainer/library/workouts/create(q=${query},page=${libraryPage})}" th:text="#{ui.02798}"></a></div>
        </div>
        <form method="get" th:action="@{/trainer/library/workouts}" class="connection-search">
            <label for="workoutSearch" th:text="#{ui.library.searchWorkouts}"></label>
            <div><input id="workoutSearch" type="search" name="q" maxlength="120" dir="auto" th:value="${query}"><button class="detail-btn-primary" type="submit" th:text="#{ui.00260}"></button><a th:if="${!#strings.isEmpty(query)}" class="detail-btn-secondary" th:href="@{/trainer/library/workouts}" th:text="#{ui.00555}"></a></div>
        </form>
        <p><span th:text="#{ui.02517}"></span>: <strong th:text="${workoutCount}"></strong> · <span th:text="#{ui.library.resultsRange(${workoutPage.totalElements == 0 ? 0 : libraryPage * workoutPage.size + 1},${libraryPage * workoutPage.size + #lists.size(workouts)},${workoutPage.totalElements})}"></span></p>
    </header>
    <section th:if="${#lists.isEmpty(workouts)}" class="detail-section library-exercise-empty">
        <h2 class="detail-section-title" th:text="${workoutCount == 0} ? #{ui.library.emptyWorkouts} : #{ui.01563}"></h2>
        <p th:if="${workoutCount == 0}" th:text="#{ui.library.firstWorkoutHint}"></p><a th:if="${workoutCount == 0}" class="detail-btn-primary" th:href="@{/trainer/library/workouts/create(q=${query},page=${libraryPage})}" th:text="#{ui.02805}"></a>
    </section>
    <div th:unless="${#lists.isEmpty(workouts)}" class="library-exercise-grid">
        <article th:each="workout : ${workouts}" class="detail-section library-catalogue-card" th:id="${'workout-' + workout.id}">
            <p class="detail-label" th:text="#{ui.library.workoutResource}"></p>
            <h2 class="detail-section-title" dir="auto"><a th:href="@{/trainer/library/workouts/{id}(id=${workout.id},q=${query},page=${libraryPage})}" th:text="${workout.title}"></a></h2>
            <p class="library-exercise-description" dir="auto" th:if="${!#strings.isEmpty(workout.summary)}" th:text="${workout.summary}"></p>
            <p class="library-workout-count"><span th:text="#{ui.02329}"></span>: <strong th:text="${workoutItemCounts[workout.id] ?: 0}"></strong></p>
            <div class="library-catalogue-card-footer"><a class="detail-btn-secondary" th:href="@{/trainer/library/workouts/{id}(id=${workout.id},q=${query},page=${libraryPage})}" th:text="#{ui.02807}"></a><a class="detail-btn-secondary" th:href="@{/trainer/library/workouts/{id}/edit(id=${workout.id},q=${query},page=${libraryPage})}" th:text="#{ui.00138}"></a></div>
        </article>
    </div>
    <nav th:if="${workoutPage.totalPages > 1}" class="library-catalogue-pagination" th:attr="aria-label=#{ui.02800}"><a th:if="${workoutPage.hasPrevious()}" class="detail-btn-secondary" th:href="@{/trainer/library/workouts(q=${query},page=${libraryPage - 1})}" th:text="#{ui.library.previousPage}"></a><p th:text="#{ui.library.pageNumber(${libraryPage + 1},${workoutPage.totalPages})}"></p><a th:if="${workoutPage.hasNext()}" class="detail-btn-secondary" th:href="@{/trainer/library/workouts(q=${query},page=${libraryPage + 1})}" th:text="#{ui.library.nextPage}"></a></nav>
</div></th:block>
