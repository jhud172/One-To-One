<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(${workout.title}, null, ~{::content}, ~{::pageScripts})}">
    <div th:fragment="content" class="client-workspace-v2 library-exercise-v2 workout-library-v2">
        <header class="detail-header">
            <div class="detail-header-content">
                <div>
                    <h1 class="detail-title" dir="auto" th:text="${workout.title}"></h1>
                    <p class="detail-subtitle plan-coaching-note" th:if="${!#strings.isEmpty(workout.summary)}" dir="auto" th:text="${workout.summary}"></p>
                </div>
                <div class="detail-actions-sticky">
                    <a class="detail-btn-secondary" th:href="@{/trainer/library/workouts(q=${query},page=${libraryPage})} + ${'#workout-' + workout.id}" th:text="#{ui.02800}"></a>
                    <a class="detail-btn-secondary" th:href="@{/trainer/library/workouts/{id}/edit(id=${workout.id},q=${query},page=${libraryPage})}" th:text="#{ui.00138}"></a>
                    <a href="#shareDialog" class="detail-btn-secondary" data-share-dialog-open="shareDialog" th:text="#{ui.02697}"></a>
                </div>
            </div>
            <p class="library-instruction-sharing" th:text="#{ui.library.workoutCompositionHint}"></p>
            <p th:if="${libraryWorkoutSaved}" class="checkin-feedback" role="status" th:text="#{ui.library.workoutSaved}"></p>
            <p th:if="${libraryItemSaved}" class="checkin-feedback" role="status" th:text="#{ui.library.itemSaved}"></p>
            <p th:if="${libraryOrderSaved}" class="checkin-feedback" role="status" th:text="#{ui.library.orderSaved}"></p>
            <p th:if="${libraryOrderError}" class="profile-editor-errors" role="alert" th:text="#{ui.library.orderError}"></p>
            <p th:if="${libraryWorkoutDeleteBlocked}" class="profile-editor-errors" role="alert" th:text="#{ui.library.workoutInUse}"></p>
        </header>
        <div class="detail-sections workout-composition-sections">
            <section class="detail-section" aria-labelledby="workout-sequence-title">
                <h2 id="workout-sequence-title" class="detail-section-title" th:text="#{ui.02329}"></h2>
                <p th:if="${#lists.isEmpty(items)}" class="detail-empty" th:text="#{ui.02810}"></p>
                <ol class="detail-list workout-item-list">
                    <li th:each="item, position : ${items}" class="detail-list-item workout-sequence-item" th:id="${'workout-item-' + item.id}" tabindex="-1">
                        <div>
                            <p class="workout-sequence-position" th:id="${'workout-position-' + item.id}" th:text="#{ui.library.sequenceStep(${position.count},${position.size})}"></p>
                            <h3 th:id="${'workout-exercise-' + item.id}" class="detail-card-title" dir="auto" th:text="${exercisesById[item.exerciseId] != null ? exercisesById[item.exerciseId].name : #messages.msg('ui.01682')}"></h3>
                            <p class="plan-exercise-prescription">
                                <span th:text="#{ui.plan.setsReps(${item.sets},${item.reps})}"></span>
                                <span th:text="#{ui.plan.rest(${item.restSeconds})}"></span>
                                <span th:if="${item.rpe != null}" th:text="#{ui.library.rpeValue(${item.rpe})}"></span>
                            </p>
                        </div>
                        <div class="connection-actions workout-sequence-actions">
                            <form method="post" th:action="@{/trainer/library/workouts/{wid}/items/{iid}/move(wid=${workout.id},iid=${item.id},q=${query},page=${libraryPage})}">
                                <button type="submit" name="direction" value="UP" class="detail-btn-secondary" th:disabled="${position.first}" th:id="${'move-up-' + item.id}" th:attr="aria-labelledby=${'move-up-' + item.id + ' workout-exercise-' + item.id + ' workout-position-' + item.id}" th:text="#{ui.library.moveEarlier}"></button>
                                <button type="submit" name="direction" value="DOWN" class="detail-btn-secondary" th:disabled="${position.last}" th:id="${'move-down-' + item.id}" th:attr="aria-labelledby=${'move-down-' + item.id + ' workout-exercise-' + item.id + ' workout-position-' + item.id}" th:text="#{ui.library.moveLater}"></button>
                            </form>
                            <form method="post" th:action="@{/trainer/library/workouts/{wid}/items/{iid}/delete(wid=${workout.id},iid=${item.id},q=${query},page=${libraryPage})}">
                                <button type="submit" class="detail-btn-destructive" th:id="${'remove-item-' + item.id}" th:attr="aria-labelledby=${'remove-item-' + item.id + ' workout-exercise-' + item.id + ' workout-position-' + item.id}" th:text="#{ui.00801}"></button>
                            </form>
                        </div>
                    </li>
                </ol>
                <form th:unless="${#lists.isEmpty(exercises)}" th:action="@{/trainer/library/workouts/{id}/items(id=${workout.id},q=${query},page=${libraryPage})}" method="post" th:object="${itemForm}" class="profile-editor-form workout-prescription-form" data-library-draft>
                    <div th:if="${#fields.hasAnyErrors()}" class="profile-editor-errors" role="alert" id="prescription-errors">
                        <h3 th:text="#{auth.form.fixErrors}"></h3>
                        <p th:text="#{ui.library.prescriptionInvalid}"></p>
                        <ul>
                            <li th:if="${#fields.hasErrors('exerciseId')}"><a href="#exerciseId" th:text="#{ui.01682}"></a></li>
                            <li th:if="${#fields.hasErrors('sets')}"><a href="#sets" th:text="#{ui.02330}"></a></li>
                            <li th:if="${#fields.hasErrors('reps')}"><a href="#reps" th:text="#{ui.02339}"></a></li>
                            <li th:if="${#fields.hasErrors('restSeconds')}"><a href="#restSeconds" th:text="#{ui.02813}"></a></li>
                            <li th:if="${#fields.hasErrors('rpe')}"><a href="#rpe" th:text="#{ui.02814}"></a></li>
                        </ul>
                    </div>
                    <fieldset>
                        <legend class="detail-section-title" th:text="#{ui.02811}"></legend>
                        <p id="prescription-help" th:text="#{ui.library.prescriptionHelp}"></p>
                        <div class="profile-editor-fields">
                            <div class="profile-editor-bio">
                                <label for="exerciseId" th:text="#{ui.01682}"></label>
                                <select id="exerciseId" required th:field="*{exerciseId}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('exerciseId')},aria-describedby=${#fields.hasErrors('exerciseId') ? 'prescription-errors prescription-help' : 'prescription-help'}">
                                    <option value="" th:text="#{ui.02812}"></option>
                                    <option th:each="exercise : ${exercises}" th:value="${exercise.id}" dir="auto" th:text="${exercise.name}"></option>
                                </select>
                            </div>
                            <div><label for="sets" th:text="#{ui.02330}"></label><input id="sets" type="text" inputmode="numeric" pattern="[0-9]{1,10}" maxlength="10" required th:field="*{sets}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('sets')},aria-describedby=${#fields.hasErrors('sets') ? 'prescription-errors prescription-help' : 'prescription-help'}"></div>
                            <div><label for="reps" th:text="#{ui.02339}"></label><input id="reps" type="text" inputmode="numeric" pattern="[0-9]{1,10}" maxlength="10" required th:field="*{reps}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('reps')},aria-describedby=${#fields.hasErrors('reps') ? 'prescription-errors prescription-help' : 'prescription-help'}"></div>
                            <div><label for="restSeconds" th:text="#{ui.02813}"></label><input id="restSeconds" type="text" inputmode="numeric" pattern="[0-9]{1,10}" maxlength="10" required th:field="*{restSeconds}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('restSeconds')},aria-describedby=${#fields.hasErrors('restSeconds') ? 'prescription-errors prescription-help' : 'prescription-help'}"></div>
                            <div><label for="rpe" th:text="#{ui.02814}"></label><input id="rpe" type="text" inputmode="numeric" pattern="(?:[1-9]|10)" maxlength="10" th:field="*{rpe}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('rpe')},aria-describedby=${#fields.hasErrors('rpe') ? 'prescription-errors prescription-help' : 'prescription-help'}"></div>
                        </div>
                    </fieldset>
                    <button class="detail-btn-primary" type="submit" th:text="#{ui.02591}"></button>
                </form>
                <div th:if="${#lists.isEmpty(exercises)}" class="connection-empty">
                    <p th:text="#{ui.02692}"></p><a class="detail-btn-secondary" th:href="@{/trainer/library/exercises/create}" th:text="#{ui.02655}"></a>
                </div>
            </section>
            <section class="detail-section" aria-labelledby="workout-notes-title">
                <h2 id="workout-notes-title" class="detail-section-title" th:text="#{ui.00239}"></h2>
                <p th:if="${#lists.isEmpty(notes)}" class="detail-empty" th:text="#{ui.00240}"></p>
                <ul class="detail-list"><li th:each="note : ${notes}" class="detail-list-item plan-coaching-note" dir="auto" th:text="${note.noteText}"></li></ul>
            </section>
        </div>
        <details class="detail-section workout-client-preview">
            <summary th:text="#{ui.library.clientPreview}"></summary>
            <p class="detail-subtitle" th:text="#{ui.library.clientPreviewHelp}"></p>
            <h2 class="detail-card-title" dir="auto" th:text="${workout.title}"></h2>
            <p class="plan-coaching-note" dir="auto" th:text="${workout.summary}"></p>
            <p th:if="${#lists.isEmpty(items)}" class="detail-empty" th:text="#{ui.02810}"></p>
            <ol class="detail-list workout-preview-list">
                <li th:each="item : ${items}" class="detail-list-item">
                    <h3 class="detail-card-title" dir="auto" th:text="${exercisesById[item.exerciseId] != null ? exercisesById[item.exerciseId].name : #messages.msg('ui.01682')}"></h3>
                    <p class="plan-exercise-prescription"><span th:text="#{ui.plan.setsReps(${item.sets},${item.reps})}"></span><span th:text="#{ui.plan.rest(${item.restSeconds})}"></span><span th:if="${item.rpe != null}" th:text="#{ui.library.rpeValue(${item.rpe})}"></span></p>
                </li>
            </ol>
            <h3 class="detail-card-title" th:text="#{ui.00239}"></h3>
            <p th:if="${#lists.isEmpty(notes)}" class="detail-empty" th:text="#{ui.00240}"></p>
            <ul class="detail-list"><li th:each="note : ${notes}" class="detail-list-item plan-coaching-note" dir="auto" th:text="${note.noteText}"></li></ul>
        </details>
        <th:block th:replace="~{trainer-views/trainer/fragments/library-share-dialog :: libraryShareDialog('shareDialog', ${workout.title})}"></th:block>
        <section class="detail-section library-resource-actions" aria-labelledby="resource-actions-title">
            <h2 id="resource-actions-title" class="detail-section-title" th:text="#{ui.library.resourceActions}"></h2>
            <p id="workout-delete-help" class="detail-subtitle" th:text="#{ui.library.deleteWorkoutEffect}"></p>
            <form method="post" th:attr="data-confirm=${#messages.msg('ui.02815') + ': ' + workout.title + '. ' + #messages.msg('ui.library.deleteWorkoutEffect')}" th:action="@{/trainer/library/workouts/{id}/delete(id=${workout.id},q=${query},page=${libraryPage})}">
                <button type="submit" aria-describedby="workout-delete-help" class="detail-btn-destructive" th:text="#{ui.02815}"></button>
            </form>
        </section>
    </div>
    <th:block th:fragment="pageScripts">
        <script th:src="@{/js/trainer/trainer-library-share-dialog.js(v=${assetVersion})}" defer></script>
        <script th:src="@{/js/trainer/trainer-library-editor.js(v=${assetVersion})}" defer></script>
    </th:block>
</th:block>
