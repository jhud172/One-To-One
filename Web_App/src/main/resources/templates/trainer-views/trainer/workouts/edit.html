<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.02799}, null, ~{::content}, ~{::pageScripts})}">
<div th:fragment="content" class="client-workspace-v2 library-exercise-v2 workout-library-v2">
    <header class="detail-header"><div class="detail-header-content"><div><h1 class="detail-title" th:text="#{ui.02799}"></h1><p class="detail-subtitle" th:text="#{ui.library.workoutEditHint}"></p></div><a class="detail-btn-secondary" th:href="@{/trainer/library/workouts/{id}(id=${workoutId},q=${query},page=${libraryPage})}" th:text="#{ui.02807}"></a></div></header>
    <form th:fragment="workoutForm" th:object="${form}" th:action="${workoutId == null} ? @{/trainer/library/workouts/create(q=${query},page=${libraryPage})} : @{/trainer/library/workouts/{id}/edit(id=${workoutId},q=${query},page=${libraryPage})}" method="post" class="profile-editor-form library-workout-form">
        <input th:if="${workoutId != null}" type="hidden" th:field="*{expectedRevision}">
        <div th:if="${#fields.hasAnyErrors() and workoutConflict != true}" class="profile-editor-errors" id="workout-errors" role="alert"><h2 th:text="#{auth.form.fixErrors}"></h2><p th:text="#{ui.library.metadataInvalid}"></p><ul>
            <li th:if="${#fields.hasErrors('title')}"><a href="#title" th:text="#{ui.02787}"></a></li>
            <li th:if="${#fields.hasErrors('summary')}"><a href="#summary" th:text="#{ui.02189}"></a></li>
            <li th:if="${#fields.hasErrors('notesText')}"><a href="#notesText" th:text="#{ui.02687}"></a></li>
        </ul></div>
        <section th:if="${workoutConflict}" class="detail-section library-workout-conflict" role="alert" aria-labelledby="workout-conflict-title">
            <h2 id="workout-conflict-title" class="detail-section-title" th:text="#{ui.library.workoutChanged}"></h2>
            <p th:text="#{ui.library.workoutConflictHelp}"></p>
            <h3 dir="auto" th:text="${latestWorkout.title}"></h3>
            <p class="library-preview-text" dir="auto" th:text="${latestWorkout.summary}"></p>
            <ul class="detail-list"><li th:each="note : ${latestWorkoutNotes}" class="plan-coaching-note" dir="auto" th:text="${note.noteText}"></li></ul>
        </section>
        <div class="library-exercise-editor-layout"><div class="library-exercise-fields">
            <fieldset class="detail-section"><legend class="detail-section-title" th:text="#{ui.02657}"></legend><div class="profile-editor-fields">
                <div class="profile-editor-bio"><label for="title"><span th:text="#{ui.02787}"></span> <span aria-hidden="true">*</span></label><input id="title" dir="auto" type="text" th:field="*{title}" required maxlength="120" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('title')},aria-describedby=${#fields.hasErrors('title') ? 'workout-errors' : null}" th:placeholder="#{ui.02788}"></div>
                <div class="profile-editor-bio"><label for="summary" th:text="#{ui.02189}"></label><textarea id="summary" dir="auto" th:field="*{summary}" rows="5" maxlength="10000" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('summary')},aria-describedby=${#fields.hasErrors('summary') ? 'summary-help workout-errors' : 'summary-help'}" th:placeholder="#{ui.02789}"></textarea><p id="summary-help" th:text="#{ui.02790}"></p></div>
            </div></fieldset>
            <fieldset class="detail-section"><legend class="detail-section-title" th:text="#{ui.02675}"></legend><label for="notesText" th:text="#{ui.02687}"></label><textarea id="notesText" dir="auto" th:field="*{notesText}" rows="6" maxlength="10000" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('notesText')},aria-describedby=${#fields.hasErrors('notesText') ? 'notes-help workout-errors' : 'notes-help'}" th:placeholder="#{ui.02791}"></textarea><p id="notes-help" th:text="#{ui.library.workoutInstructionSharing}"></p></fieldset>
        </div><section class="detail-section library-exercise-preview" aria-labelledby="workout-preview-title">
            <h2 id="workout-preview-title" class="detail-section-title" th:text="#{ui.library.previewTitle}"></h2><p class="detail-subtitle" th:text="#{ui.library.workoutPreviewHint}"></p>
            <h3 data-library-preview="title" dir="auto" th:text="${form.title}"></h3>
            <h3 id="workout-preview-summary" th:text="#{ui.02189}"></h3><p class="library-preview-text" role="region" aria-labelledby="workout-preview-summary" th:tabindex="${#strings.isEmpty(form.summary) ? -1 : 0}" data-library-preview="summary" dir="auto" th:text="${form.summary}"></p>
            <h3 id="workout-preview-notes" th:text="#{ui.00239}"></h3><p class="library-preview-text" role="region" aria-labelledby="workout-preview-notes" th:tabindex="${#strings.isEmpty(form.notesText) ? -1 : 0}" data-library-preview="notesText" dir="auto" th:text="${form.notesText}"></p>
        </section></div>
        <div class="connection-actions"><button type="submit" class="detail-btn-primary" th:text="${workoutId == null} ? #{ui.02793} : (${workoutConflict} ? #{ui.library.saveReviewedDraft} : #{ui.00686})"></button><a class="detail-btn-secondary" th:href="${workoutId == null} ? @{/trainer/library/workouts(q=${query},page=${libraryPage})} : @{/trainer/library/workouts/{id}(id=${workoutId},q=${query},page=${libraryPage})}" th:text="#{ui.00125}"></a></div>
    </form>
</div><th:block th:fragment="pageScripts"><script th:src="@{/js/trainer/trainer-library-editor.js(v=${assetVersion})}" defer></script></th:block></th:block>
