<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.02724}, null, ~{::content}, ~{::pageScripts})}">
<div th:fragment="content" class="client-workspace-v2 trainer-portfolio-v2 trainer-profile-editor-v2">
    <header class="detail-header">
        <div class="detail-header-content">
            <div><h1 class="detail-title" th:text="#{ui.02707}">Edit trainer profile</h1><p class="detail-subtitle" th:text="#{ui.02708}"></p></div>
            <a th:if="${user.trainerVerified}" class="detail-btn-secondary" th:href="@{/trainers/{id}/profile(id=${user.id})}" th:text="#{ui.00567}">View profile</a>
            <a th:unless="${user.trainerVerified}" class="detail-btn-secondary" th:href="@{/trainer/verification}" th:text="#{ui.proReview.title}">Professional verification</a>
        </div>
        <p class="plan-notice" th:text="#{ui.profile.editorPublicHint}"></p>
        <p th:if="${profileSaved}" class="checkin-feedback" role="status" th:text="#{preferences.saved}"></p>
    </header>
    <section th:if="${formattedTrainerCode != null}" class="detail-section portfolio-private-code" aria-labelledby="private-code-title">
        <h2 id="private-code-title" class="detail-section-title" th:text="#{ui.01231}">Your trainer code</h2>
        <div class="connection-actions">
            <span id="trainerCodeVal" class="portfolio-code" th:text="${formattedTrainerCode}"></span>
            <button id="copyTrainerCode" type="button" class="detail-btn-secondary" th:attr="data-copied=#{ui.profile.copyDone},data-copy-failed=#{ui.profile.copyFailed}" th:text="#{ui.01076}">Copy</button>
        </div>
        <p th:text="#{ui.02709}"></p><p id="trainerCodeCopyStatus" role="status" aria-live="polite"></p>
    </section>
    <form th:action="@{/trainer/profile/save}" method="post" th:object="${profile}" class="profile-editor-form">
        <div th:if="${profileInvalid}" id="profile-errors" class="profile-editor-errors" role="alert">
            <h2 th:text="#{auth.form.fixErrors}"></h2><p th:text="#{ui.profile.editorInvalid}"></p>
        </div>
        <fieldset class="detail-section">
            <legend class="detail-section-title" th:text="#{ui.02657}">Basic information</legend>
            <div class="profile-editor-fields">
                <div><label for="location" th:text="#{ui.02710}"></label><input id="location" type="text" maxlength="120" th:field="*{location}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('location')},aria-describedby=${#fields.hasErrors('location') ? 'profile-errors' : null}" th:placeholder="#{ui.02711}"></div>
                <div><label for="primaryGym" th:text="#{ui.02712}"></label><input id="primaryGym" type="text" maxlength="200" th:field="*{primaryGym}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('primaryGym')},aria-describedby=${#fields.hasErrors('primaryGym') ? 'profile-errors' : null}" th:placeholder="#{ui.02713}"></div>
                <div><label for="specializations" th:text="#{ui.02428}"></label><input id="specializations" type="text" maxlength="200" th:field="*{specializations}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('specializations')},aria-describedby=${#fields.hasErrors('specializations') ? 'profile-errors' : null}" th:placeholder="#{ui.02717}"></div>
                <div><label for="pricePerSession" th:text="#{ui.02714}"></label><input id="pricePerSession" type="text" inputmode="numeric" pattern="[0-9]{1,10}" maxlength="10" th:field="*{pricePerSession}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('pricePerSession')},aria-describedby=${#fields.hasErrors('pricePerSession') ? 'price-help profile-errors' : 'price-help'}"><p id="price-help"><span aria-hidden="true">£ · </span><span th:text="#{ui.02715}"></span></p></div>
                <div class="profile-editor-bio"><label for="bio" th:text="#{ui.02425}"></label><textarea id="bio" rows="5" maxlength="500" th:field="*{bio}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('bio')}" aria-describedby="bio-help" th:placeholder="#{ui.02426}"></textarea><p id="bio-help" th:text="#{ui.02716}"></p></div>
            </div>
        </fieldset>
        <fieldset class="detail-section">
            <legend class="detail-section-title" th:text="#{ui.02719}">Social media links</legend>
            <p th:text="#{ui.02720}"></p>
            <div class="profile-editor-socials">
                <div class="profile-editor-social"><div><label for="instagramUrl" th:text="#{ui.01243}"></label><input id="instagramUrl" type="url" maxlength="500" th:field="*{instagramUrl}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('instagramUrl')},aria-describedby=${#fields.hasErrors('instagramUrl') ? 'profile-errors' : null}" th:placeholder="#{ui.02721}"></div><label class="profile-editor-visibility"><input type="checkbox" th:field="*{showInstagram}"><span><span th:text="#{ui.02722}">Show</span> <span th:text="#{ui.01243}"></span></span></label></div>
                <div class="profile-editor-social"><div><label for="tiktokUrl" th:text="#{ui.01245}"></label><input id="tiktokUrl" type="url" maxlength="500" th:field="*{tiktokUrl}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('tiktokUrl')},aria-describedby=${#fields.hasErrors('tiktokUrl') ? 'profile-errors' : null}" th:placeholder="#{ui.02723}"></div><label class="profile-editor-visibility"><input type="checkbox" th:field="*{showTikTok}"><span><span th:text="#{ui.02722}">Show</span> <span th:text="#{ui.01245}"></span></span></label></div>
                <div class="profile-editor-social"><div><label for="youtubeUrl" th:text="#{ui.01247}"></label><input id="youtubeUrl" type="url" maxlength="500" th:field="*{youtubeUrl}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('youtubeUrl')},aria-describedby=${#fields.hasErrors('youtubeUrl') ? 'profile-errors' : null}" th:placeholder="#{ui.01248}"></div><label class="profile-editor-visibility"><input type="checkbox" th:field="*{showYouTube}"><span><span th:text="#{ui.02722}">Show</span> <span th:text="#{ui.01247}"></span></span></label></div>
                <div class="profile-editor-social"><div><label for="linkedInUrl" th:text="#{ui.01249}"></label><input id="linkedInUrl" type="url" maxlength="500" th:field="*{linkedInUrl}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('linkedInUrl')},aria-describedby=${#fields.hasErrors('linkedInUrl') ? 'profile-errors' : null}" th:placeholder="#{ui.01250}"></div><label class="profile-editor-visibility"><input type="checkbox" th:field="*{showLinkedIn}"><span><span th:text="#{ui.02722}">Show</span> <span th:text="#{ui.01249}"></span></span></label></div>
                <div class="profile-editor-social"><div><label for="websiteUrl" th:text="#{ui.01251}"></label><input id="websiteUrl" type="url" maxlength="500" th:field="*{websiteUrl}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('websiteUrl')},aria-describedby=${#fields.hasErrors('websiteUrl') ? 'profile-errors' : null}" th:placeholder="#{ui.01252}"></div><label class="profile-editor-visibility"><input type="checkbox" th:field="*{showWebsite}"><span><span th:text="#{ui.02722}">Show</span> <span th:text="#{ui.01251}"></span></span></label></div>
            </div>
        </fieldset>
        <div class="connection-actions"><button type="submit" class="detail-btn-primary" th:text="#{ui.00686}">Save changes</button><a class="detail-btn-secondary" th:href="@{/trainer/dashboard}" th:text="#{ui.00125}">Cancel</a></div>
    </form>
</div>
<th:block th:fragment="pageScripts"><script th:src="@{/js/trainer/trainer-profile-view-page.js(v=${assetVersion})}"></script></th:block>
</th:block>
