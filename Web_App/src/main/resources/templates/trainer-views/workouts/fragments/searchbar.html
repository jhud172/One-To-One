<div xmlns:th="http://www.thymeleaf.org" th:fragment="searchbar(searchbarId)" class="schedule-search"
     th:with="target=${searchbarId == 'exercise-search-input' ? 'suggested-list' : (searchbarId == 'custom-exercise-search' ? 'custom-exercise-list' : 'existing-workouts')}">
    <label th:for="${searchbarId}" th:text="${searchbarId == 'exercise-search-input' ? #messages.msg('ui.02884') : (searchbarId == 'custom-exercise-search' ? #messages.msg('ui.02580') : #messages.msg('ui.studio.search'))}">Search</label>
    <div class="schedule-search__control">
        <input type="search" th:id="${searchbarId}" th:name="${searchbarId}" maxlength="200" autocomplete="off" form="workout-draft-form"
               th:value="${searchValues != null ? searchValues.get(searchbarId) : ''}"
               data-schedule-search th:attr="aria-controls=${target},aria-describedby=${searchbarId + '-status'},data-search-target=${target}">
        <button type="button" data-search-clear hidden th:attr="aria-label=#{ui.02273}" th:text="#{ui.02273}">Clear all</button>
    </div>
    <p th:id="${searchbarId + '-status'}" class="schedule-search__status" data-search-status role="status" aria-live="polite"></p>
</div>
