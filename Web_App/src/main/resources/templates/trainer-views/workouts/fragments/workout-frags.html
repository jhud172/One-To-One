<th:block xmlns:th="http://www.thymeleaf.org">
    <div th:fragment="createWorkout" th:replace="~{trainer-views/workouts/fragments/workout-frags :: editor(${workoutDraft})}"></div>
    <div th:fragment="editWorkout(workout)" th:replace="~{trainer-views/workouts/fragments/workout-frags :: editor(${workoutDraft})}"></div>
    <form th:fragment="editor(draft)" id="workout-draft-form" method="post" th:action="@{/save-workout}" data-schedule-draft>
        <button type="submit" name="editAction" value="save" class="sr-only" tabindex="-1" aria-hidden="true" th:text="#{ui.02873}">Save workout</button>
        <input type="hidden" id="workout-id" name="id" th:value="${draft.id}">
        <input th:each="id : ${draft.exerciseIds}" type="hidden" name="exerciseIds" th:value="${id}" data-selected-type="e">
        <input th:each="id : ${draft.customExerciseIds}" type="hidden" name="customExerciseIds" th:value="${id}" data-selected-type="c">
        <label for="workout-name" th:text="#{ui.02870}">Workout name</label>
        <input type="text" id="workout-name" name="name" required maxlength="200" th:value="${draft.name}" autocomplete="off">
        <label for="workout-notes" th:text="#{ui.00175}">Notes</label>
        <textarea id="workout-notes" name="workoutNotes" rows="3" maxlength="5000" th:text="${draft.workoutNotes}"></textarea>
        <div class="schedule-workshop__section-heading"><h2 th:text="#{ui.02867}">Workout list</h2><span data-selected-count th:text="#{ui.studio.count(${#lists.size(draft.exerciseIds) + #lists.size(draft.customExerciseIds)})}">Exercises</span></div>
        <p class="schedule-workshop__hint" th:text="#{ui.scheduleWorkout.grouping}">Catalogue and custom exercises are saved in separate groups.</p>
        <p id="no-exercises-msg" class="schedule-workshop__empty" th:attr="hidden=${!#lists.isEmpty(draft.exerciseIds) or !#lists.isEmpty(draft.customExerciseIds)} ? 'hidden' : null" th:text="#{ui.scheduleWorkout.empty}">Add an exercise from the library.</p>
        <ul id="workout-list" class="schedule-workshop__selected">
            <th:block th:each="exercise : ${selectedExercises}"><li th:replace="~{trainer-views/workouts/fragments/workout-frags :: movement(${exercise}, 'e')}"></li></th:block>
            <th:block th:each="exercise : ${selectedCustomExercises}"><li th:replace="~{trainer-views/workouts/fragments/workout-frags :: movement(${exercise}, 'c')}"></li></th:block>
        </ul>
        <div class="schedule-workshop__save"><button id="save-workout-btn" type="submit" name="editAction" value="save" class="training-launch__action training-launch__action--primary" th:text="#{ui.02873}">Save workout</button><a href="/schedules/builder" class="training-launch__action" id="schedule-button" th:text="#{ui.02572}">Continue to schedule</a></div>
    </form>
    <li th:fragment="movement(exercise, type)" class="schedule-movement" th:attr="data-id=${exercise.id},data-type=${type},data-name=${exercise.name},data-color=${type == 'c' ? exercise.colorTag : ''}">
        <div class="schedule-movement__heading"><h3 th:text="${exercise.name}">Exercise</h3><button type="submit" form="workout-draft-form" name="editAction" th:value="${'remove:' + type + ':' + exercise.id}" formnovalidate class="training-launch__action" th:attr="aria-label=#{ui.studio.removeFor(${exercise.name})}" th:text="#{ui.00801}">Remove</button></div>
        <p class="schedule-movement__type" th:text="${type == 'c' ? #messages.msg('ui.01730') : #messages.msg('ui.01682')}">Exercise</p>
        <details><summary th:text="#{ui.02871}">Selected exercise</summary><p th:text="${exercise.description}">Description</p>
            <p th:if="${type == 'c'}" th:text="${exercise.howTo}"></p>
            <a th:if="${type == 'c' and exercise.embedUrl != null and !#strings.isEmpty(exercise.embedUrl)}" th:href="${exercise.embedUrl}" target="_blank" rel="noopener noreferrer" th:text="#{ui.02582}">Video URL (YouTube/Vimeo)</a>
        </details>
    </li>
</th:block>
