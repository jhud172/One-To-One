<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.00676}, null, ~{::content}, null)}">
<div th:fragment="content" class="client-workspace-v2 personal-records-v2 health-records-v2">
    <header class="detail-header"><div class="detail-header-content"><div><p class="detail-label" th:text="#{ui.00656}"></p><h1 class="detail-title" th:text="#{ui.00666}"></h1><p class="detail-subtitle"><time dir="ltr" th:datetime="${record.baselineDate}" th:text="${record.baselineDate != null ? #temporals.format(record.baselineDate,'dd MMM yyyy HH:mm') : '—'}"></time></p></div><div class="connection-actions"><a class="detail-btn-secondary" th:href="@{/health-record/list}" th:text="#{ui.00668}"></a><a class="detail-btn-primary" th:href="@{/health-record}" th:text="#{ui.00631}"></a></div></div></header>
    <th:block th:replace="~{client-views/health-record/fragments/health-scope :: healthScope}"></th:block>
    <div class="personal-record-layout">
        <section class="detail-section"><h2 class="detail-section-title" th:text="#{ui.health.measurementsTitle}"></h2><dl class="library-exercise-facts"><div><dt th:text="#{ui.00661}"></dt><dd><bdi dir="ltr"><span th:text="${record.systolicBloodPressure ?: '—'}"></span> / <span th:text="${record.diastolicBloodPressure ?: '—'}"></span> <span th:text="#{ui.00635}"></span></bdi></dd></div><div><dt th:text="#{ui.00639}"></dt><dd><bdi dir="ltr"><span th:text="${record.cholesterol ?: '—'}"></span> <span th:text="#{ui.00640}"></span></bdi></dd></div><div><dt th:text="#{ui.00642}"></dt><dd><bdi dir="ltr"><span th:text="${record.weightKg ?: '—'}"></span> <span th:text="#{ui.00643}"></span></bdi></dd></div><div><dt th:text="#{ui.00645}"></dt><dd><bdi dir="ltr"><span th:text="${record.heightCm ?: '—'}"></span> <span th:text="#{ui.00646}"></span></bdi></dd></div><div><dt th:text="#{ui.00648}"></dt><dd><bdi dir="ltr"><span th:text="${record.waistCm ?: '—'}"></span> <span th:text="#{ui.00646}"></span></bdi></dd></div></dl></section>
        <section class="detail-section"><h2 class="detail-section-title" th:text="#{ui.health.calculatedTitle}"></h2><p class="health-record-help" th:text="#{ui.health.calculatedHint}"></p><dl class="library-exercise-facts"><div><dt th:text="#{ui.00673}"></dt><dd dir="ltr" th:text="${record.bmi ?: '—'}"></dd></div><div><dt th:text="#{ui.00674}"></dt><dd dir="ltr" th:text="${record.waistHeightRatio ?: '—'}"></dd></div></dl><h3 class="detail-section-title" th:text="#{ui.00650}"></h3><p dir="auto" th:text="${record.activityLevel == null or #strings.isEmpty(record.activityLevel) ? '—' : (healthActivityLabels[record.activityLevel] != null ? #messages.msg(healthActivityLabels[record.activityLevel]) : record.activityLevel)}"></p></section>
    </div>
    <section class="detail-section health-record-conditions"><h2 class="detail-section-title" th:text="#{ui.00335}"></h2><p th:if="${#lists.isEmpty(record.physicalConditions)}" th:text="#{ui.00675}"></p><ul th:unless="${#lists.isEmpty(record.physicalConditions)}" class="health-record-condition-list"><li th:each="condition : ${record.physicalConditions}" dir="auto" th:text="${condition.name}"></li></ul></section>
</div></th:block>
