<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.00631}, null, ~{::content}, null)}">
<div th:fragment="content" class="client-workspace-v2 personal-records-v2 health-records-v2">
    <header class="detail-header"><div class="detail-header-content"><div><h1 class="detail-title" th:text="#{ui.00631}"></h1><p class="detail-subtitle" th:text="#{ui.00632}"></p></div><a class="detail-btn-secondary" th:href="@{/health-record/list}" th:text="#{ui.01969}"></a></div></header>
    <th:block th:replace="~{client-views/health-record/fragments/health-scope :: healthScope}"></th:block>
    <form class="detail-section profile-editor-form" th:object="${healthRecordForm}" th:action="@{/health-record}" method="post" data-health-record-form>
        <div th:if="${#fields.hasAnyErrors()}" id="health-errors" class="profile-editor-errors" role="alert"><h2 th:text="#{auth.form.fixErrors}"></h2><p th:text="#{ui.health.invalid}"></p><ul><li th:if="${#fields.hasErrors('baselineDate')}"><a href="#baselineDate" th:text="#{ui.00633}"></a></li><li th:if="${#fields.hasErrors('systolicBloodPressure')}"><a href="#systolicBloodPressure" th:text="#{ui.00634}"></a></li><li th:if="${#fields.hasErrors('diastolicBloodPressure')}"><a href="#diastolicBloodPressure" th:text="#{ui.00637}"></a></li><li th:if="${#fields.hasErrors('cholesterol')}"><a href="#cholesterol" th:text="#{ui.00639}"></a></li><li th:if="${#fields.hasErrors('weightKg')}"><a href="#weightKg" th:text="#{ui.00642}"></a></li><li th:if="${#fields.hasErrors('heightCm')}"><a href="#heightCm" th:text="#{ui.00645}"></a></li><li th:if="${#fields.hasErrors('waistCm')}"><a href="#waistCm" th:text="#{ui.00648}"></a></li><li th:if="${#fields.hasErrors('activityLevel')}"><a href="#activityLevel" th:text="#{ui.00650}"></a></li><li th:if="${#fields.hasErrors('physicalConditions')}"><a href="#physicalConditions" th:text="#{ui.00335}"></a></li></ul></div>
        <p id="health-required-help" class="health-record-help" th:text="#{ui.health.requiredHint}"></p>
        <label for="baselineDate" th:text="#{ui.00633}"></label><input id="baselineDate" type="datetime-local" required th:field="*{baselineDate}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('baselineDate')},aria-describedby=${#fields.hasErrors('baselineDate') ? 'health-date-error' + (healthDateMalformed ? ' health-date-draft' : '') : 'health-required-help'}"><p th:if="${#fields.hasErrors('baselineDate')}" id="health-date-error" th:errors="*{baselineDate}"></p><p th:if="${healthDateMalformed}" id="health-date-draft" class="personal-history-rejected" dir="ltr" th:text="${healthDateDraft}"></p>
        <fieldset><legend class="detail-section-title" th:text="#{ui.00632}"></legend><p id="health-number-help" class="health-record-help" th:text="#{ui.health.numberHint}"></p><div class="profile-editor-fields"><div><label for="systolicBloodPressure"><span th:text="#{ui.00634}"></span> (<span th:text="#{ui.00635}"></span>)</label><input id="systolicBloodPressure" type="text" required th:field="*{systolicBloodPressure}" inputmode="numeric" pattern="[0-9]{1,3}" maxlength="8" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('systolicBloodPressure')},aria-describedby=${#fields.hasErrors('systolicBloodPressure') ? 'health-number-help health-systolicBloodPressure-error' : 'health-number-help'}"><p th:if="${#fields.hasErrors('systolicBloodPressure')}" id="health-systolicBloodPressure-error" th:errors="*{systolicBloodPressure}"></p></div>
<div><label for="diastolicBloodPressure"><span th:text="#{ui.00637}"></span> (<span th:text="#{ui.00635}"></span>)</label><input id="diastolicBloodPressure" type="text" required th:field="*{diastolicBloodPressure}" inputmode="numeric" pattern="[0-9]{1,3}" maxlength="8" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('diastolicBloodPressure')},aria-describedby=${#fields.hasErrors('diastolicBloodPressure') ? 'health-number-help health-diastolicBloodPressure-error' : 'health-number-help'}"><p th:if="${#fields.hasErrors('diastolicBloodPressure')}" id="health-diastolicBloodPressure-error" th:errors="*{diastolicBloodPressure}"></p></div>
<div><label for="cholesterol"><span th:text="#{ui.00639}"></span> (<span th:text="#{ui.00640}"></span>)</label><input id="cholesterol" type="text" required th:field="*{cholesterol}" inputmode="decimal" pattern="[0-9]+([.][0-9]{1,2})?" maxlength="8" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('cholesterol')},aria-describedby=${#fields.hasErrors('cholesterol') ? 'health-number-help health-cholesterol-error' : 'health-number-help'}"><p th:if="${#fields.hasErrors('cholesterol')}" id="health-cholesterol-error" th:errors="*{cholesterol}"></p></div>
<div><label for="weightKg"><span th:text="#{ui.00642}"></span> (<span th:text="#{ui.00643}"></span>)</label><input id="weightKg" type="text" required th:field="*{weightKg}" inputmode="decimal" pattern="[0-9]+([.][0-9]{1,2})?" maxlength="8" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('weightKg')},aria-describedby=${#fields.hasErrors('weightKg') ? 'health-number-help health-weightKg-error' : 'health-number-help'}"><p th:if="${#fields.hasErrors('weightKg')}" id="health-weightKg-error" th:errors="*{weightKg}"></p></div>
<div><label for="heightCm"><span th:text="#{ui.00645}"></span> (<span th:text="#{ui.00646}"></span>)</label><input id="heightCm" type="text" required th:field="*{heightCm}" inputmode="decimal" pattern="[0-9]+([.][0-9]{1,2})?" maxlength="8" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('heightCm')},aria-describedby=${#fields.hasErrors('heightCm') ? 'health-number-help health-heightCm-error' : 'health-number-help'}"><p th:if="${#fields.hasErrors('heightCm')}" id="health-heightCm-error" th:errors="*{heightCm}"></p></div>
<div><label for="waistCm"><span th:text="#{ui.00648}"></span> (<span th:text="#{ui.00646}"></span>)</label><input id="waistCm" type="text" required th:field="*{waistCm}" inputmode="decimal" pattern="[0-9]+([.][0-9]{1,2})?" maxlength="8" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('waistCm')},aria-describedby=${#fields.hasErrors('waistCm') ? 'health-number-help health-waistCm-error' : 'health-number-help'}"><p th:if="${#fields.hasErrors('waistCm')}" id="health-waistCm-error" th:errors="*{waistCm}"></p></div></div></fieldset>
        <label for="activityLevel" th:text="#{ui.00650}"></label><select id="activityLevel" required th:field="*{activityLevel}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('activityLevel')},aria-describedby=${#fields.hasErrors('activityLevel') ? 'health-activity-error' : 'health-required-help'}"><option value="" th:text="#{ui.health.chooseActivity}"></option><option th:if="${healthRecordForm.activityLevel != null and !#strings.isEmpty(healthRecordForm.activityLevel) and !healthActivityLabels.containsKey(healthRecordForm.activityLevel)}" th:value="${healthRecordForm.activityLevel}" th:text="${healthRecordForm.activityLevel}" disabled></option><option value="Sedentary" th:text="#{ui.00651}"></option><option value="Lightly Active" th:text="#{ui.00652}"></option><option value="Moderately Active" th:text="#{ui.00653}"></option><option value="Very Active" th:text="#{ui.00654}"></option></select><p th:if="${#fields.hasErrors('activityLevel')}" id="health-activity-error" th:errors="*{activityLevel}"></p>
        <fieldset id="physicalConditions" tabindex="-1" th:attr="aria-describedby=${#fields.hasErrors('physicalConditions') ? 'health-conditions-help health-conditions-error' : 'health-conditions-help'},aria-invalid=${#fields.hasErrors('physicalConditions')}"><legend class="detail-section-title" th:text="#{ui.00335}"></legend><p id="health-conditions-help" class="health-record-help" th:text="#{ui.health.conditionsHint}"></p><p th:if="${#fields.hasErrors('physicalConditions')}" id="health-conditions-error" th:errors="*{physicalConditions}"></p><div class="health-condition-choices"><label class="profile-editor-visibility" th:each="condition : ${allPhysicalConditions}"><input type="checkbox" th:field="*{physicalConditions}" th:value="${condition.id}"><span dir="auto" th:text="${condition.name}"></span></label></div></fieldset>
        <div class="connection-actions"><button class="detail-btn-primary" type="submit" th:text="#{ui.00109}"></button><a class="detail-btn-secondary" th:href="@{/health-record/list}" th:text="#{ui.00125}"></a></div>
    </form>
</div></th:block>
