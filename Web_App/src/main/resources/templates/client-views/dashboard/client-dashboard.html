<th:block xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
          th:replace="~{base :: layout(#{ui.00425}, null, ~{::content}, ~{::pageScripts})}">

    <div th:fragment="content">
        <section sec:authorize="isAuthenticated()"
                 class="cd-dashboard-page app-dashboard app-dashboard--client mx-auto w-full max-w-7xl px-4 pb-6 pt-0 sm:px-6 lg:px-8 2xl:max-w-full 2xl:px-8"
                 data-dashboard-role="CLIENT"
                 th:attrappend="data-dashboard-immersive=${dashboardAmbience != null and dashboardAmbience.enabled ? 'true' : 'false'},
                                data-dashboard-weather=${dashboardAmbience != null ? dashboardAmbience.weather : 'auto'},
                                data-dashboard-temperature-unit=${dashboardAmbience != null ? dashboardAmbience.temperatureUnit : 'CELSIUS'},
                                data-dashboard-weather-display-mode=${dashboardAmbience != null ? dashboardAmbience.displayMode : 'VISUAL'},
                                data-dashboard-time-display-format=${dashboardTimeDisplayFormat != null ? dashboardTimeDisplayFormat : 'TWELVE_HOUR'}">

            <div class="cd-dashboard-drawer-backdrop" data-dashboard-drawer-backdrop aria-hidden="true" hidden></div>

            <div class="cd-dashboard-mobile-dock" role="navigation" aria-label="Dashboard quick panels" th:attr="aria-label=#{ui.00394}">
                <div class="cd-dashboard-flyout cd-dashboard-flyout--dock" data-dashboard-flyout="explore">
                    <a th:href="@{/explore}"
                            class="cd-dashboard-flyout__handle"
                            data-dashboard-flyout-handle
                            aria-controls="dashboardDrawerExplore"
                            aria-expanded="false"
                            aria-label="Explore" th:attr="aria-label=#{ui.00396},data-panel-label=#{ui.00395}">
                        <span class="cd-dashboard-flyout__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <circle cx="12" cy="12" r="8"></circle>
                                <path d="M12 4v16M4 12h16"></path>
                            </svg>
                        </span>
                        <span class="cd-dashboard-flyout__label" th:text="#{ui.00396}">Explore</span>
                    </a>
                    <aside id="dashboardDrawerExplore" class="cd-dashboard-flyout__panel" aria-label="Explore platform" aria-hidden="true" inert th:attr="aria-label=#{ui.00397}">
                        <div class="cd-dashboard-flyout__panel-inner" tabindex="-1">
                            <div class="cd-dashboard-flyout__header">
                                <div>
                                    <p class="cd-kicker" th:text="#{ui.00398}">Explore Platform</p>
                                    <p class="cd-dashboard-flyout__title" th:text="#{ui.00399}">Platform shortcuts</p>
                                </div>
                                <button type="button" class="cd-dashboard-flyout__close" data-dashboard-flyout-close aria-label="Close explore platform panel" th:attr="aria-label=#{ui.00400}">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                        <path d="M8 8l8 8M16 8l-8 8"></path>
                                    </svg>
                                </button>
                            </div>
                            <div class="cd-dashboard-flyout__body">
                                <th:block th:replace="~{client-views/dashboard/fragments/client-dashboard-shell :: leftRailExplore}"></th:block>
                            </div>
                        </div>
                    </aside>
                </div>

                <div class="cd-dashboard-flyout cd-dashboard-flyout--dock" data-dashboard-flyout="trainer">
                    <a th:href="@{/client/trainers}"
                            class="cd-dashboard-flyout__handle"
                            data-dashboard-flyout-handle
                            aria-controls="dashboardDrawerTrainer"
                            aria-expanded="false"
                            aria-label="Coach" th:attr="aria-label=#{ui.00402},data-panel-label=#{ui.00401}">
                        <span class="cd-dashboard-flyout__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M20 21a8 8 0 0 0-16 0"></path>
                                <circle cx="12" cy="8" r="4"></circle>
                            </svg>
                        </span>
                        <span class="cd-dashboard-flyout__label" th:text="#{ui.00402}">Coach</span>
                    </a>
                    <aside id="dashboardDrawerTrainer" class="cd-dashboard-flyout__panel" aria-label="Trainer overview" aria-hidden="true" inert th:attr="aria-label=#{ui.00403}">
                        <div class="cd-dashboard-flyout__panel-inner" tabindex="-1">
                            <div class="cd-dashboard-flyout__header">
                                <div>
                                    <p class="cd-kicker" th:text="#{ui.00404}">Trainer Overview</p>
                                    <p class="cd-dashboard-flyout__title" th:text="#{ui.00405}">Coaching snapshot</p>
                                </div>
                                <button type="button" class="cd-dashboard-flyout__close" data-dashboard-flyout-close aria-label="Close trainer overview panel" th:attr="aria-label=#{ui.00406}">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                        <path d="M8 8l8 8M16 8l-8 8"></path>
                                    </svg>
                                </button>
                            </div>
                            <div class="cd-dashboard-flyout__body">
                                <th:block th:replace="~{client-views/dashboard/fragments/client-dashboard-shell :: leftRailTrainer('trainer-premium-tooltip-mobile')}"></th:block>
                            </div>
                        </div>
                    </aside>
                </div>

                <div class="cd-dashboard-flyout cd-dashboard-flyout--dock" data-dashboard-flyout="goals">
                    <a th:href="@{/goals}"
                            class="cd-dashboard-flyout__handle"
                            data-dashboard-flyout-handle
                            aria-controls="dashboardDrawerGoals"
                            aria-expanded="false"
                            aria-label="Goals" th:attr="aria-label=#{ui.00408},data-panel-label=#{ui.00407}">
                        <span class="cd-dashboard-flyout__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M5 19 19 5"></path>
                                <circle cx="7" cy="17" r="2"></circle>
                                <circle cx="17" cy="7" r="2"></circle>
                            </svg>
                        </span>
                        <span class="cd-dashboard-flyout__label" th:text="#{ui.00408}">Goals</span>
                    </a>
                    <aside id="dashboardDrawerGoals" class="cd-dashboard-flyout__panel" aria-label="Goals overview" aria-hidden="true" inert th:attr="aria-label=#{ui.00409}">
                        <div class="cd-dashboard-flyout__panel-inner" tabindex="-1">
                            <div class="cd-dashboard-flyout__header">
                                <div>
                                    <p class="cd-kicker" th:text="#{ui.00408}">Goals</p>
                                    <p class="cd-dashboard-flyout__title" th:text="#{ui.00410}">Progress overview</p>
                                </div>
                                <button type="button" class="cd-dashboard-flyout__close" data-dashboard-flyout-close aria-label="Close goals panel" th:attr="aria-label=#{ui.00411}">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                        <path d="M8 8l8 8M16 8l-8 8"></path>
                                    </svg>
                                </button>
                            </div>
                            <div class="cd-dashboard-flyout__body">
                                <th:block th:replace="~{client-views/dashboard/fragments/client-dashboard-shell :: leftRailGoals('mobile')}"></th:block>
                            </div>
                        </div>
                    </aside>
                </div>

                <div class="cd-dashboard-flyout cd-dashboard-flyout--dock" data-dashboard-flyout="support">
                    <a th:href="@{/support}"
                            class="cd-dashboard-flyout__handle"
                            data-dashboard-flyout-handle
                            aria-controls="dashboardDrawerSupport"
                            aria-expanded="false"
                            aria-label="Help" th:attr="aria-label=#{ui.00413},data-panel-label=#{ui.00412}">
                        <span class="cd-dashboard-flyout__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4Z"></path>
                                <path d="m9.5 12 1.8 1.8L15 10"></path>
                            </svg>
                        </span>
                        <span class="cd-dashboard-flyout__label" th:text="#{ui.00413}">Help</span>
                    </a>
                    <aside id="dashboardDrawerSupport" class="cd-dashboard-flyout__panel" aria-label="Help and trust" aria-hidden="true" inert th:attr="aria-label=#{ui.00414}">
                        <div class="cd-dashboard-flyout__panel-inner" tabindex="-1">
                            <div class="cd-dashboard-flyout__header">
                                <div>
                                    <p class="cd-kicker" th:text="#{ui.00415}">Help and Trust</p>
                                    <p class="cd-dashboard-flyout__title" th:text="#{ui.00416}">Support shortcuts</p>
                                </div>
                                <button type="button" class="cd-dashboard-flyout__close" data-dashboard-flyout-close aria-label="Close help and trust panel" th:attr="aria-label=#{ui.00417}">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                        <path d="M8 8l8 8M16 8l-8 8"></path>
                                    </svg>
                                </button>
                            </div>
                            <div class="cd-dashboard-flyout__body">
                                <th:block th:replace="~{client-views/dashboard/fragments/client-dashboard-shell :: rightRailSupport}"></th:block>
                            </div>
                        </div>
                    </aside>
                </div>

                <div class="cd-dashboard-flyout cd-dashboard-flyout--dock" data-dashboard-flyout="profile">
                    <a th:href="@{/profile}"
                            class="cd-dashboard-flyout__handle"
                            data-dashboard-flyout-handle
                            aria-controls="dashboardDrawerProfile"
                            aria-expanded="false"
                            aria-label="Profile" th:attr="aria-label=#{ui.00419},data-panel-label=#{ui.00418}">
                        <span class="cd-dashboard-flyout__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M20 21a8 8 0 0 0-16 0"></path>
                                <circle cx="12" cy="8" r="4"></circle>
                            </svg>
                        </span>
                        <span class="cd-dashboard-flyout__label" th:text="#{ui.00419}">Profile</span>
                    </a>
                    <aside id="dashboardDrawerProfile" class="cd-dashboard-flyout__panel" aria-label="Profile overview" aria-hidden="true" inert th:attr="aria-label=#{ui.00420}">
                        <div class="cd-dashboard-flyout__panel-inner" tabindex="-1">
                            <div class="cd-dashboard-flyout__header">
                                <div>
                                    <p class="cd-kicker" th:text="#{ui.00421}">Your Profile</p>
                                    <p class="cd-dashboard-flyout__title" th:text="#{ui.00422}">Account snapshot</p>
                                </div>
                                <button type="button" class="cd-dashboard-flyout__close" data-dashboard-flyout-close aria-label="Close profile panel" th:attr="aria-label=#{ui.00423}">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                        <path d="M8 8l8 8M16 8l-8 8"></path>
                                    </svg>
                                </button>
                            </div>
                            <div class="cd-dashboard-flyout__body">
                                <th:block th:replace="~{client-views/dashboard/fragments/client-dashboard-shell :: rightRailProfile('profile-premium-tooltip-mobile')}"></th:block>
                            </div>
                        </div>
                    </aside>
                </div>
            </div>

            <div id="dashboardRoot" class="cd-dashboard-shell">
                <section class="cd-dashboard-main" aria-label="Dashboard overview" th:attr="aria-label=#{ui.00424}">
                    <th:block th:replace="~{client-views/dashboard/fragments/client-dashboard-shell :: mainColumn}"></th:block>
                </section>

                <aside id="dashboardLeftRail"
                       aria-label="Explore platform"
                       data-dashboard-left-rail
                       class="cd-dashboard-rail cd-dashboard-rail--left" th:attr="aria-label=#{ui.00397}">
                    <div class="cd-dashboard-rail__panel" tabindex="-1">
                        <div class="cd-dashboard-rail__content">
                            <th:block th:replace="~{client-views/dashboard/fragments/client-dashboard-shell :: leftRail}"></th:block>
                        </div>
                    </div>
                </aside>

                <aside id="dashboardRightRail"
                       aria-label="Help and trust"
                       data-dashboard-right-rail
                       class="cd-dashboard-rail cd-dashboard-rail--right" th:attr="aria-label=#{ui.00414}">
                    <div class="cd-dashboard-rail__panel" tabindex="-1">
                        <div class="cd-dashboard-rail__content">
                            <th:block th:replace="~{client-views/dashboard/fragments/client-dashboard-shell :: rightRail}"></th:block>
                        </div>
                    </div>
                </aside>
            </div>
        </section>
    </div>

    <th:block th:fragment="pageScripts">
        <script th:src="@{/js/dashboard/client-dashboard-page.js(v=${uiCssVersion})}" defer></script>
    </th:block>
</th:block>
