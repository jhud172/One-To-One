<th:block xmlns:th="http://www.thymeleaf.org">
    <th:block th:fragment="banner(identity, tooltipId)">
        <div class="profile-identity-banner cd-identity-banner"
             th:classappend="${identity != null and identity.bannerTheme != null ? ' profile-banner-pill--' + #strings.toLowerCase(identity.bannerTheme) : ' profile-banner-pill--aurora'}">
            <div class="profile-identity-banner__row">
                <div class="profile-avatar-ring profile-identity-banner__avatar"
                     th:classappend="${identity != null and identity.ringStyle != null ? ' profile-avatar-ring--' + #strings.toLowerCase(identity.ringStyle) : ''}">
                    <img th:if="${identity != null and identity.imageUrl != null and !#strings.isEmpty(identity.imageUrl)}"
                         th:src="${identity.imageUrl}"
                         alt="Profile photo"
                         class="h-full w-full object-cover"  th:alt="#{ui.00426}"/>
                    <span th:if="${identity == null or identity.imageUrl == null or #strings.isEmpty(identity.imageUrl)}"
                          th:text="${identity != null ? identity.initial : 'U'}">U</span>
                </div>
                <div class="profile-identity-banner__text text-left">
                    <div class="profile-identity-banner__name-row">
                        <span class="profile-identity-banner__name"
                              th:text="${identity != null ? identity.displayName : 'Profile'}">Profile</span>
                        <div th:if="${identity != null and identity.premium}"
                             class="nav-premium-badge-group"
                             data-premium-badge-group
                             data-open="false"
                             aria-label="Premium member" th:attr="aria-label=#{ui.00427}">
                            <button type="button"
                                    class="nav-premium-badge premium-orb-badge"
                                    data-premium-toggle
                                    aria-label="Premium membership details"
                                    aria-expanded="false"
                                    th:attr="aria-controls=${tooltipId},aria-label=#{ui.00428}">
                                <svg class="nav-premium-badge__icon" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                </svg>
                            </button>
                            <div th:id="${tooltipId}" class="nav-premium-tooltip" role="status"
                                 th:text="${identity.premiumTooltip}">Premium Active</div>
                        </div>
                    </div>
                    <p class="profile-identity-banner__handle">
                        @<span th:text="${identity != null ? identity.username : 'user'}">user</span>
                    </p>
                </div>
            </div>
        </div>
    </th:block>
</th:block>
