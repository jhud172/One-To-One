<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.00223}, null, ~{::content}, null)}">
    <div th:fragment="content" class="client-workspace-v2 assessment-workspace-v2">
        <nav class="client-workspace-nav" th:attr="aria-label=#{ui.00223}">
            <a th:href="@{/trainer/clients}" th:text="#{ui.02985}">Clients</a>
            <a th:href="@{/trainer/assessments}" th:text="#{ui.assessment.history}">Private assessment history</a>
        </nav>
        <header class="detail-header">
            <p class="detail-label" th:text="#{ui.00223}">Client assessment</p>
            <h1 class="detail-title" th:text="${client.fullName}"></h1>
            <p class="detail-subtitle" th:text="#{ui.00224}">This assessment is private and only visible to you.</p>
        </header>
        <p th:if="${assessmentSaved == true}" role="status" class="checkin-feedback" th:text="#{ui.assessment.saved}">Private assessment saved.</p>
        <p th:if="${assessmentError == true}" role="alert" class="checkin-review-error" th:text="#{ui.assessment.invalid}">Scores must be between 1 and 5. Notes must be no more than 10,000 characters.</p>
        <form th:action="@{/trainer/clients/{id}/assessment(id=${client.id})}" method="post" class="detail-section client-checkin-form">
            <div class="detail-grid-2">
                <div>
                    <label for="reliabilityScore" th:text="#{ui.00225}">Reliability score (1–5)</label>
                    <p id="reliabilityHint" class="detail-subtitle" th:text="#{ui.00226}"></p>
                    <input id="reliabilityScore" type="number" name="reliabilityScore" min="1" max="5" step="1" aria-describedby="reliabilityHint" th:value="${assessmentDraft != null ? assessmentDraft.reliabilityScore : assessment?.reliabilityScore}"/>
                </div>
                <div>
                    <label for="communicationScore" th:text="#{ui.00227}">Communication score (1–5)</label>
                    <p id="communicationHint" class="detail-subtitle" th:text="#{ui.00228}"></p>
                    <input id="communicationScore" type="number" name="communicationScore" min="1" max="5" step="1" aria-describedby="communicationHint" th:value="${assessmentDraft != null ? assessmentDraft.communicationScore : assessment?.communicationScore}"/>
                </div>
            </div>
            <div>
                <label for="privateNotes" th:text="#{ui.00229}">Private notes</label>
                <p id="privateNotesHint" class="detail-subtitle" th:text="#{ui.00230}"></p>
                <textarea id="privateNotes" name="privateNotes" rows="8" maxlength="10000" aria-describedby="privateNotesHint" th:text="${assessmentDraft != null ? assessmentDraft.privateNotes : assessment?.privateNotes}" th:placeholder="#{ui.00231}"></textarea>
            </div>
            <div class="connection-actions">
                <a th:href="@{/trainer/clients}" class="detail-btn-secondary" th:text="#{ui.00125}">Cancel</a>
                <button type="submit" class="detail-btn-primary" th:text="#{ui.00232}">Save assessment</button>
            </div>
        </form>
    </div>
</th:block>
