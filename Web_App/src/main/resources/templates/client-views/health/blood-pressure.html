<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.00688}, null, ~{::content}, ~{::pageScripts})}">
<div th:fragment="content" class="client-workspace-v2 personal-records-v2 blood-pressure-v2">
<header class="detail-header"><div class="detail-header-content"><div><h1 class="detail-title" th:text="#{ui.00688}"></h1><p class="detail-subtitle" th:text="#{ui.00689}"></p></div><a class="detail-btn-secondary" th:href="@{/health-record/list}" th:text="#{ui.00665}"></a></div><p th:if="${bpSaved}" class="checkin-feedback" role="status" th:text="#{preferences.saved}"></p><p th:if="${bpDeleted}" class="checkin-feedback" role="status" th:text="#{ui.bp.deleted}"></p><p th:if="${bpChanged}" class="profile-editor-errors" role="alert" th:text="#{ui.bp.changed}"></p></header>
<section class="detail-section"><h2 class="detail-section-title" th:text="#{ui.bp.scopeTitle}"></h2><p class="health-record-help" th:text="#{ui.bp.scopeHint}"></p></section>
<div class="personal-record-layout"><section class="detail-section"><h2 class="detail-section-title" th:text="#{ui.00690}"></h2><form class="connection-search" method="get" th:action="@{/health/blood-pressure}"><label for="readingRange" th:text="#{ui.00702}"></label><div><select id="readingRange" name="range"><option value="7" th:selected="${range == 7}" th:text="#{ui.00703}"></option><option value="30" th:selected="${range == 30}" th:text="#{ui.00704}"></option><option value="90" th:selected="${range == 90}" th:text="#{ui.00705}"></option><option th:if="${range != 7 and range != 30 and range != 90}" th:value="${range}" selected th:text="${range}"></option></select><button class="detail-btn-primary" type="submit" th:text="#{ui.00925}"></button></div></form><p class="health-record-help" th:text="#{ui.bp.rangeHint}"></p><p><bdi dir="ltr" th:text="${bpFrom + ' – ' + today}"></bdi></p><dl class="library-exercise-facts"><div><dt th:text="#{ui.00661}"></dt><dd><bdi dir="ltr" th:if="${stats.totalReadings > 0}"><span th:text="${stats.avgSystolic}"></span> / <span th:text="${stats.avgDiastolic}"></span> <span th:text="#{ui.00635}"></span></bdi><span th:unless="${stats.totalReadings > 0}">—</span></dd></div><div><dt th:text="#{ui.00693}"></dt><dd dir="ltr" th:text="${stats.totalReadings}"></dd></div><div><dt th:text="#{ui.00694}"></dt><dd dir="ltr" th:text="${stats.daysLogged}"></dd></div><div><dt th:text="#{ui.00691}"></dt><dd><bdi dir="ltr" th:text="${streak}"></bdi> <span th:text="${streak == 1} ? #{ui.bp.oneDay} : #{ui.00692}"></span></dd></div></dl><a class="detail-btn-secondary" href="https://www.nhs.uk/health-assessment-tools/check-your-blood-pressure-reading" target="_blank" rel="noopener noreferrer" th:text="#{ui.bp.nhs}"></a></section>
<form class="detail-section profile-editor-form" th:action="@{/health/blood-pressure}" th:object="${quickAdd}" method="post" data-bp-reading-form th:attr="data-unsaved=#{ui.bp.unsaved},data-rejected=${#fields.hasAnyErrors()}"><input type="hidden" name="range" th:value="${range}"><input type="hidden" name="page" th:value="${bpPage}"><th:block th:replace="~{client-views/health/fragments/reading-form :: errors}"></th:block><th:block th:replace="~{client-views/health/fragments/reading-form :: fields}"></th:block><button class="detail-btn-primary" type="submit" th:text="#{ui.00700}"></button></form></div>
<section class="detail-section"><h2 class="detail-section-title" th:text="#{ui.00701}"></h2><p class="health-record-help" th:text="#{ui.bp.historyHint}"></p><p class="personal-history-count" role="status" th:text="#{ui.library.resultsRange(${bpStart},${bpEnd},${bpTotal})}"></p><p th:if="${#lists.isEmpty(recent)}" class="detail-empty" th:text="#{ui.00706}"></p><ol class="detail-list"><li th:each="reading : ${recent}" class="detail-list-item bp-history-card"><th:block th:replace="~{client-views/health/fragments/reading-summary :: summary(${reading})}"></th:block><div class="connection-actions"><a class="detail-btn-secondary" th:href="@{/health/blood-pressure/edit/{id}(id=${reading.id},range=${range},page=${bpPage})}" th:attr="aria-label=${#messages.msg('ui.00138') + ' · ' + reading.readingDate + ' ' + (reading.readingTime ?: '')}"><span th:text="#{ui.00138}"></span></a><form method="post" th:attr="data-confirm=#{ui.bp.deleteConfirm}" th:action="@{/health/blood-pressure/delete/{id}(id=${reading.id})}"><input type="hidden" name="range" th:value="${range}"><input type="hidden" name="page" th:value="${bpPage}"><input type="hidden" name="expectedRevision" th:value="${bpRevisions[reading.id]}"><button class="detail-btn-destructive" type="submit"><span th:text="#{ui.00139}"></span>: <bdi dir="ltr" th:text="${reading.readingDate + ' ' + (reading.readingTime ?: '')}"></bdi></button></form></div></li></ol>
<nav th:if="${bpPageCount > 1}" class="connection-actions" th:attr="aria-label=#{ui.00105}"><a th:if="${bpPage > 1}" class="detail-btn-secondary" th:href="@{/health/blood-pressure(range=${range},page=${bpPage-1})}" th:aria-label="${#messages.msg('ui.00105')+' '+(bpPage-1)}"><span aria-hidden="true">←</span> <span th:text="${bpPage-1}"></span></a><p aria-current="page"><span th:text="#{ui.00105}"></span> <bdi dir="ltr" th:text="${bpPage}"></bdi> <span th:text="#{ui.00983}"></span> <bdi dir="ltr" th:text="${bpPageCount}"></bdi></p><a th:if="${bpPage < bpPageCount}" class="detail-btn-secondary" th:href="@{/health/blood-pressure(range=${range},page=${bpPage+1})}" th:text="#{ui.03032}"></a></nav></section>
</div><th:block th:fragment="pageScripts"><script th:src="@{/js/health/blood-pressure.js(v=${assetVersion})}" defer></script></th:block></th:block>
