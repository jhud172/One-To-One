<th:block xmlns:th="http://www.thymeleaf.org"><div th:fragment="summary(reading)"><h3 class="detail-card-title" dir="ltr"><time dir="ltr" th:datetime="${reading.readingDate}" th:text="${reading.readingDate}"></time><bdi th:if="${reading.readingTime != null}" dir="ltr" th:text="${' · ' + #temporals.format(reading.readingTime,'HH:mm')}"></bdi></h3><p class="blood-pressure-value"><bdi dir="ltr"><span th:text="${reading.systolic ?: '—'}"></span> / <span th:text="${reading.diastolic ?: '—'}"></span> <span th:text="#{ui.00635}"></span></bdi></p><dl class="library-exercise-facts"><div><dt th:text="#{ui.00682}"></dt><dd dir="ltr" th:text="${reading.pulse ?: '—'}"></dd></div><div><dt th:text="#{ui.00683}"></dt><dd th:text="${reading.arm != null ? #messages.msg(bpArmLabels[reading.arm.name()]) : '—'}"></dd></div><div><dt th:text="#{ui.00685}"></dt><dd th:text="${reading.position != null ? #messages.msg(bpPositionLabels[reading.position.name()]) : '—'}"></dd></div></dl><p class="plan-coaching-note" dir="auto" th:if="${reading.notes != null and !#strings.isEmpty(reading.notes)}" th:text="${reading.notes}"></p></div></th:block>
