<th:block xmlns:th="http://www.thymeleaf.org">
<div th:fragment="errors" th:if="${#fields.hasAnyErrors()}" id="bp-errors" class="profile-editor-errors" role="alert"><h2 th:text="#{auth.form.fixErrors}"></h2><p th:text="#{ui.bp.invalid}"></p><p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p><ul><li th:if="${#fields.hasErrors('readingDate')}"><a href="#readingDate" th:text="#{ui.00660}"></a></li><li th:if="${#fields.hasErrors('readingTime')}"><a href="#readingTime" th:text="#{ui.00055}"></a></li><li th:if="${#fields.hasErrors('systolic')}"><a href="#systolic" th:text="#{ui.00680}"></a></li><li th:if="${#fields.hasErrors('diastolic')}"><a href="#diastolic" th:text="#{ui.00681}"></a></li><li th:if="${#fields.hasErrors('pulse')}"><a href="#pulse" th:text="#{ui.00682}"></a></li><li th:if="${#fields.hasErrors('arm')}"><a href="#arm" th:text="#{ui.00683}"></a></li><li th:if="${#fields.hasErrors('position')}"><a href="#position" th:text="#{ui.00685}"></a></li><li th:if="${#fields.hasErrors('notes')}"><a href="#notes" th:text="#{ui.00175}"></a></li></ul></div>
<fieldset th:fragment="fields"><legend class="detail-section-title" th:text="#{ui.00695}"></legend><p id="bp-required-help" class="health-record-help" th:text="#{ui.bp.optionalHint}"></p><p id="bp-time-help" class="health-record-help" th:text="#{ui.bp.timeHint}"></p><div class="profile-editor-fields"><div><label for="readingDate" th:text="#{ui.00660}"></label><input id="readingDate" type="date" required th:field="*{readingDate}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('readingDate')},aria-describedby=${#fields.hasErrors('readingDate') ? 'bp-required-help bp-readingDate-error' : 'bp-required-help'}"><p th:if="${#fields.hasErrors('readingDate')}" id="bp-readingDate-error" class="health-record-help" th:text="#{ui.bp.fieldInvalid}"></p><p th:if="${bpMalformedreadingDate}" class="personal-history-rejected" dir="ltr" th:text="${bpDraftreadingDate}"></p></div><div><label for="readingTime" th:text="#{ui.00055}"></label><input id="readingTime" type="time"  th:field="*{readingTime}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('readingTime')},aria-describedby=${#fields.hasErrors('readingTime') ? 'bp-time-help bp-readingTime-error' : 'bp-time-help'}"><p th:if="${#fields.hasErrors('readingTime')}" id="bp-readingTime-error" class="health-record-help" th:text="#{ui.bp.fieldInvalid}"></p><p th:if="${bpMalformedreadingTime}" class="personal-history-rejected" dir="ltr" th:text="${bpDraftreadingTime}"></p></div><div><label for="systolic" th:text="#{ui.00680}"></label><input id="systolic" type="text" required th:field="*{systolic}" inputmode="numeric" maxlength="3" pattern="[0-9]{1,3}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('systolic')},aria-describedby=${#fields.hasErrors('systolic') ? 'bp-required-help bp-systolic-error' : 'bp-required-help'}"><p th:if="${#fields.hasErrors('systolic')}" id="bp-systolic-error" class="health-record-help" th:text="#{ui.bp.fieldInvalid}"></p><p class="health-record-help" dir="ltr">60–250 mmHg</p></div><div><label for="diastolic" th:text="#{ui.00681}"></label><input id="diastolic" type="text" required th:field="*{diastolic}" inputmode="numeric" maxlength="3" pattern="[0-9]{1,3}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('diastolic')},aria-describedby=${#fields.hasErrors('diastolic') ? 'bp-required-help bp-diastolic-error' : 'bp-required-help'}"><p th:if="${#fields.hasErrors('diastolic')}" id="bp-diastolic-error" class="health-record-help" th:text="#{ui.bp.fieldInvalid}"></p><p class="health-record-help" dir="ltr">40–150 mmHg</p></div><div><label for="pulse" th:text="#{ui.00682}"></label><input id="pulse" type="text"  th:field="*{pulse}" inputmode="numeric" maxlength="3" pattern="[0-9]{1,3}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('pulse')},aria-describedby=${#fields.hasErrors('pulse') ? 'bp-required-help bp-pulse-error' : 'bp-required-help'}"><p th:if="${#fields.hasErrors('pulse')}" id="bp-pulse-error" class="health-record-help" th:text="#{ui.bp.fieldInvalid}"></p><p class="health-record-help" dir="ltr">30–220 bpm</p></div></div><details class="personal-record-preview" th:open="${#fields.hasErrors('notes') or #fields.hasErrors('arm') or #fields.hasErrors('position')}"><summary th:text="#{ui.02100}"></summary><p id="bp-optional-help" class="health-record-help" th:text="#{ui.bp.optionalHint}"></p><div class="profile-editor-fields"><div><label for="arm" th:text="#{ui.00683}"></label><select id="arm" th:field="*{arm}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('arm')},aria-describedby=${#fields.hasErrors('arm') ? 'bp-arm-error bp-arm-draft' : 'bp-optional-help'}"><option value="" th:text="#{ui.00684}"></option><option th:each="choice : ${arms}" th:value="${choice}" th:text="${#messages.msg(bpArmLabels[choice.name()])}"></option></select><p th:if="${#fields.hasErrors('arm')}" id="bp-arm-error" class="health-record-help" th:text="#{ui.bp.fieldInvalid}"></p><p th:if="${bpMalformedarm}" id="bp-arm-draft" class="personal-history-rejected" dir="auto" th:text="${bpDraftarm}"></p></div><div><label for="position" th:text="#{ui.00685}"></label><select id="position" th:field="*{position}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('position')},aria-describedby=${#fields.hasErrors('position') ? 'bp-position-error bp-position-draft' : 'bp-optional-help'}"><option value="" th:text="#{ui.00684}"></option><option th:each="choice : ${positions}" th:value="${choice}" th:text="${#messages.msg(bpPositionLabels[choice.name()])}"></option></select><p th:if="${#fields.hasErrors('position')}" id="bp-position-error" class="health-record-help" th:text="#{ui.bp.fieldInvalid}"></p><p th:if="${bpMalformedposition}" id="bp-position-draft" class="personal-history-rejected" dir="auto" th:text="${bpDraftposition}"></p></div></div><label for="notes" th:text="#{ui.00175}"></label><textarea id="notes" rows="4" maxlength="500" dir="auto" th:field="*{notes}" th:errorclass="profile-field-invalid" th:attr="aria-invalid=${#fields.hasErrors('notes')},aria-describedby=${#fields.hasErrors('notes') ? 'bp-notes-error' : 'bp-optional-help'}"></textarea><p th:if="${#fields.hasErrors('notes')}" id="bp-notes-error" class="health-record-help" th:text="#{ui.bp.fieldInvalid}"></p></details></fieldset>
</th:block>
