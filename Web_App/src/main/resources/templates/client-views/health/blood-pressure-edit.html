<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(#{ui.00687}, null, ~{::content}, ~{::pageScripts})}">
<div th:fragment="content" class="client-workspace-v2 personal-records-v2 blood-pressure-v2"><header class="detail-header"><div class="detail-header-content"><div><h1 class="detail-title" th:text="#{ui.00678}"></h1><p class="detail-subtitle" th:text="#{ui.bp.editHint}"></p></div><a class="detail-btn-secondary" th:href="@{/health/blood-pressure(range=${range},page=${bpPage})}" data-bp-cancel th:text="#{ui.00677}"></a></div></header>
<section class="detail-section"><h2 class="detail-section-title" th:text="#{ui.bp.scopeTitle}"></h2><p class="health-record-help" th:text="#{ui.bp.scopeHint}"></p></section>
<section th:if="${bpConflict}" class="detail-section bp-conflict"><h2 class="detail-section-title" th:text="#{ui.bp.latest}"></h2><th:block th:replace="~{client-views/health/fragments/reading-summary :: summary(${bpLatest})}"></th:block></section>
<form class="detail-section profile-editor-form" th:action="@{/health/blood-pressure/edit/{id}(id=${reading.id})}" th:object="${reading}" method="post" data-bp-reading-form th:attr="data-unsaved=#{ui.bp.unsaved},data-rejected=${#fields.hasAnyErrors()}"><input type="hidden" name="range" th:value="${range}"><input type="hidden" name="page" th:value="${bpPage}"><input type="hidden" name="expectedRevision" th:value="${bpRevision}"><h2 th:if="${bpConflict}" class="detail-section-title" th:text="#{ui.bp.draft}"></h2><th:block th:replace="~{client-views/health/fragments/reading-form :: errors}"></th:block><th:block th:replace="~{client-views/health/fragments/reading-form :: fields}"></th:block><div class="connection-actions"><button class="detail-btn-primary" type="submit" th:text="${bpConflict} ? #{ui.bp.reviewedSave} : #{ui.00686}"></button><a class="detail-btn-secondary" th:href="@{/health/blood-pressure(range=${range},page=${bpPage})}" data-bp-cancel th:text="#{ui.00125}"></a></div></form></div>
<th:block th:fragment="pageScripts"><script th:src="@{/js/health/blood-pressure.js(v=${assetVersion})}" defer></script></th:block></th:block>
