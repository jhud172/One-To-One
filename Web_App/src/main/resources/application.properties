spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:}
spring.datasource.hikari.data-source-properties.sslmode=${PGSSLMODE:require}
spring.datasource.hikari.data-source-properties.connectTimeout=${PG_CONNECT_TIMEOUT:10}

# HikariCP connection pool configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=HikariPool-Calendar

spring.security.jdbc.users-by-username-query=select username, password, enabled from users where username=?
spring.security.jdbc.authorities-by-username-query=select username, authority from user_authorities where username=?

spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=false
spring.sql.init.schema-locations=classpath:schema.sql

spring.sql.init.data-locations=classpath:data/*.sql
spring.flyway.enabled=false

app.dev-mode=${DEV_MODE:false}

# Ordered public-page translations. English is the base bundle; Welsh uses _cy.
spring.messages.basename=messages,messages-home,messages-ui,messages-logo
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

debug=false
logging.level.root=INFO
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.org.springframework.boot.devtools=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.uk.ac.cf._5.group14=INFO
server.port=${PORT:8080}

# Authentication-safe operational probes. Only the two status-only probe
# groups are exposed publicly by SecurityConfig.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace

# Retain privileged-action evidence long enough for incident investigation.
app.operations.audit-retention-days=${APP_AUDIT_RETENTION_DAYS:180}

# Compress text responses at the embedded server and let static resources be
# reused for one day. Versioned CSS/JS URLs provide explicit cache busting.
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
spring.web.resources.cache.use-last-modified=true
spring.web.resources.cache.cachecontrol.max-age=1d
spring.web.resources.cache.cachecontrol.cache-public=true

# API key for OpenAI chat integration. Provide via environment variable OPENAI_API_KEY.
openai.api.key=${OPENAI_API_KEY:}
app.ai.enabled=${APP_AI_ENABLED:true}
app.ai.model=${APP_AI_MODEL:gpt-4o-mini}
app.ai.timeout-ms=${APP_AI_TIMEOUT_MS:20000}
app.ai.disclosure=${APP_AI_DISCLOSURE:Coach responses may use your recent training, schedule, and progress data to generate a reply. Avoid sharing card details or other sensitive secrets in AI chat.}

app.payments.currency=${APP_PAYMENTS_CURRENCY:gbp}
app.payments.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.payments.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.encryption.card-key=${APP_ENCRYPTION_CARD_KEY:}
app.encryption.require-persistent-key=${APP_ENCRYPTION_REQUIRE_PERSISTENT_KEY:false}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.path=/error

# Base URL used in emails (override in production)
app.site.base-url=${APP_BASE_URL:https://crystal-production.com}
# Optional from address for email
app.email.from=${APP_EMAIL_FROM:}
# Select "smtp" only when SMTP delivery is fully configured.
app.email.provider=${APP_EMAIL_PROVIDER:none}
# If true, throw when SMTP send fails instead of silently continuing
app.email.fail-on-error=${APP_EMAIL_FAIL_ON_ERROR:true}

# SMTP settings for real email delivery (used when app.email.provider=smtp)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.protocols=${SPRING_MAIL_SMTP_SSL_PROTOCOLS:TLSv1.2}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SMTP_SSL_TRUST:}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}

# Daily protein nudge schedule (local server time)
app.notifications.proteinNudgeCron=0 0 18 * * *

# SMS verification delivery
app.sms.provider=${APP_SMS_PROVIDER:console}
app.sms.fail-on-error=${APP_SMS_FAIL_ON_ERROR:false}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
app.sms.twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}

# Multipart limits (profile image upload + Charlie image uploads)
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=25MB
# Tomcat rejects an oversized multipart request before consuming its body.
# Drain one bounded request so the client can receive the structured 413.
server.tomcat.max-swallow-size=32MB
app.storage.profile-dir=${APP_STORAGE_PROFILE_DIR:uploads/profile}
app.storage.chat-dir=${APP_STORAGE_CHAT_DIR:uploads/chat}
app.storage.merch-dir=${APP_STORAGE_MERCH_DIR:uploads/merch}
app.storage.workout-video-dir=${APP_STORAGE_WORKOUT_VIDEO_DIR:uploads/workout-videos}

# Social sign-in (client and trainer only)
app.oauth.google-login-active=${APP_OAUTH_GOOGLE_LOGIN_ACTIVE:false}
app.oauth.microsoft-login-active=${APP_OAUTH_MICROSOFT_LOGIN_ACTIVE:false}
app.oauth.apple-login-active=${APP_OAUTH_APPLE_LOGIN_ACTIVE:false}

spring.security.oauth2.client.registration.google.client-id=${APP_OAUTH_GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${APP_OAUTH_GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.microsoft.client-id=${APP_OAUTH_MICROSOFT_CLIENT_ID:}
spring.security.oauth2.client.registration.microsoft.client-secret=${APP_OAUTH_MICROSOFT_CLIENT_SECRET:}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.microsoft.client-name=Microsoft
spring.security.oauth2.client.provider.microsoft.issuer-uri=${APP_OAUTH_MICROSOFT_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}

spring.security.oauth2.client.registration.apple.client-id=${APP_OAUTH_APPLE_CLIENT_ID:}
spring.security.oauth2.client.registration.apple.client-secret=${APP_OAUTH_APPLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.apple.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.apple.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.apple.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.apple.scope=openid,email,name
spring.security.oauth2.client.registration.apple.client-name=Apple
spring.security.oauth2.client.provider.apple.issuer-uri=${APP_OAUTH_APPLE_ISSUER_URI:https://appleid.apple.com}
