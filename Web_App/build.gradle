plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id "com.github.ben-manes.versions" version "0.54.0"
}

group = 'uk.ac.cf.2025.group14'
version = '2.0.0-SNAPSHOT'
description = 'One To One coaching platform — Version 2.0 preview.'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

jacocoTestReport {
	dependsOn test

	reports {
		xml.required = true
		csv.required = false
		html.required = true
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

def isNonStable = { String version ->
	def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { keyword -> version?.toUpperCase()?.contains(keyword) }
	def stableVersion = (version ==~ /^[0-9,.v-]+(-r)?$/)
	return !(stableKeyword || stableVersion)
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	compileOnly 'org.projectlombok:lombok:1.18.46'
	annotationProcessor 'org.projectlombok:lombok:1.18.46'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6:3.1.5.RELEASE'
	implementation 'com.github.librepdf:openpdf:1.3.30'
	implementation 'org.jsoup:jsoup:1.22.2'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.session:spring-session-jdbc'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql:42.7.11'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'com.squareup.okhttp3:okhttp:4.12.0'
	runtimeOnly 'com.h2database:h2'
}

tasks.named('bootJar') {
	archiveFileName = 'one-to-one.jar'
}

tasks.named('test') {
	useJUnitPlatform()
	maxHeapSize = '1g'
	exclude '**/UserRepositoryTest.*'
	exclude '**/UserPreferenceFullContainerMockTests.*'
}

compileJava {
	options.compilerArgs << '-parameters'
}

compileTestJava {
	options.compilerArgs << '-Xlint:unchecked'
	options.compilerArgs << '-parameters'
}

tasks.named('processResources') {
	// The watched marker belongs to its own classpath directory, outside copied resources.
	exclude '.reloadtrigger'
}

def localPreviewControlDirectory = layout.buildDirectory.dir('local-preview-control')
tasks.register('prepareLocalPreviewMarker') {
	group = 'application'
	description = 'Create the local preview reload marker without changing an existing marker.'
	inputs.file('src/main/resources/.reloadtrigger')
	outputs.file(localPreviewControlDirectory.map { it.file('.reloadtrigger') })
	doLast {
		def trigger = localPreviewControlDirectory.get().file('.reloadtrigger').asFile
		if (!trigger.isFile()) {
			trigger.parentFile.mkdirs()
			trigger.bytes = file('src/main/resources/.reloadtrigger').bytes
		}
	}
}

tasks.register('reloadLocalPreview') {
	group = 'application'
	description = 'Compile classes/resources, then trigger one safe local DevTools reload.'
	dependsOn tasks.named('classes'), tasks.named('prepareLocalPreviewMarker')
	doLast {
		def trigger = localPreviewControlDirectory.get().file('.reloadtrigger').asFile
		if (!trigger.isFile() || !trigger.setLastModified(System.currentTimeMillis())) {
			throw new GradleException('Local reload marker could not be touched after compilation.')
		}
		logger.lifecycle('Local preview reload requested after complete classes/resources output.')
	}
}

tasks.named('bootRun') {
	dependsOn tasks.named('prepareLocalPreviewMarker')
	classpath += files(localPreviewControlDirectory)
	doFirst {
		def systemProfile = System.getProperty('spring.profiles.active')
		def environmentProfile = System.getenv('SPRING_PROFILES_ACTIVE')
		def effectiveProfile = systemProfile ?: environmentProfile ?: (System.getenv('RENDER') == 'true' ? 'render' : 'local')
		if (!environmentProfile) {
			environment 'SPRING_PROFILES_ACTIVE', effectiveProfile
		}

		def localDatabaseKeys = [
				'DATABASE_URL',
				'DATABASE_USER',
				'DATABASE_PASSWORD',
				'DATABASE_DRIVER',
				'PGHOST',
				'PGPORT',
				'PGDATABASE',
				'PGUSER',
				'PGPASSWORD',
				'PGSSLMODE'
		] as Set
		def usesLocalDatabase = effectiveProfile.split(',').any { profile ->
			profile.trim() in ['local', 'test']
		}

		def repoRootEnvFile = rootProject.projectDir.toPath().resolve('..').resolve('.env').normalize().toFile()
		def envFile = repoRootEnvFile.exists() ? repoRootEnvFile : file('.env')
		if (!envFile.exists()) {
			return
		}

		envFile.eachLine { line ->
			def trimmed = line?.trim()
			if (!trimmed || trimmed.startsWith('#') || !trimmed.contains('=')) {
				return
			}

			def separator = trimmed.indexOf('=')
			def key = trimmed.substring(0, separator).trim()
			def value = trimmed.substring(separator + 1).trim()
			if (usesLocalDatabase && key in localDatabaseKeys) {
				return
			}

			if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
				value = value.substring(1, value.length() - 1)
			}

			environment key, value
		}
	}
}

tasks.named('dependencyUpdates').configure {
	rejectVersionIf {
		isNonStable(it.candidate.version) && !isNonStable(it.currentVersion)
	}
}

tasks.register('bcrypt', JavaExec) {
	group = 'help'
	description = 'Prints a BCrypt hash for -Ppw (defaults to Demo123!)'
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
	}
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'uk.ac.cf._5.group14.One_To_One.Security.BcryptTool'
	args((project.findProperty('pw') ?: 'Demo123!').toString())
}
